[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-app-core"
version = "0.3.0.dev0"
description = "RT-App for Python: singleton providers, NoSQL store, feature flags, web app (server, Lambda, CLI) and contract host"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.optional-dependencies]
# Only what a component needs: auth sealing (AES-GCM), PostgreSQL and DynamoDB stores.
crypto = ["cryptography>=46"]
postgres = ["psycopg[binary]>=3.2"]
dynamodb = ["boto3>=1.40"]
all = ["cryptography>=46", "psycopg[binary]>=3.2", "boto3>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rt_app_core = ["py.typed"]
rt_app = ["py.typed"]
