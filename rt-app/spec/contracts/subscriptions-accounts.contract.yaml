contract: 1
module: subscriptions-accounts
subject: subscriptions
title: Subscriptions service - accounts, plan changes, payments, grants and resets
description: |
  Account operations of the Subscriptions service through the `subscriptions` facade (see
  subscriptions-settings for init and helpers). Users are actors {id, email, role}. Accounts live
  in SUB_ACCOUNTS/<userId>; times are epoch milliseconds of the injected clock. Days are 86400000
  ms; a plan period is periodDays days. JavaScript Math.floor/Math.round, JSON.stringify and
  String(number) semantics apply (see polyglot.md).

  normalized(data) (applied before reads and writes, with now = the clock):
    - an unpaid (mode "none") active plan without cancelAtPeriodEnd and now >= periodEnd renews:
      periods = floor((now - periodStart) / step), periodStart += periods*step, periodEnd =
      periodStart + step, counters = {} (step = periodDays days);
    - every plan product gets counters {period: 0, day: 0, week: 0, dayStart: periodStart,
      weekStart: periodStart} when missing; a day/week window whose start + seconds*1000 <= now
      moves forward by whole windows and its counter resets to 0;
    - an adminGrant is normalized the same way.
  effective(data) = data.adminGrant when it is active and now < its periodEnd, else data.

  me(userId) -> the normalized account without billingOperation/adminGrant, overlaid with the
  effective entitlement when it is an admin grant, plus: userId, assignedByAdmin,
  pendingBillingRequest ({requestId, action, planId} of the pending SUB_BILLING_OP row),
  active (status active, now < periodEnd, and when payments are required the mode is "admin" or
  the provider's mode), version (row version or 0), paymentRequired, provider, publishableKey,
  plans (enabled plans), usage per plan product {...product, used: period counter, remaining
  (allowanceLeft + additional credits), allowanceLeft, extraCredits, dayUsed, weekUsed,
  dayResetAt, weekResetAt}. Without an account: {userId, status: "none", counters: {},
  notifications: true, ...}.
  preferences(userId, enabled): boolean else 400 "Invalid notification preference".
  change(user, planId, key), unpaid mode: id(key); an active admin grant -> 409 "An
  administrator-assigned plan is active. Contact your administrator to change it."; the plan must
  exist and be enabled (404 "Plan not found"); the key replays SUB_OP#<user>/<key> (another plan
  under that key -> Conflict); an account with customerId or subscriptionId -> 409 "Cancel and
  reconcile the paid subscription before switching to unpaid mode"; continuing (active, now <
  periodEnd) on the same plan -> 409 "Already subscribed to this plan". Continuing keeps the
  period and counters; otherwise a new period starts now. Writes: account, SUB_OP, settled window
  entries, a plan ledger entry ("Plan started: <name>" / "Plan changed to <name>", seed
  "plan:<key>"), SUB_STATS day:<YYYY-MM-DD> new += 1 when not continuing, and an audit row
  {userId, action: "plan-change", planId, at}. Returns {ok: true}.
  Paid mode (paymentRequired): billing operations persist SUB_BILLING_OP#<user>/<key>
  {fingerprint: sha256hex(JSON.stringify(input without plan)), input, started} and mark the
  account (billingOperation = key) before calling the provider; a replay with another input ->
  Conflict; a stored result is returned as is; another pending key -> 409 "Another billing
  operation is pending. Retry it before starting a new one."; a pending operation older than 23
  hours -> 409 "Billing operation needs reconciliation; do not create another payment"; no
  provider -> 503 "Payments are not configured". The customer is created once
  (SUB_CUSTOMERS/<customerId> {userId}); after the provider call the result is stored, the
  account clears billingOperation (and sets subscriptionId / pendingPlan), then sync(userId).
  LocalBilling: customer "local_<userId>", subscription "sub_<customer>", invoices "sim_<key>".
  cancel(user, key): with a paid subscription a billing operation; else 404 "No subscription"
  without an effective plan, {ok: true} when already canceling, otherwise cancelAtPeriodEnd,
  a plan ledger entry and SUB_STATS canceled += 1.
  grant(userId, {requestId, kind, planId|productId, credits, valueMinor, currency, reason},
  actorId), in order: id(requestId); kind plan|credits (400 "Invalid assignment type"); reason
  trimmed 1..300 UTF-16 units (400 "A short reason is required"); currency lowercased and valid
  (400 "Invalid currency"); valueMinor integer >= 0 (400 "Invalid numeric setting") valid for the
  currency (400 "Invalid amount for currency"); target id; credits integer >= 1 for credits;
  replay by SUB_GRANTS#<user>/<requestId> fingerprint JSON.stringify({kind, target, credits,
  valueMinor, currency, reason, actorId}) (different -> Conflict); USERS/<userId> must exist and
  not be deleted (404 "User not found"); plan (404 "Plan not found") or a product of any plan
  (404 "Product not found").
  reset(userId, {requestId, scope, reason}, actorId): id; scope day|week|period|all (400 "Invalid
  reset scope"); reason 1..300 (400 "A short courtesy reason is required"); replay by
  SUB_RESET#<user>/<key> (different scope or reason -> Conflict); no effective plan -> 404 "No
  subscription". Zeroes the selected counters of the effective entitlement, one reset ledger
  entry per counter (credits = allowance restored), courtesyResets += 1, audit
  {userId, actorId, scope, reason, at, action: "courtesy-reset"}.
  listUsers({q?, cursor?}): q trimmed and lowercased, at most 200 units (400 "Search is too
  long"); one USERS page; non-deleted users whose id, email or name contains q; items {userId,
  email, name, plan (effective plan name), status (or "none"), source (mode), totalConsumed,
  courtesyResets, creditsAvailable}.
  call(method, path, request, actor) runs one endpoint handler: request {body, query, headers,
  raw}; see endpoints() in subscriptions-settings for the list.
fixtures:
  alice: &alice { id: alice, email: alice@example.test, role: user }
  bob: &bob { id: bob, email: bob@example.test, role: user }
  users: &users
    - { pk: USERS, sk: alice, version: 1, data: { id: alice, email: alice@example.test, name: Alice, role: user } }
    - { pk: USERS, sk: bob, version: 1, data: { id: bob, email: bob@example.test, name: Bob Stone, role: user } }
    - { pk: USERS, sk: carol, version: 1, data: { id: carol, email: carol@example.test, name: Carol, role: user, deletedAt: "2026-01-01T00:00:00.000Z" } }
  paid: &paid { version: 0, values: { paymentRequired: true, notifications: true, reminderDays: 3, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: max, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: false, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ] } }
cases:
  - name: an account without a subscription
    steps:
      - { call: me, args: [ nobody ], expect: { value: { userId: nobody, status: none, counters: {}, notifications: true, assignedByAdmin: false, active: false, version: 0, paymentRequired: false, provider: none, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: max, family: max, version: 0.0.1, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ], usage: [] } } }
      - { call: billing, args: [ nobody ], expect: { value: { invoices: [], paymentMethods: [], amountDue: 0, totalPaid: 0, currency: null } } }

  - name: notification preferences
    steps:
      - { call: preferences, args: [ alice, "yes" ], expect: { error: { status: 400, message: Invalid notification preference } } }
      - { call: preferences, args: [ alice, null ], expect: { error: { status: 400, message: Invalid notification preference } } }
      - { call: preferences, args: [ alice, false ], expect: { value: { ok: true } } }
      - { call: row, args: [ SUB_ACCOUNTS, alice ], expect: { value: { pk: SUB_ACCOUNTS, sk: alice, version: 1, data: { userId: alice, notifications: false } } } }
      - { call: preferences, args: [ alice, true ], expect: { value: { ok: true } } }
      - { call: me, args: [ alice ], expect: { value: { userId: alice, notifications: true, assignedByAdmin: false, active: false, version: 2, paymentRequired: false, provider: none, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: max, family: max, version: 0.0.1, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ], usage: [] } } }

  - name: unpaid plan changes start and continue a period
