      - { call: reset, args: [ alice, { requestId: r1, scope: day, reason: " " }, root ], expect: { error: { status: 400, message: A short courtesy reason is required } } }
      - { call: reset, args: [ alice, { requestId: r1, scope: day, reason: Outage }, root ], expect: { error: { status: 404, message: No subscription } } }
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } } }
      - { call: consume, args: [ alice, api, 100, use-1 ], expect: { value: { requestId: use-1, productId: api, credits: 100, fromAllowance: 100, fromBalance: 0, at: 1767225600000, replayed: false } } }
      - { call: consume, args: [ alice, api, 1, use-2 ], expect: { error: { status: 429, message: Subscription day limit reached. Add credits or wait for the reset. } } }
      - { call: reset, args: [ alice, { requestId: r1, scope: day, reason: " Outage " }, root ], expect: { value: { ok: true } } }
      - { call: reset, args: [ alice, { requestId: r1, scope: day, reason: Outage }, root ], expect: { value: { ok: true } } }
      - { call: reset, args: [ alice, { requestId: r1, scope: all, reason: Outage }, root ], expect: { error: { status: 409, message: "Conflict: refresh and try again" } } }
