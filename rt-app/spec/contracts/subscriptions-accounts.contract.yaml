      - { call: change, args: [ *alice, starter, plan-1 ], expect: { error: { status: 404, message: Plan not found } } }
      - { call: me, args: [ alice ], expect: { value: { $partial: { plans: { $length: 2 } } } } }

  - name: cancel keeps access until the period ends
    steps:
      - { call: cancel, args: [ *alice, cancel-1 ], expect: { error: { status: 404, message: No subscription } } }
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } } }
      - { call: setNow, args: [ "2026-01-02T00:00:00.000Z" ], expect: { value: null } }
      - { call: cancel, args: [ *alice, cancel-1 ], expect: { value: { ok: true } } }
      - { call: cancel, args: [ *alice, cancel-2 ], expect: { value: { ok: true } }, note: "already canceling: nothing is written" }
      - { call: me, args: [ alice ], expect: { value: { userId: alice, email: alice@example.test, plan: { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, status: active, mode: none, cancelAtPeriodEnd: true, periodStart: 1767225600000, periodEnd: 1769817600000, counters: { api: { period: 0, day: 0, week: 0, dayStart: 1767312000000, weekStart: 1767225600000 } }, createdAt: 1767225600000, updatedAt: 1767225600000, ledgerWindows: { key: own:starter, products: { api: { start: 1767225600000, allowance: 500, name: API credits, weekSeconds: 604800 } } }, ledgerSequence: 3, ledgerTotals: { creditsIn: 500, creditsOut: 0, expired: 0, paidMinor: {}, grantedValueMinor: {} }, assignedByAdmin: false, active: true, version: 2, paymentRequired: false, provider: none, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: max, family: max, version: 0.0.1, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ], usage: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800, used: 0, remaining: 100, allowanceLeft: 100, extraCredits: 0, dayUsed: 0, weekUsed: 0, dayResetAt: 1767398400000, weekResetAt: 1767830400000 } ] } } }
      - { call: setNow, args: [ "2026-02-01T00:00:00.000Z" ], expect: { value: null } }
      - { call: me, args: [ alice ], note: "canceled plans expire instead of renewing", expect: { value: { userId: alice, email: alice@example.test, plan: { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, status: active, mode: none, cancelAtPeriodEnd: true, periodStart: 1767225600000, periodEnd: 1769817600000, counters: { api: { period: 0, day: 0, week: 0, dayStart: 1769904000000, weekStart: 1769644800000 } }, createdAt: 1767225600000, updatedAt: 1767225600000, ledgerWindows: { key: own:starter, products: { api: { start: 1767225600000, allowance: 500, name: API credits, weekSeconds: 604800 } } }, ledgerSequence: 3, ledgerTotals: { creditsIn: 500, creditsOut: 0, expired: 0, paidMinor: {}, grantedValueMinor: {} }, assignedByAdmin: false, active: false, version: 2, paymentRequired: false, provider: none, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: max, family: max, version: 0.0.1, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ], usage: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800, used: 0, remaining: 0, allowanceLeft: 0, extraCredits: 0, dayUsed: 0, wee