  - name: courtesy resets restore allowance once per request id
    init: { rows: *users }
    steps:
      - { call: reset, args: [ alice, { requestId: "bad id", scope: day, reason: x }, root ], expect: { error: { status: 400, message: Invalid identifier } } }
