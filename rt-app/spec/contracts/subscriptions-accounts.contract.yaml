      - { call: change, args: [ *alice, starter, "bad key" ], expect: { error: { status: 400, message: Invalid identifier } } }
      - { call: change, args: [ *alice, nope, plan-1 ], expect: { error: { status: 404, message: Plan not found } } }
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } } }
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } }, note: "replayed from SUB_OP" }
      - { call: change, args: [ *alice, pro, plan-1 ], expect: { error: { status: 409, message: "Conflict: refresh and try again" } } }
      - { call: change, args: [ *alice, starter, plan-2 ], expect: { error: { status: 409, message: Already subscribed to this plan } } }
      - { call: me, args: [ alice ], expect: { value: { userId: alice, email: alice@example.test, plan: { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, status: active, mode: none, cancelAtPeriodEnd: false, periodStart: 1767225600000, periodEnd: 1769817600000, counters: { api: { period: 0, day: 0, week: 0, dayStart: 1767225600000, weekStart: 1767225600000 } }, createdAt: 1767225600000, updatedAt: 1767225600000, ledgerWindows: { key: own:starter, products: { api: { start: 1767225600000, allowance: 500, name: API credits, weekSeconds: 604800 } } }, ledgerSequence: 2, ledgerTotals: { creditsIn: 500, creditsOut: 0, expired: 0, paidMinor: {}, grantedValueMinor: {} }, assignedByAdmin: false, active: true, version: 1, paymentRequired: false, provider: none, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: max, family: max, version: 0.0.1, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ], usage: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800, used: 0, remaining: 100, allowanceLeft: 100, extraCredits: 0, dayUsed: 0, weekUsed: 0, dayResetAt: 1767312000000, weekResetAt: 1767830400000 } ] } } }
      - { call: setNow, args: [ "2026-01-03T12:00:00.000Z" ], expect: { value: null } }
      - { call: change, args: [ *alice, pro, plan-2 ], expect: { value: { ok: true } } }
      - { call: me, args: [ alice ], expect: { value: { userId: alice, email: alice@example.test, plan: { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, status: active, mode: none, cancelAtPeriodEnd: false, periodStart: 1767225600000, periodEnd: 1769817600000, counters: { api: { period: 0, day: 0, week: 0, dayStart: 1767398400000, weekStart: 1767225600000 } }, createdAt: 1767225600000, updatedAt: 1767441600000, ledgerWindows: { key: own:pro, products: { api: { start: 1767225600000, allowance: 5000, name: API credits, weekSeconds: 604800 } } }, ledgerSequence: 5, ledgerTotals: { creditsIn: 5500, creditsOut: 0, expired: 500, paidMinor: {}, grantedValueMinor: {} }, assignedByAdmin: false, active: true, version: 2, paymentRequired: false, provider: none, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: max, family: max, version: 0.0.1, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ], usage: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800, used: 0, remaining: 1000, allowanceLeft: 1000, extraCredits: 0, dayUsed: 0, weekUsed: 0, dayResetAt: 1767484800000, weekResetAt: 1767830400000 } ] } } }
      - { call: row, args: [ SUB_ACCOUNTS, alice ], expect: { value: { pk: SUB_ACCOUNTS, sk: alice, version: 2, data: { userId: alice, email: alice@example.test, plan: { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, status: active, mode: none, cancelAtPeriodEnd: false, periodStart: 1767225600000, periodEnd: 1769817600000, counters: { api: { period: 0, day: 0, week: 0, dayStart: 1767398400000, weekStart: 1767225600000 } }, createdAt: 1767225600000, updatedAt: 1767441600000, ledgerWindows: { key: own:pro, products: { api: { start: 1767225600000, allowance: 5000, name: API credits, weekSeconds: 604800 } } }, ledgerSequence: 5, ledgerTotals: { creditsIn: 5500, creditsOut: 0, expired: 500, paidMinor: {}, grantedValueMinor: {} } } } } }
      - { call: row, args: [ "SUB_OP#alice", plan-1 ], expect: { value: { pk: SUB_OP#alice, sk: plan-1, version: 1, data: { planId: starter, result: { ok: true } } } } }
      - { call: list, args: [ "SUB_LEDGER#alice" ], expect: { value: { items: [ { pk: SUB_LEDGER#alice, sk: 001767225600000-0000000001-807d3bf3798545ed, version: 1, data: { at: 1767225600000, kind: allowance, credits: 500, productId: api, reason: "API credits: weekly allowance", source: system, available: 100, id: 001767225600000-0000000001-807d3bf3798545ed } }, { pk: SUB_LEDGER#alice, sk: 001767225600000-0000000002-9e031019253ed56a, version: 1, data: { at: 1767225600000, kind: plan, source: user, credits: 0, planId: starter, reason: "Plan started: Starter", requestId: plan-1, id: 001767225600000-0000000002-9e031019253ed56a } }, { pk: SUB_LEDGER#alice, sk: 001767441600000-0000000003-a3dd9132bb4bbc52, version: 1, data: { at: 1767441600000, kind: expiry, credits: -500, productId: api, reason: "API credits: allowance ended with the plan", details: { unused: 500, skippedWeeks: 0 }, source: system, available: 1000, id: 001767441600000-0000000003-a3dd9132bb4bbc52 } }, { pk: SUB_LEDGER#alice, sk: 001767441600000-0000000004-a930eca9116b0f8a, version: 1, data: { at: 1767441600000, kind: allowance, credits: 5000, productId: api, reason: "API credits: weekly allowance", source: system, available: 1000, id: 001767441600000-0000000004-a930eca9116b0f8a } }, { pk: SUB_LEDGER#alice, sk: 001767441600000-0000000005-0a7947bfa92960fc, version: 1, data: { at: 1767441600000, kind: plan, source: user, credits: 0, planId: pro, reason: Plan changed to Pro, requestId: plan-2, id: 001767441600000-0000000005-0a7947bfa92960fc } } ] } } }
      - { call: list, args: [ SUB_STATS ], expect: { value: { items: [ { pk: SUB_STATS, sk: day:2026-01-01, version: 1, data: { new: 1, canceled: 0 } } ] } } }
      - { call: audit, args: [], expect: { value: [ { userId: alice, action: plan-change, planId: starter, at: 1767225600000 }, { userId: alice, action: plan-change, planId: pro, at: 1767441600000 } ] } }

  - name: disabled plans cannot be selected
    steps:
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: false, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: max, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ] } }, root ], expect: { value: { version: 1, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ { id: starter, family: starter, description: "", metadata: {}, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: false, archived: false, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }, { id: pro, family: pro, description: "", metadata: {}, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }, { id: max, family: max, description: "", metadata: {}, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.2 } ], credits: { pack: { credits: 1000, amountMinor: 1000, currency: usd }, rates: [ { id: standar