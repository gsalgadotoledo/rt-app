contract: 1
module: subscriptions-overview
subject: subscriptions
title: Subscriptions service - overview metrics and maintenance
description: |
  Overview and maintenance through the `subscriptions` facade (see subscriptions-settings).

  overview(months = 12): integer(months, 1, 36) (400 "Invalid numeric setting"). Every
  SUB_ACCOUNTS row (all pages, sort-key order) is normalized; accounts whose effective
  entitlement is active with now < periodEnd are customers; canceling counts
  cancelAtPeriodEnd; paying needs a payment provider, entitlement mode == provider mode and
  plan.amount > 0; paying accounts not canceling add round(amount * 30 / periodDays) to
  mrrMinor[currency] (Math.round). plans = [{planId, name, customers, paying}] in first-seen
  order (JavaScript object order: array-index ids first). The snapshot SUB_STATS/snap:<today>
  {customers, paying, canceling, mrrMinor, at} is written (replacing today's). SUB_STATS day:<date>
  rows {new, canceled} (written by plan starts, grants, syncs and cancels) give today (date =
  UTC YYYY-MM-DD of now), month (UTC YYYY-MM) and a series of `months` months ending with the
  current one: {month, customers and paying of the latest snapshot of that month (null without
  one), new, canceled}. Returns {asOf: now, customers, paying, canceling, mrrMinor, plans, today:
  {date, new, canceled}, month: {month, new, canceled}, series}.

  maintenance(): reads SUB_MAINTENANCE/cursor {accounts, mail} and walks SUB_ACCOUNTS pages from
  the accounts cursor until 100 rows are processed (or 15 s of wall time). Accounts without a
  plan are skipped. An unpaid active account past its period (not canceling) renews to the
  period containing now (counters reset); pending window entries are settled; the account is
  written when it renewed or entries were settled (a Conflict is ignored). When notifications are
  enabled in settings and for the account, the account has an email and 0 < periodEnd - now <=
  reminderDays days, SUB_MAIL/<userId>-<periodEnd> {userId, to, subject: "Subscription period
  ending", text: "Your current subscription period ends on <ISO periodEnd>", sent: false} is
  created once (the values of the row read before renewal). Then, with a notifier, one page of
  SUB_MAIL from the mail cursor: unsent rows not locked (lockUntil > now) of users who did not
  disable notifications are claimed (lockUntil = now + 60000), sent ({to, subject, text}) and
  marked sent: true. The checkpoint stores {accounts: next cursor or null, mail: next cursor or
  null}. Returns {processed (rows read), partial: a cursor remains}.
fixtures:
  plans: &plans [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: max, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: yearly, name: Yearly, amount: 36500, currency: eur, periodDays: 365, enabled: true, products: [ { id: api, name: API credits, credits: 100000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ] } ]
  users: &users
    - { pk: USERS, sk: alice, version: 1, data: { id: alice, email: alice@example.test, name: Alice } }
    - { pk: USERS, sk: bob, version: 1, data: { id: bob, email: bob@example.test, name: Bob } }
    - { pk: USERS, sk: dave, version: 1, data: { id: dave, email: dave@example.test, name: Dave } }
    - { pk: USERS, sk: erin, version: 1, data: { id: erin, email: erin@example.test, name: Erin } }
    - { pk: USERS, sk: frank, version: 1, data: { id: frank, email: frank@example.test, name: Frank } }
cases:
  - name: overview of an empty store
    steps:
      - { call: overview, args: [ 0 ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: overview, args: [ 37 ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: overview, args: [ 1.5 ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: overview, args: [ "3" ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: overview, args: [ null ], expect: { value: { asOf: 1767225600000, customers: 0, paying: 0, canceling: 0, mrrMinor: {}, plans: [], today: { date: 2026-01-01, new: 0, canceled: 0 }, month: { month: 2026-01, new: 0, canceled: 0 }, series: [ { month: 2025-02, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2025-03, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2025-04, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2025-05, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2025-06, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2025-07, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2025-08, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2025-09, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2025-10, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2025-11, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2025-12, customers: null, paying: null, new: 0, canceled: 0 }, { month: 2026-01, customers: 0, paying: 0, new: 0, canceled: 0 } ] } } }
      - { call: overview, args: [ 36 ], expect: { value: { $partial: { series: { $length: 36 } } } } }
      - { call: list, args: [ SUB_STATS ], expect: { value: { items: [ { pk: SUB_STATS, sk: snap:2026-01-01, version: 2, data: { customers: 0, paying: 0, canceling: 0, mrrMinor: {}, at: 1767225600000 } } ] } } }

