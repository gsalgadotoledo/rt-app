      rows: [ { $repeat: { count: 1001, item: { pk: "OBSERVER#2026-03-04", sk: "2026-03-04T00:00:00.000Z#{i:04}", version: 1, data: { id: "{i:04}", at: "2026-03-04T00:00:00.000Z", level: info, kind: log, source: app, message: m, data: {} } } } } ]
    steps:
      - call: storeReport
        args: [ "2026-03-04" ]
        expect:
          value:
            $partial:
              counts: { requests: 0, errors: 0, spa: 0, ssr: 0 }
              events: { $length: 100 }
              partial: true
      - call: storeReport
        args: [ "2026-03-04" ]
        expect: { value: { $partial: { events: [ { $partial: { id: "0000" } }, { $repeat: { count: 99, start: 1, item: { $partial: { id: "{i:04}" } } } } ] } } }

  - name: report and search order events newest first
    init:
      now: "2026-03-04T12:00:00.000Z"
      rows:
        - { pk: "OBSERVER#2026-03-04", sk: "2026-03-04T01:00:00.000Z#b", version: 1, data: { id: b, at: "2026-03-04T01:00:00.000Z", level: info, kind: log, source: app, message: m, data: {} } }
        - { pk: "OBSERVER#2026-03-04", sk: "2026-03-04T01:00:00.000Z#a", version: 1, data: { id: a, at: "2026-03-04T01:00:00.000Z", level: info, kind: log, source: app, message: m, data: {} } }
        - { pk: "OBSERVER#2026-03-04", sk: "2026-03-04T09:00:00.000Z#c", version: 1, data: { id: c, at: "2026-03-04T09:00:00.000Z", level: info, kind: log, source: app, message: m, data: {} } }
    steps:
      - { call: storeReport, args: [ "2026-03-04" ], expect: { value: { $partial: { events: [ { $partial: { id: c } }, { $partial: { id: a } }, { $partial: { id: b } } ] } } } }
      - { call: search, args: [ { day: "2026-03-04" } ], expect: { value: { events: [ { $partial: { id: a } }, { $partial: { id: b } }, { $partial: { id: c } } ] } }, note: search keeps storage (sort key) order }

  - name: report days must be real calendar dates
    tags: [ validation ]
    steps:
      - { call: storeReport, args: [ "2026-02-30" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "2026-02-29" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "2026-04-31" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "2026-13-01" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "2026-00-01" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "2026-01-00" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "2026-1-01" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "+02026-01-01" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "2026-01-01T00:00:00Z" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "２０２６-01-01" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "" ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ null ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: storeReport, args: [ "2024-02-29" ], expect: { value: { $partial: { day: "2024-02-29", partial: false } } } }
      - { call: storeReport, args: [ "2000-02-29" ], expect: { value: { $partial: { day: "2000-02-29" } } } }
      - { call: storeReport, args: [ "0000-02-29" ], expect: { value: { $partial: { day: "0000-02-29" } } } }
      - { call: storeReport, args: [ "1900-02-29" ], expect: { error: { status: 400, message: Invalid day } } }

  - name: an empty day has zero counts and 24 empty hours
    steps:
      - call: storeReport
        args: [ "2026-03-04" ]
        expect:
          value:
            day: "2026-03-04"
            counts: { requests: 0, errors: 0, spa: 0, ssr: 0 }
            analytics: []
            requestMetrics: []
            operationMetrics: []
            averageMs: 0
            hours: [ { $repeat: { count: 24, item: { hour: "{i}", requests: 0, views: 0 } } } ]
            pages: []
            events: []
            partial: false

  # ---------------------------------------------------------------- log search
  - name: search filters by level, category, correlation ids and text
    init:
      now: "2026-03-04T12:00:00.000Z"
      rows:
        - { pk: "OBSERVER#2026-03-04", sk: "1", version: 1, data: { category: app, id: "1", at: "2026-03-04T01:00:00.000Z", level: debug, kind: log, source: app, message: hidden, data: {} } }
        - { pk: "OBSERVER#2026-03-04", sk: "2", version: 1, data: { category: payments, id: "2", at: "2026-03-04T01:00:00.000Z", level: error, kind: log, source: app, message: Card DECLINED, data: { orderId: o-77 }, requestId: r1, sessionId: s1 } }
        - { pk: "OBSERVER#2026-03-04", sk: "3", version: 1, data: { category: http, id: "3", at: "2026-03-04T01:00:00.000Z", level: info, kind: request, source: api, message: HTTP request, data: { path: /x }, requestId: r2 } }
        - { pk: "OBSERVER#2026-03-04", sk: "4", version: 1, data: { category: app, id: "4", at: "2026-03-04T01:00:00.000Z", level: warn, kind: log, source: app, message: "say \"hi\"", data: {} } }
    steps:
      - { call: search, args: [ { day: "2026-03-04" } ], expect: { value: { events: [ { $partial: { id: "2" } }, { $partial: { id: "3" } }, { $partial: { id: "4" } } ] } } }
      - { call: search, args: [ { day: "2026-03-04", level: debug } ], expect: { value: { events: [ { $partial: { id: "1" } } ] } } }
      - { call: search, args: [ { day: "2026-03-04", level: "" } ], expect: { value: { events: { $length: 3 } } } }
      - { call: search, args: [ { day: "2026-03-04", category: payments } ], expect: { value: { events: [ { $partial: { id: "2" } } ] } } }
      - { call: search, args: [ { day: "2026-03-04", category: Payments } ], expect: { value: { events: [] } } }
      - { call: search, args: [ { day: "2026-03-04", requestId: r2 } ], expect: { value: { events: [ { $partial: { id: "3" } } ] } } }
      - { call: search, args: [ { day: "2026-03-04", sessionId: s1, requestId: r1 } ], expect: { value: { events: [ { $partial: { id: "2" } } ] } } }
      - { call: search, args: [ { day: "2026-03-04", text: declined } ], expect: { value: { events: [ { $partial: { id: "2" } } ] } } }
      - { call: search, args: [ { day: "2026-03-04", text: O-77 } ], expect: { value: { events: [ { $partial: { id: "2" } } ] } } }
      - { call: search, args: [ { day: "2026-03-04", text: "\\\"hi\\\"" } ], expect: { value: { events: [ { $partial: { id: "4" } } ] } }, note: text matches the JSON text of the event, escapes included }
      - { call: search, args: [ { day: "2026-03-04", text: "\"hi\"" } ], expect: { value: { events: [] } } }
      - { call: search, args: [ { day: "2026-03-04", text: "", category: "" } ], expect: { value: { events: { $length: 3 } } } }
      - { call: search, args: [ { day: "2026-03-05" } ], expect: { value: { events: [] } } }

  - name: search reads one page and keeps the cursor of empty filtered pages
    init:
      now: "2026-03-04T12:00:00.000Z"
      rows:
        - { $repeat: { count: 50, item: { pk: "OBSERVER#2026-03-04", sk: "a{i:02}", version: 1, data: { category: app, id: "a{i:02}", at: "2026-03-04T01:00:00.000Z", level: debug, kind: log, source: app, message: m, data: {} } } } }
        - { pk: "OBSERVER#2026-03-04", sk: b, version: 1, data: { category: app, id: b, at: "2026-03-04T01:00:00.000Z", level: error, kind: log, source: app, message: m, data: {} } }
    steps:
      - { call: search, args: [ { day: "2026-03-04" } ], expect: { value: { events: [], cursor: { $type: string } } } }
      - { call: search, args: [ { day: "2026-03-04", cursor: { $ref: "0.value.cursor" } } ], expect: { value: { events: [ { $partial: { id: b } } ] } } }
      - { call: search, args: [ { day: "2026-03-05", cursor: { $ref: "0.value.cursor" } } ], expect: { error: { status: 400, message: Invalid cursor } } }
      - { call: search, args: [ { day: "2026-03-04", cursor: "not-a-cursor" } ], expect: { error: { status: 400, message: Invalid cursor } } }

  - name: search validates the query before reading
    tags: [ validation ]
    steps:
      - { call: search, args: [ { day: "2026-02-30" } ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: search, args: [ { day: 20260304 } ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: search, args: [ {} ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: search, args: [ { day: "2026-03-04", level: fatal } ], expect: { error: { status: 400, message: Invalid level } } }
      - { call: search, args: [ { day: "2026-03-04", level: ERROR } ], expect: { error: { status: 400, message: Invalid level } } }
      - { call: search, args: [ { day: bad, level: fatal } ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: search, args: [ { day: "2026-03-04", category: { $text: { repeat: "c", count: 201 } } } ], expect: { error: { status: 400, message: Invalid log filter } } }
      - { call: search, args: [ { day: "2026-03-04", text: { $text: { repeat: "😀", count: 101 } } } ], expect: { error: { status: 400, message: Invalid log filter } } }
      - { call: search, args: [ { day: "2026-03-04", text: { $text: { repeat: "😀", count: 100 } } } ], expect: { value: { events: [] } } }
      - { call: search, args: [ { day: "2026-03-04", requestId: 5 } ], expect: { error: { status: 400, message: Invalid log filter } } }
      - { call: search, args: [ { day: "2026-03-04", sessionId: true } ], expect: { error: { status: 400, message: Invalid log filter } } }
      - { call: search, args: [ { day: "2026-03-04", cursor: { $text: { repeat: "c", count: 8193 } } } ], expect: { error: { status: 400, message: Invalid log filter } } }
      - { call: search, args: [ { day: "2026-03-04", level: fatal, text: 5 } ], expect: { error: { status: 400, message: Invalid level } } }

  # ---------------------------------------------------------------- endpoints
  - name: the feature declares three endpoints and an owner-only admin page
    steps:
      - call: endpoints
        expect:
          value:
            - { method: GET, path: /observer/report, resource: observer.read, access: owner }
            - { method: GET, path: /observer/logs, resource: observer.read, access: owner }
            - { method: POST, path: /observer/events, resource: observer.pageview, access: guest }
      - call: admin
        expect: { value: { id: observer, title: Observer, resource: observer.read, path: /observer/report, component: observer, ownerOnly: true, fields: [], actions: [] } }

  - name: the report endpoint adds health and the outputs
    init:
      now: "2026-03-04T05:06:07.890Z"
      ids: [ e1 ]
      outputs:
        - { id: store, type: store }
        - { id: pager, enabled: false, levels: [ error ], kinds: [ log, request ], maxPerMinute: 1 }
        - { id: broken, behavior: fail, categories: [ payments ] }
    steps:
      - { call: write, args: [ error, declined, { category: payments } ], expect: { value: null } }
      - call: report
        args: [ {} ]
        expect:
          value:
            $partial:
              day: "2026-03-04"
              counts: { requests: 0, errors: 1, spa: 0, ssr: 0 }
              health: { failed: 1, dropped: 0 }
              outputs:
                - { id: store, enabled: true, levels: [ debug, info, warn, error ], kinds: [ log, request, pageview, timing, analytics ] }
                - { id: pager, enabled: false, levels: [ error ], kinds: [ log, request ] }
                - { id: broken, enabled: true, levels: [ debug, info, warn, error ], kinds: [ log, request, pageview, timing, analytics ] }
      - { call: report, args: [ { day: "2026-03-03" } ], expect: { value: { $partial: { day: "2026-03-03", events: [] } } } }
      - { call: report, args: [ { day: "" } ], expect: { error: { status: 400, message: Invalid day } } }
      - { call: report, args: [ { day: "03/04/2026" } ], expect: { error: { status: 400, message: Invalid day } } }

  - name: the logs endpoint searches today by default
    init: { now: "2026-03-04T23:59:59.999Z", ids: [ e1 ], outputs: [ { id: store, type: store } ] }
    steps:
      - { call: warn, args: [ late ], expect: { value: null } }
      - { call: logs, args: [ {} ], expect: { value: { events: [ { $partial: { id: e1, message: late } } ] } } }
      - { call: setNow, args: [ "2026-03-05T00:00:00.000Z" ], expect: { value: null } }
      - { call: logs, args: [ {} ], expect: { value: { events: [] } } }
      - { call: logs, args: [ { day: "2026-03-04", level: warn, unknown: ignored } ], expect: { value: { events: [ { $partial: { id: e1 } } ] } } }
      - { call: logs, args: [ { level: nope } ], expect: { error: { status: 400, message: Invalid level } } }

  - name: page events are counted as views
    init: { now: "2026-03-04T05:06:07.890Z", ids: [ e1, e2, e3 ], outputs: [ { id: all } ] }
    steps:
      - { call: ingest, args: [ { source: spa, path: / }, 10.0.0.1 ], expect: { value: { ok: true } } }
      - { call: ingest, args: [ { source: ssr, path: /docs/getting_started-2, message: Docs }, 10.0.0.1 ], expect: { value: { ok: true } } }
      - { call: ingest, args: [ { source: spa, path: /a, message: "" }, 10.0.0.1 ], expect: { value: { ok: true } } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { category: analytics, id: e1, at: "2026-03-04T05:06:07.890Z", level: info, kind: pageview, source: spa, message: Page viewed, data: { path: / } }
            - { category: analytics, id: e2, at: "2026-03-04T05:06:07.890Z", level: info, kind: pageview, source: ssr, message: Docs, data: { path: /docs/getting_started-2 } }
            - { category: analytics, id: e3, at: "2026-03-04T05:06:07.890Z", level: info, kind: pageview, source: spa, message: "", data: { path: /a } }

  - name: page events are validated
    tags: [ validation ]
    steps:
      - { call: ingest, args: [ { source: spa, path: /, message: 5 }, ip ], expect: { error: { status: 400, message: Invalid page message } } }
      - { call: ingest, args: [ { source: spa, path: /, message: null }, ip ], expect: { error: { status: 400, message: Invalid page message } } }
      - { call: ingest, args: [ { source: spa, path: /, message: { $text: { repeat: "m", count: 201 } } }, ip ], expect: { error: { status: 400, message: Invalid page message } } }
      - { call: ingest, args: [ { source: spa, path: /, message: { $text: { repeat: "😀", count: 101 } } }, ip ], expect: { error: { status: 400, message: Invalid page message } } }
      - { call: ingest, args: [ { source: nope, path: "/?x", message: 5 }, ip ], expect: { error: { status: 400, message: Invalid page message } }, note: the message is checked first }
      - { call: ingest, args: [ { source: SPA, path: / }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { path: / }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa, path: "" }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa, path: docs }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa, path: "/?token=private" }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa, path: "/a b" }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa, path: "/é" }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa, path: "/a\n" }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa, path: [ "/" ] }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa, path: //evil.test/x }, ip ], expect: { error: { status: 400, message: Invalid page event } }, note: "protocol-relative paths would name a host (TypeScript answered 500 before this was fixed)" }
      - { call: ingest, args: [ { source: spa, path: "//" }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa, path: { $text: { repeat: "a", count: 161 } } }, ip ], expect: { error: { status: 400, message: Invalid page event } } }
      - { call: ingest, args: [ { source: spa, path: /x//y/_-Z9, message: { $text: { repeat: "😀", count: 100 } } }, ip ], expect: { value: { ok: true } } }
      - { call: ingest, args: [ { source: spa, path: { $text: { repeat: "/a", count: 80 } } }, ip ], expect: { value: { ok: true } } }
      - { call: delivered, args: [ all ], expect: { value: [ { $partial: { id: e1, data: { path: /x//y/_-Z9 } } }, { $partial: { id: e2, data: { path: { $text: { repeat: "/a", count: 80 } } } } } ] } }

  - name: page events are limited to 60 per client per clock minute
    tags: [ limits, security ]
    init: { now: "2026-03-04T05:06:00.000Z", outputs: [] }
    steps:
      - { call: ingestEach, args: [ [ { $repeat: { count: 60, item: 10.0.0.1 } } ], { source: spa, path: / } ], expect: { value: null } }
      - { call: ingest, args: [ { source: spa, path: / }, 10.0.0.1 ], expect: { error: { status: 429, message: Too many events } } }
      - { call: ingest, args: [ { source: spa, path: bad }, 10.0.0.1 ], expect: { error: { status: 400, message: Invalid page event } }, note: validation comes before the limit }
      - { call: ingest, args: [ { source: spa, path: / }, 10.0.0.2 ], expect: { value: { ok: true } } }
      - { call: setNow, args: [ "2026-03-04T05:06:59.999Z" ], expect: { value: null } }
      - { call: ingest, args: [ { source: spa, path: / }, 10.0.0.1 ], expect: { error: { status: 429, message: Too many events } } }
      - { call: setNow, args: [ "2026-03-04T05:07:00.000Z" ], expect: { value: null } }
      - { call: ingest, args: [ { source: spa, path: / }, 10.0.0.1 ], expect: { value: { ok: true } } }

  - name: clients without an ip share one limit
    tags: [ limits, edge ]
    init: { now: "2026-03-04T05:06:00.000Z", outputs: [] }
    steps:
      - { call: ingestEach, args: [ [ { $repeat: { count: 60, item: unknown } } ], { source: spa, path: / } ], expect: { value: null } }
      - { call: ingest, args: [ { source: spa, path: / }, null ], expect: { error: { status: 429, message: Too many events } } }

  - name: at most 4000 clients are tracked per minute
    tags: [ limits, security ]
    init: { now: "2026-03-04T05:06:00.000Z", outputs: [] }
    steps:
      - { call: ingestEach, args: [ [ { $repeat: { count: 4000, item: "10.1.{i}" } } ], { source: spa, path: / } ], expect: { value: null } }
      - { call: ingest, args: [ { source: spa, path: / }, 10.2.0.1 ], expect: { error: { status: 429, message: Too many events } } }
      - { call: ingest, args: [ { source: spa, path: / }, 10.1.7 ], expect: { value: { ok: true } } }
      - { call: setNow, args: [ "2026-03-04T05:07:00.000Z" ], expect: { value: null } }
      - { call: ingest, args: [ { source: spa, path: / }, 10.2.0.1 ], expect: { value: { ok: true } } }
