contract: 1
module: observer
title: Observer pipeline, storage, reports, log search and endpoints
description: |
  Observer(outputs, timeoutMs = 1500, {now, newId}) captures logs, metrics and events and fans them
  out to outputs. ObserverStore(store, {now}) is the output that keeps them in daily partitions and
  answers reports and log searches; observerFeature(observer, storage, logs, {now}) serves them.
  TypeScript is the reference; time only comes from the injected clock (epoch ms or a Date) and ids
  from the injected generator.

  Events, built once per emit(level, kind, source, message, data = {}):
  {category: "app", id, at, level, kind, source, message, data} followed by the string fields
  category, requestId and sessionId of the log context (category overrides the default, other
  context keys and non-string values are ignored).
  - id = newId(), at = new Date(now()).toISOString() (milliseconds, Z).
  - source is cut to 80 UTF-16 units; message = String(sanitize(message)); data = sanitize(data);
    context values = String(sanitize(value)) cut to 120 UTF-16 units. sanitize is pinned by the
    observer-rules subject (redacted keys and strings, 1000/20/30/depth limits).
  - Nothing is built (no id is used) when no output is enabled. When 32 emits are already in flight
    the event is dropped (health.dropped + 1).

  Delivery, per output in declaration order, all awaited in parallel:
  1. skipped when enabled === false, or level/kind/source not in levels/kinds/sources (source is
     compared before truncation), or event.category not in categories;
  2. filter(copy): a throw counts health.failed + 1; a falsy result skips the output;
  3. budget: maxPerMinute (default 600, 0 drops everything) per output id per clock minute
     floor(now / 60000); over budget counts health.dropped + 1. Filtered events use no budget;
  4. handler.write(copy, signal) with a timeout of timeoutMs: a throw, a rejection or the timeout
     (which aborts the signal) counts health.failed + 1. Errors never reach the caller and never
     reveal their message. Every output and filter gets its own deep copy.

  Helpers: log/info/debug/warn/warning/error(...values): a string first value is the message and
  the rest go to data.values; otherwise the message is "Application log" and every value goes to
  data.values. When the second value is an object (not null), its string category, requestId and
  sessionId become the log context. write(level, message, context = {}, data = {}) emits kind
  "log", source "app" under context. countView(message, {url, apiUrl?, source = "spa"}) emits info
  "pageview" under category "analytics" with data {path: safePath(url), endpointPath:
  safePath(apiUrl) only when apiUrl is truthy}; a bad URL throws before anything is emitted.
  recordRequest({method, url, durationMs, status}) needs a finite number durationMs >= 0 and an
  integer status 100..599 (else TypeError "Invalid request metric", thrown before emitting) and
  emits kind "request", source "api", message "HTTP request", level error (>= 500), warn (>= 400)
  or info, data {method: method.toUpperCase(), path: safePath(url), status, durationMs}.
  measure(name, operation, {source = "app"}) returns the operation's value or rethrows its error
  unchanged, then emits kind "timing", message name, level info/error, data {name, durationMs,
  failed}; with an injected clock durationMs = now() after - now() before.

  Storage: write(event) creates {pk: "OBSERVER#" + at[0..10], sk: at + "#" + id, version: 1, ttl:
  floor(Date.parse(at) / 1000) + 604800, data: event} with expected null (a duplicate sk is a
  Conflict, so a failed delivery). Rows with a truthy ttl <= now / 1000 are expired and skipped.
  search(query) validates (validateLogQuery), reads ONE store page (50 rows, query.cursor) and
  returns {events: matching events, cursor} (an empty filtered page can have a cursor).
  report(day) needs ^\d{4}-\d{2}-\d{2}$ (ASCII digits) naming a real calendar date (else 400
  "Invalid day"), reads at most 20 pages and returns {day, counts: {requests, errors, spa, ssr},
  analytics: [{name, count}] by count desc, requestMetrics, operationMetrics, averageMs, hours:
  24 × {hour, requests, views}, pages: [{source, path, views}] by views desc (30 max), events:
  newest first by at (ties keep storage order, 100 max), partial: more pages remained}.
  - errors: events with level error. analytics: kind "analytics" grouped by message.
  - requests (kind "request"): requests + 1, duration += Number(data.durationMs) || 0, hour
    requests + 1, and a request metric keyed String(data.method) + " " + String(data.path)
    (missing fields read "undefined") when durationMs is a finite number >= 0; errors when
    Number(data.status) >= 500.
  - timings (kind "timing"): operation metric keyed source + ":" + String(data.name), name
    String(data.name), errors when data.failed === true, same durationMs rule.
  - metrics: {name, source (of the first event), count, minMs, maxMs, errors, averageMs:
    Math.round(total / count * 100) / 100} sorted by count desc (stable).
  - averageMs: Math.round(duration / requests), 0 without requests. Math.round rounds halves up.
  - page views (kind "pageview" with source spa or ssr): counts[source] + 1, hour views + 1,
    pages keyed source + String(data.path). The hour is the UTC hour of at.

  Endpoints: GET /observer/report (owner, resource observer.read): report(query.day ?? today) plus
  health {failed, dropped} and outputs [{id, enabled, levels (all four by default), kinds (all five
  by default)}]; GET /observer/logs (owner): search({day: today, ...query}); POST /observer/events
  (guest, observer.pageview): body {source, path, message?}. message, when present (null
  included), must be a string of at most 200 UTF-16 units (400 "Invalid page message"); source
  must be spa or ssr and path a string of at most 160 units matching ^/[a-zA-Z0-9/_-]*$ (400
  "Invalid page event"). Then a per-instance limit keyed sha256hex(ip ?? "unknown"): 60 events per
  clock minute (the 61st and later are 429 "Too many events"); when more than 2000 clients are
  tracked the ones from older minutes are forgotten, and with 4000 tracked a new client is 429
  "Too many events". Then countView(message ?? "Page viewed", {source, url: path}) → {ok: true}.

  Facade (subject observer): init {now, ids?, timeoutMs?, outputs?, rows?}. ids are used in order,
  then random UUIDs. outputs are [{id, type?, behavior?, filter?, enabled?, levels?, kinds?,
  sources?, categories?, maxPerMinute?}]: type "store" is the ObserverStore over a memory store
  holding init.rows (always available to the storage and endpoint helpers); other outputs are
  scripted: behavior "ok" (default) records a copy, "fail" throws a secret-looking error, "hang"
  never settles (until aborted), "slow" records after 20 ms, "mutate" records and then changes
  its copy. filter {messageIncludes} keeps events whose message includes the text, {throws: true}
  throws, {mutates: true} changes its copy and keeps the event.
  Methods: emit, write, log, info, debug, warn, warning, error, countView, recordRequest (→ null),
  measure(name, {value?, fail?, advanceMs?}, options?) (the operation advances the clock by
  advanceMs, then throws Error(fail) or returns value), withContext(context, [{call, args}]) →
  results of the steps run inside the context, parallel([{context, delayMs, steps}]) → null
  (concurrent branches), burst(count, level, message) → null (count emits started together),
  delivered(outputId), aborted(outputId), setBehavior(outputId, behavior), health(), setNow(iso),
  search(query), storeReport(day), storeWrite(event), list(pk, cursor?) (a raw store page),
  report(query), logs(query), ingest(body, ip), ingestEach(ips, body), endpoints(), admin().
subject: observer
init:
  now: "2026-03-04T05:06:07.890Z"
  ids: [ e1, e2, e3, e4, e5, e6, e7, e8, e9 ]
  timeoutMs: 50
  outputs: [ { id: all } ]
cases:
  # ---------------------------------------------------------------- events
  - name: emit builds the event with the default app category
    steps:
      - { call: emit, args: [ info, log, app, Hello, { n: 1, nested: { ok: true } } ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { category: app, id: e1, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: Hello, data: { n: 1, nested: { ok: true } } }

  - name: data defaults to an empty object and every kind and level is accepted
    steps:
      - { call: emit, args: [ debug, timing, worker, one ], expect: { value: null } }
      - { call: emit, args: [ warn, analytics, web, two, null ], expect: { value: null } }
      - { call: emit, args: [ error, pageview, spa, three, {} ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { category: app, id: e1, at: "2026-03-04T05:06:07.890Z", level: debug, kind: timing, source: worker, message: one, data: {} }
            - { category: app, id: e2, at: "2026-03-04T05:06:07.890Z", level: warn, kind: analytics, source: web, message: two, data: {} }
            - { category: app, id: e3, at: "2026-03-04T05:06:07.890Z", level: error, kind: pageview, source: spa, message: three, data: {} }

  - name: the source is cut to 80 UTF-16 units
    tags: [ limits ]
    steps:
      - { call: emit, args: [ info, log, { $text: { repeat: "s", count: 81 } }, x ], expect: { value: null } }
      - { call: emit, args: [ info, log, { $text: { repeat: "😀", count: 40 } }, y ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { $partial: { id: e1, source: { $text: { repeat: "s", count: 80 } } } }
            - { $partial: { id: e2, source: { $text: { repeat: "😀", count: 40 } } } }

  - name: messages and data are sanitized
    tags: [ security ]
    steps:
      - call: emit
        args: [ info, log, app, "Bearer abc.def for me@example.com token=xyz", { password: hunter2, user: { email: a@b.test, name: Ann }, note: "api_key: k-1" } ]
        expect: { value: null }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { category: app, id: e1, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: "Bearer [redacted] for [email] token=[redacted]", data: { password: "[redacted]", user: { email: "[redacted]", name: Ann }, note: "api_key: [redacted]" } }

  - name: messages are cut to 1000 UTF-16 units before redaction
    tags: [ limits ]
    steps:
      - { call: emit, args: [ info, log, app, { $text: { repeat: "m", count: 1001 } } ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { $partial: { message: { $text: { repeat: "m", count: 1000 } } } }

  - name: disabled outputs receive nothing
    init: { now: "2026-03-04T05:06:07.890Z", ids: [ e1, e2 ], outputs: [ { id: off, enabled: false }, { id: on, enabled: true } ] }
    steps:
      - { call: info, args: [ hello ], expect: { value: null } }
      - { call: delivered, args: [ off ], expect: { value: [] } }
      - { call: delivered, args: [ on ], expect: { value: [ { $partial: { id: e1, message: hello } } ] } }
      - { call: health, expect: { value: { failed: 0, dropped: 0 } } }

  - name: without enabled outputs nothing is built or counted
    init: { now: "2026-03-04T05:06:07.890Z", ids: [ e1 ], outputs: [ { id: off, enabled: false } ] }
    steps:
      - { call: error, args: [ lost ], expect: { value: null } }
      - { call: delivered, args: [ off ], expect: { value: [] } }
      - { call: health, expect: { value: { failed: 0, dropped: 0 } } }

  - name: duplicate output ids are rejected
    tags: [ validation ]
    init: { now: "2026-03-04T05:06:07.890Z", outputs: [ { id: same }, { id: same } ] }
    create: { error: { status: null, message: Duplicate observer output id } }

  # ---------------------------------------------------------------- log context
  - name: the log context adds category, requestId and sessionId
    steps:
      - call: withContext
        args: [ { requestId: r1, sessionId: s1, category: payments, userId: ignored }, [ { call: emit, args: [ info, log, app, inside ] } ] ]
        expect: { value: [ null ] }
      - { call: emit, args: [ info, log, app, outside ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { category: payments, id: e1, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: inside, data: {}, requestId: r1, sessionId: s1 }
            - { category: app, id: e2, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: outside, data: {} }

  - name: nested contexts merge over the outer one and end with their operation
    steps:
      - call: withContext
        args:
          - { requestId: r1, category: outer }
          - - { call: withContext, args: [ { sessionId: s2, category: inner }, [ { call: info, args: [ nested ] } ] ] }
            - { call: info, args: [ after ] }
        expect: { value: [ [ null ], null ] }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { $partial: { message: nested, category: inner, requestId: r1, sessionId: s2 } }
            - { $partial: { message: after, category: outer, requestId: r1, sessionId: null } }

  - name: context values are sanitized and cut to 120 UTF-16 units
    tags: [ security, limits ]
    steps:
      - call: withContext
        args: [ { requestId: user@example.com, sessionId: { $text: { repeat: "é", count: 130 } }, category: "token=abc" }, [ { call: info, args: [ x ] } ] ]
        expect: { value: [ null ] }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { $partial: { requestId: "[email]", sessionId: { $text: { repeat: "é", count: 120 } }, category: "token=[redacted]" } }

  - name: concurrent operations keep their own context
    tags: [ concurrency ]
    steps:
      - call: parallel
        args:
          - - { context: { requestId: a, category: payments }, delayMs: 30, steps: [ { call: error, args: [ declined ] }, { call: info, args: [ a done ] } ] }
            - { context: { requestId: b }, delayMs: 0, steps: [ { call: error, args: [ declined ] }, { call: info, args: [ b done ] } ] }
        expect: { value: null }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { $partial: { message: declined, requestId: b, category: app } }
            - { $partial: { message: b done, requestId: b, category: app } }
            - { $partial: { message: declined, requestId: a, category: payments } }
            - { $partial: { message: a done, requestId: a, category: payments } }

  - name: write emits a log under an explicit context
    steps:
      - { call: write, args: [ error, Payment declined, { category: payments, requestId: r9 }, { orderId: o-1 } ], expect: { value: null } }
      - { call: write, args: [ info, defaults ], expect: { value: null } }
      - { call: write, args: [ warn, not a category, { category: 5 } ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { category: payments, id: e1, at: "2026-03-04T05:06:07.890Z", level: error, kind: log, source: app, message: Payment declined, data: { orderId: o-1 }, requestId: r9 }
            - { category: app, id: e2, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: defaults, data: {} }
            - { category: app, id: e3, at: "2026-03-04T05:06:07.890Z", level: warn, kind: log, source: app, message: not a category, data: {} }

  # ---------------------------------------------------------------- console-style helpers
  - name: console-style helpers map to levels and keep extra values
    steps:
      - { call: log, args: [ Import started, { jobId: j1 } ], expect: { value: null } }
      - { call: info, args: [ Import completed, { count: 42, category: jobs, requestId: r1 } ], expect: { value: null } }
      - { call: debug, args: [ Cache lookup, { hit: true } ], expect: { value: null } }
      - { call: warn, args: [ Retrying, { attempt: 2 }, extra, 3 ], expect: { value: null } }
      - { call: warning, args: [ Alias ], expect: { value: null } }
      - { call: error, args: [ Import failed ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { category: app, id: e1, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: Import started, data: { values: [ { jobId: j1 } ] } }
            - { category: jobs, id: e2, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: Import completed, data: { values: [ { count: 42, category: jobs, requestId: r1 } ] }, requestId: r1 }
            - { category: app, id: e3, at: "2026-03-04T05:06:07.890Z", level: debug, kind: log, source: app, message: Cache lookup, data: { values: [ { hit: true } ] } }
            - { category: app, id: e4, at: "2026-03-04T05:06:07.890Z", level: warn, kind: log, source: app, message: Retrying, data: { values: [ { attempt: 2 }, extra, 3 ] } }
            - { category: app, id: e5, at: "2026-03-04T05:06:07.890Z", level: warn, kind: log, source: app, message: Alias, data: { values: [] } }
            - { category: app, id: e6, at: "2026-03-04T05:06:07.890Z", level: error, kind: log, source: app, message: Import failed, data: { values: [] } }

  - name: a first value that is not a string becomes a generic message
    tags: [ edge ]
    steps:
      - { call: info, args: [ { a: 1 } ], expect: { value: null } }
      - { call: info, args: [ 5, { requestId: r2, sessionId: 7 } ], expect: { value: null } }
      - { call: info, expect: { value: null } }
      - { call: info, args: [ list, [ not, metadata ] ], expect: { value: null } }
      - { call: info, args: [ null, { category: nulls } ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { category: app, id: e1, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: Application log, data: { values: [ { a: 1 } ] } }
            - { category: app, id: e2, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: Application log, data: { values: [ 5, { requestId: r2, sessionId: 7 } ] }, requestId: r2 }
            - { category: app, id: e3, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: Application log, data: { values: [] } }
            - { category: app, id: e4, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: list, data: { values: [ [ not, metadata ] ] } }
            - { category: nulls, id: e5, at: "2026-03-04T05:06:07.890Z", level: info, kind: log, source: app, message: Application log, data: { values: [ null, { category: nulls } ] } }

  - name: logged values are sanitized
    tags: [ security ]
    steps:
      - { call: error, args: [ login failed, { password: x, email: a@b.test, ip: 10.0.0.1, detail: "secret=s3 for x@y.io" } ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { $partial: { message: login failed, data: { values: [ { password: "[redacted]", email: "[redacted]", ip: "[redacted]", detail: "secret=[redacted] for [email]" } ] } } }

  # ---------------------------------------------------------------- page views
  - name: countView keeps only the path of the page and of the API
    tags: [ security ]
    steps:
      - call: countView
        args: [ Home, { url: "https://user:password@example.test/home?token=secret#private", apiUrl: "https://api.test/v1?key=secret", source: ssr } ]
        expect: { value: null }
      - { call: countView, args: [ Docs, { url: /docs/intro } ], expect: { value: null } }
      - { call: countView, args: [ Empty api, { url: "a/b", apiUrl: "" } ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { category: analytics, id: e1, at: "2026-03-04T05:06:07.890Z", level: info, kind: pageview, source: ssr, message: Home, data: { path: /home, endpointPath: /v1 } }
            - { category: analytics, id: e2, at: "2026-03-04T05:06:07.890Z", level: info, kind: pageview, source: spa, message: Docs, data: { path: /docs/intro } }
            - { category: analytics, id: e3, at: "2026-03-04T05:06:07.890Z", level: info, kind: pageview, source: spa, message: Empty api, data: { path: /a/b } }

  - name: countView uses the analytics category over the caller's context
    steps:
      - call: withContext
        args: [ { category: http, requestId: r1 }, [ { call: countView, args: [ Home, { url: / } ] } ] ]
        expect: { value: [ null ] }
      - { call: delivered, args: [ all ], expect: { value: [ { $partial: { category: analytics, requestId: r1, data: { path: / } } } ] } }

  - name: countView rejects URLs that are not HTTP before emitting
    tags: [ validation ]
    steps:
      - { call: countView, args: [ x, { url: "javascript:alert(1)" } ], expect: { error: { status: null, message: Observer expects an HTTP URL or path } } }
      - { call: countView, args: [ x, { url: "mailto:ops@example.test" } ], expect: { error: { status: null, message: Observer expects an HTTP URL or path } } }
      - { call: countView, args: [ x, { url: /ok, apiUrl: "ftp://files.test/x" } ], expect: { error: { status: null, message: Observer expects an HTTP URL or path } } }
      - { call: countView, args: [ x, { url: "http://" } ], expect: { error: { status: null, message: Invalid URL } } }
      - { call: delivered, args: [ all ], expect: { value: [] } }

  # ---------------------------------------------------------------- request metrics
  - name: recordRequest levels follow the status
    steps:
      - { call: recordRequest, args: [ { method: get, url: "/users/:id?token=secret", durationMs: 12.5, status: 200 } ], expect: { value: null } }
      - { call: recordRequest, args: [ { method: POST, url: /orders, durationMs: 0, status: 399 } ], expect: { value: null } }
      - { call: recordRequest, args: [ { method: Put, url: "https://api.test/v1/x#y", durationMs: 3, status: 400 } ], expect: { value: null } }
      - { call: recordRequest, args: [ { method: delete, url: /x, durationMs: 4, status: 499 } ], expect: { value: null } }
      - { call: recordRequest, args: [ { method: get, url: /y, durationMs: 5, status: 500 } ], expect: { value: null } }
      - { call: recordRequest, args: [ { method: get, url: /z, durationMs: 6, status: 599 } ], expect: { value: null } }
      - call: delivered
        args: [ all ]
        expect:
          value:
            - { category: app, id: e1, at: "2026-03-04T05:06:07.890Z", level: info, kind: request, source: api, message: HTTP request, data: { method: GET, path: "/users/:id", status: 200, durationMs: 12.5 } }
            - { category: app, id: e2, at: "2026-03-04T05:06:07.890Z", level: info, kind: request, source: api, message: HTTP request, data: { method: POST, path: /orders, status: 399, durationMs: 0 } }
            - { category: app, id: e3, at: "2026-03-04T05:06:07.890Z", level: warn, kind: request, source: api, message: HTTP request, data: { method: PUT, path: /v1/x, status: 400, durationMs: 3 } }
            - { category: app, id: e4, at: "2026-03-04T05:06:07.890Z", level: warn, kind: request, source: api, message: HTTP request, data: { method: DELETE, path: /x, status: 499, durationMs: 4 } }
            - { category: app, id: e5, at: "2026-03-04T05:06:07.890Z", level: error, kind: request, source: api, message: HTTP request, data: { method: GET, path: /y, status: 500, durationMs: 5 } }
            - { category: app, id: e6, at: "2026-03-04T05:06:07.890Z", level: error, kind: request, source: api, message: HTTP request, data: { method: GET, path: /z, status: 599, durationMs: 6 } }

  - name: recordRequest rejects invalid metrics before emitting
    tags: [ validation ]
    steps:
      - { call: recordRequest, args: [ { method: GET, url: /, durationMs: -1, status: 200 } ], expect: { error: { status: null, message: Invalid request metric } } }
      - { call: recordRequest, args: [ { method: GET, url: /, durationMs: "5", status: 200 } ], expect: { error: { status: null, message: Invalid request metric } } }
      - { call: recordRequest, args: [ { method: GET, url: /, status: 200 } ], expect: { error: { status: null, message: Invalid request metric } } }
      - { call: recordRequest, args: [ { method: GET, url: /, durationMs: 1, status: 99 } ], expect: { error: { status: null, message: Invalid request metric } } }
      - { call: recordRequest, args: [ { method: GET, url: /, durationMs: 1, status: 600 } ], expect: { error: { status: null, message: Invalid request metric } } }
      - { call: recordRequest, args: [ { method: GET, url: /, durationMs: 1, status: 200.5 } ], expect: { error: { status: null, message: Invalid request metric } } }
