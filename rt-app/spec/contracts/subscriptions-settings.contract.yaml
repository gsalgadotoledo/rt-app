contract: 1
module: subscriptions-settings
subject: subscriptions
title: Subscriptions service - settings, plan catalog, versions and publication
description: |
  The Subscriptions service (TypeScript: packages/subscriptions/src/index.ts, class Subscriptions)
  behind the `subscriptions` facade: a memory store seeded with init.rows, a settable clock
  (init.now, ISO 8601, default 2026-01-01T00:00:00.000Z = 1767225600000 ms), LocalBilling when
  init.billing == "local" (else no payment provider), and a fake CatalogPublisher when
  init.catalog == true (else none). Every notification goes to a capturing mailbox (`sent()`).
  Facade methods are the service methods with the same positional arguments; helpers:
    setNow(iso), setCatalog("ok"|"fail"), published(), sent(), row(pk, sk), list(pk, cursor?),
    audit() (SUB_AUDIT data, sorted by canonical JSON text), endpoints(), call(method, path,
    request, actor), admin(), migrations().
  Fake catalog publish(plan, namespace, previous): fails with 502 "Catalog unavailable" in "fail"
  mode; else records {planId, version, previousVersion, namespace: "string"} and returns
  {stripePriceId: "price_" + s, stripeProductId: "prod_" + s} where s = plan.id with "-" -> "_",
  "_", version with "." -> "_".

  settings() -> {version (row version, 0 before the first save), values, provider ("local" |
  "stripe" | "none"), catalogAvailable (a catalog factory is configured), catalogOperation}.
  values = the stored data (or a copy of the defaults) with every plan's version defaulting to
  "0.0.1" and credits defaulting to the default credit settings.

  validateSettings(values), in this order (all 400):
    1. paymentRequired and notifications booleans, plans a list of 1..20   -> "Invalid subscription settings"
    2. per plan, in order: id(p.id); family = id(p.family ?? p.id); description = String(?? "")
       cut to 500 UTF-16 units; metadata (?? {}): an object (not array) of at most 20 entries ->
       "Use at most 20 metadata entries", each key ^[a-zA-Z0-9_-]{1,40}$, value a string of at
       most 500 units, key not in B_version, State, family, rtAppPlanId, rtAppCatalog ->
       "Invalid or reserved metadata key"; name = String(?? "") cut to 80 units; amount =
       integer(0..1e9); currency must be a valid lowercase code (not lowercased) -> "Invalid
       currency"; periodDays integer 1..366; enabled = enabled === true && archived !== true;
       archived = archived === true; stripePriceId (when truthy) = id(); products a list of
       1..20 (else "A plan needs products"), each {id: id(), name: String(?? "") cut to 80,
       credits, dailyLimit, weeklyLimit: integer 0..1e9, daySeconds: 60..2678400, weekSeconds:
       60..31622400}.  id() failures are "Invalid identifier"; integers "Invalid numeric setting".
    3. repeated plan ids or stripePriceIds, an empty plan name, an amount invalid for the
       currency (isk/ugx multiples of 100), repeated product ids or an empty product name
                                                                    -> "Duplicate or unnamed plans/products"
    4. reminderDays integer 0..30; 5. credits = validateCredits(credits ?? defaults.credits).
  saveSettings({version, values}, actorId), in this order: validate; version must equal the
  stored version (0 when none), else Conflict (409 "Conflict: refresh and try again"); a pending
  catalog operation -> 409 "Resume the pending Stripe synchronization before editing plans"; every
  previous plan id (defaults when nothing is stored) must remain -> 400 "Disable a plan instead of
  removing or renaming its ID"; per plan, changed = a previous plan exists and (it is the restored
  plan, or its content {id, family ?? id, name, description ?? "", amount, currency, periodDays,
  products, metadata ?? {}} differs). A changed plan writes the previous snapshot to
  SUB_PLAN_HISTORY#<id>/<previous version> (create) and bumps the last number of the version
  ("0.0.9" -> "0.0.10"); new plans get "0.0.1". stripeManaged is kept from the previous plan;
  stripePriceId/stripeProductId are kept only when unchanged. paymentRequired without a provider
  -> 400 "Configure a payment adapter before requiring payments". One transaction writes
  SUB_CONFIG/settings (values + catalogNamespace), the history rows and an audit row
  {action: "settings", restoredPlan?, restoredFrom?, actorId, at}. Returns settings().
  editPlan(action, {version, id, plan}, actorId): version first (Conflict); "create" needs
  plan.name string (400 "plan.name is required"), id = planIdFromName(name, existing ids) (NFKD,
  drop U+0300-U+036F, lowercase, runs of [^a-z0-9] -> "-", trim "-", 80 chars, trailing "-"
  removed, "new-plan" when empty, "-2", "-3"... on collisions), family = plan.family || id,
  enabled false; other actions need an existing id (404 "Plan not found"); "update" merges plan
  over the stored plan (id kept); "archive"/"unarchive" set archived and disable; "version"
  saves with the plan marked as restored (a new version with unchanged content); anything else
  -> 400 "Unknown plan action".
  restorePlan(id, {version, fromVersion}, actorId): fromVersion ^\d+\.\d+\.\d+$ (400 "Invalid plan
  version"); history row (404 "Plan version not found"); version (Conflict); plan exists (404
  "Plan not found"); the plan becomes the snapshot with the current id/enabled/archived and is
  saved as restored (audit restoredPlan, restoredFrom).
  linkStripePrices({planId: {productId, priceId}}, actorId): pending catalog operation -> 409
  "Resume the pending Stripe synchronization before linking prices"; per link in order: unknown
  plan -> 404 "Plan not found: <id>"; ids ^prod_[A-Za-z0-9]{1,250}$ / ^price_[A-Za-z0-9]{1,250}$
  -> 400 "Invalid Stripe ids for <id>"; returns the ids of plans whose ids change (plans order);
  none -> []; a price used by an unlinked plan, or repeated in the links -> 400 "A Stripe price
  can belong to one plan only". Writes the plans (versions unchanged) and an audit row
  {action: "link-stripe-prices", plans, actorId, at}.
  publishPlan(id, {version, secretKey?}, actorId): no catalog -> 503 "Stripe catalog is not
  configured"; no settings row -> 409 "Save your plans first"; a pending operation for another
  plan -> 409 "Resume the pending plan synchronization first"; without a pending operation:
  version (Conflict), plan exists (404 "Plan not found"), then the operation {id: uuid, planId,
  plan, previous (SUB_CATALOG_LAST plan), actorId, at} and a catalogNamespace (uuid, kept) are
  saved before publishing. On success: the plan gets the returned ids and stripeManaged true;
  SUB_CATALOG_LAST/<id> and SUB_PLAN_PRICES/<priceId> hold {plan}; audit {action:
  "publish-plan", planId, version, actorId, at}; the operation is cleared. Returns settings().
fixtures:
  starter: &starter { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ] }
  pro: &pro { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ] }
  pro2: &pro2 { id: pro, name: Pro, amount: 2500, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ] }
  max: &max { id: max, family: max, version: 0.0.1, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] }
  product: &product { id: api, name: API credits, credits: 1, dailyLimit: 1, weeklyLimit: 1, daySeconds: 86400, weekSeconds: 604800 }
cases:
  - name: settings before the first save are the defaults
    steps:
      - call: settings
        args: []
        expect: { value: { version: 0, values: { paymentRequired: false, notifications: true, reminderDays: 3, credits: { pack: { credits: 1000, amountMinor: 1000, currency: usd }, rates: [ { id: standard, name: Standard model, inputPer1k: 1, outputPer1k: 3, minimum: 1 }, { id: advanced, name: Advanced model, inputPer1k: 5, outputPer1k: 15, minimum: 1 } ] }, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: max, family: max, version: 0.0.1, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ] }, provider: none, catalogAvailable: false } }
  - name: provider and catalog availability come from the configuration
    init: { billing: local, catalog: true }
    steps:
      - call: settings
        args: []
        expect: { value: { $partial: { version: 0, provider: local, catalogAvailable: true } } }

  - name: settings are validated in order
    tags: [ validation ]
    steps:
      - { call: saveSettings, args: [ { version: 0, values: null }, root ], expect: { error: { status: 400, message: Invalid subscription settings } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: "no", notifications: true, plans: [ *starter ] } }, root ], expect: { error: { status: 400, message: Invalid subscription settings } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: 1, plans: [ *starter ] } }, root ], expect: { error: { status: 400, message: Invalid subscription settings } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [] } }, root ], expect: { error: { status: 400, message: Invalid subscription settings } } }
      - call: saveSettings
        args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { $repeat: { count: 21, item: { id: "p{i}", name: P, amount: 0, currency: usd, periodDays: 30, products: [ *product ] } } } ] } }, root ]
        expect: { error: { status: 400, message: Invalid subscription settings } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: "bad id", name: X, amount: -1 } ] } }, root ], expect: { error: { status: 400, message: Invalid identifier } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, family: "a b" } ] } }, root ], expect: { error: { status: 400, message: Invalid identifier } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, metadata: [ a ] } ] } }, root ], expect: { error: { status: 400, message: Use at most 20 metadata entries } } }
      - call: saveSettings
        args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, metadata: { k1: a, k2: a, k3: a, k4: a, k5: a, k6: a, k7: a, k8: a, k9: a, k10: a, k11: a, k12: a, k13: a, k14: a, k15: a, k16: a, k17: a, k18: a, k19: a, k20: a, k21: a } } ] } }, root ]
        expect: { error: { status: 400, message: Use at most 20 metadata entries } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, metadata: { family: a } } ] } }, root ], expect: { error: { status: 400, message: Invalid or reserved metadata key } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, metadata: { tier: 1 } } ] } }, root ], expect: { error: { status: 400, message: Invalid or reserved metadata key } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, metadata: { "bad key": a } } ] } }, root ], expect: { error: { status: 400, message: Invalid or reserved metadata key } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, metadata: { note: { $text: { repeat: a, count: 501 } } } } ] } }, root ], expect: { error: { status: 400, message: Invalid or reserved metadata key } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 1.5 } ] } }, root ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: true } ] } }, root ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: USD } ] } }, root ], expect: { error: { status: 400, message: Invalid currency } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: usd, periodDays: 0 } ] } }, root ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: usd, periodDays: 367 } ] } }, root ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: usd, periodDays: 30, stripePriceId: "price 1" } ] } }, root ], expect: { error: { status: 400, message: Invalid identifier } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: usd, periodDays: 30, products: [] } ] } }, root ], expect: { error: { status: 400, message: A plan needs products } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: usd, periodDays: 30, products: { id: api } } ] } }, root ], expect: { error: { status: 400, message: A plan needs products } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: usd, periodDays: 30, products: [ { id: api, name: A, credits: 1, dailyLimit: 1, weeklyLimit: 1, daySeconds: 59, weekSeconds: 60 } ] } ] } }, root ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: usd, periodDays: 30, products: [ { id: api, name: A, credits: 1, dailyLimit: 1, weeklyLimit: 1, daySeconds: 60, weekSeconds: 31622401 } ] } ] } }, root ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ *starter, *starter ] } }, root ], expect: { error: { status: 400, message: Duplicate or unnamed plans/products } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: "", amount: 0, currency: usd, periodDays: 30, products: [ *product ] } ] } }, root ], expect: { error: { status: 400, message: Duplicate or unnamed plans/products } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 150, currency: isk, periodDays: 30, products: [ *product ] } ] } }, root ], expect: { error: { status: 400, message: Duplicate or unnamed plans/products } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: usd, periodDays: 30, products: [ *product, *product ] } ] } }, root ], expect: { error: { status: 400, message: Duplicate or unnamed plans/products } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: usd, periodDays: 30, products: [ { id: api, credits: 1, dailyLimit: 1, weeklyLimit: 1, daySeconds: 60, weekSeconds: 60 } ] } ] } }, root ], expect: { error: { status: 400, message: Duplicate or unnamed plans/products } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ { id: x, name: X, amount: 0, currency: usd, periodDays: 30, stripePriceId: price_1, products: [ *product ] }, { id: y, name: Y, amount: 0, currency: usd, periodDays: 30, stripePriceId: price_1, products: [ *product ] } ] } }, root ], expect: { error: { status: 400, message: Duplicate or unnamed plans/products } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, reminderDays: 31, plans: [ *starter, *starter ] } }, root ], expect: { error: { status: 400, message: Duplicate or unnamed plans/products } }, note: "plans are checked before reminderDays" }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, reminderDays: 31, plans: [ *starter, *pro, *max ] } }, root ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, plans: [ *starter, *pro, *max ] } }, root ], expect: { error: { status: 400, message: Invalid numeric setting } }, note: "reminderDays is required" }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ *starter, *pro, *max ], credits: { pack: { credits: 1, amountMinor: 1, currency: xx }, rates: [] } } }, root ], expect: { error: { status: 400, message: Invalid currency } } }
      - { call: settings, args: [], expect: { value: { $partial: { version: 0 } } } }

  - name: saving normalizes plans and keeps versions of unchanged plans
    steps:
      - call: saveSettings
        args:
          - version: 0
            values:
              paymentRequired: false
              notifications: true
              reminderDays: 3
              extra: dropped
              plans:
                - { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: "true", unknown: 1, description: 5, metadata: { zeta: z, Alpha: a }, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800, extra: x } ] }
                - *pro
                - { id: max, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, archived: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] }
          - root
        expect: { value: { version: 1, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ { id: starter, family: starter, description: "5", metadata: { Alpha: a, zeta: z }, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: false, archived: false, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.2 }, { id: pro, family: pro, description: "", metadata: {}, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }, { id: max, family: max, description: For growing teams with higher usage, metadata: {}, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: false, archived: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 } ], credits: { pack: { credits: 1000, amountMinor: 1000, currency: usd }, rates: [ { id: standard, name: Standard model, inputPer1k: 1, outputPer1k: 3, minimum: 1 }, { id: advanced, name: Advanced model, inputPer1k: 5, outputPer1k: 15, minimum: 1 } ] } }, provider: none, catalogAvailable: false } }
      - { call: row, args: [ SUB_CONFIG, settings ], expect: { value: { pk: SUB_CONFIG, sk: settings, version: 1, data: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ { id: starter, family: starter, description: "5", metadata: { Alpha: a, zeta: z }, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: false, archived: false, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.2 }, { id: pro, family: pro, description: "", metadata: {}, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }, { id: max, family: max, description: For growing teams with higher usage, metadata: {}, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: false, archived: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 } ], credits: { pack: { credits: 1000, amountMinor: 1000, currency: usd }, rates: [ { id: standard, name: Standard model, inputPer1k: 1, outputPer1k: 3, minimum: 1 }, { id: advanced, name: Advanced model, inputPer1k: 5, outputPer1k: 15, minimum: 1 } ] } } } } }
      - { call: list, args: [ "SUB_PLAN_HISTORY#starter" ], expect: { value: { items: [ { pk: SUB_PLAN_HISTORY#starter, sk: 0.0.1, version: 1, data: { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ] } } ] } } }
      - { call: audit, args: [], expect: { value: [ { action: settings, actorId: root, at: 1767225600000 } ] } }

  - name: optimistic concurrency on the settings version
    tags: [ concurrency ]
    steps:
      - { call: saveSettings, args: [ { version: 1, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ *starter, *pro, *max ] } }, root ], expect: { error: { status: 409, message: "Conflict: refresh and try again" } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ *starter, *pro, *max ] } }, root ], expect: { value: { $partial: { version: 1 } } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ *starter, *pro, *max ] } }, root ], expect: { error: { status: 409, message: "Conflict: refresh and try again" } } }
      - { call: saveSettings, args: [ { version: "1", values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ *starter, *pro, *max ] } }, root ], expect: { error: { status: 409, message: "Conflict: refresh and try again" } } }
      - { call: saveSettings, args: [ { values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ *starter, *pro, *max ] } }, root ], expect: { error: { status: 409, message: "Conflict: refresh and try again" } } }
      - { call: saveSettings, args: [ { version: 1, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ *starter, *pro ] } }, root ], expect: { error: { status: 400, message: Disable a plan instead of removing or renaming its ID } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ *starter, *pro ] } }, root ], expect: { error: { status: 409, message: "Conflict: refresh and try again" } }, note: "the version is checked before removed plans" }
      - { call: saveSettings, args: [ { version: 1, values: { paymentRequired: true, notifications: true, reminderDays: 3, plans: [ *starter, *pro, *max ] } }, root ], expect: { error: { status: 400, message: Configure a payment adapter before requiring payments } } }

  - name: removed default plans are rejected on the first save
    steps:
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ *starter, *pro ] } }, root ], expect: { error: { status: 400, message: Disable a plan instead of removing or renaming its ID } } }

  - name: payments can be required with a payment provider
    init: { billing: local }
    steps:
      - call: saveSettings
        args: [ { version: 0, values: { paymentRequired: true, notifications: false, reminderDays: 0, plans: [ *starter, *pro, *max ] } }, admin-1 ]
        expect: { value: { $partial: { version: 1, provider: local, values: { $partial: { paymentRequired: true, notifications: false, reminderDays: 0 } } } } }

  - name: changed plan content creates a version and a history snapshot
