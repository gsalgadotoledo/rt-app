contract: 1
module: visits
title: Visit sessions (diagnostic click/scroll samples)
description: |
  Visits(store, secret, pages = ["/", "/about", "/services"], clock = Date.now, newId = randomUUID)
  keeps a tiny diagnostic sample: one row {pk: "VISITS", sk: "recent"} holding at most 10 sessions
  of at most 120 points each, replaced atomically with version-guarded writes.

  - Construction: secret needs >= 32 UTF-16 code units ("Visits requires a server secret of at
    least 32 characters"); pages: at most 30, each ^/[a-zA-Z0-9/_-]{0,79}$ with `$` the end of the
    string ("Invalid public visit pages"). Both are plain errors (no status).
  - Rate limit (per instance, before anything else in start and ingest): key sha256hex(ip); every
    call first deletes entries whose window started >= 60000 ms ago; a new key when 2000 are
    tracked → 429 "Visits busy"; otherwise the window's count is incremented and a count above 60
    → 429 "Visit rate limit" (rejected calls count too).
  - start(ip) → {token, maxPoints: 120, pages}. token = payload + "." + signature, payload =
    base64url (no padding) of the UTF-8 compact JSON {"id": newId(), "startedAt": now} (keys in
    that order), signature = base64url(HMAC-SHA256(utf8(secret), "visits:" + payload)).
  - ingest({token, sequence, points}, ip) → {ok: true, recorded}. Checks, in order: rate; token
    (400 "Invalid visit token": not a string, > 500 UTF-16 units, not exactly two dot-separated
    parts, signature not 43 base64url characters or not equal (constant time) to the expected one;
    then 400 "Expired or invalid visit token" when the payload is not base64url JSON of an object
    with a string id and a safe-integer startedAt, startedAt > now, or now - startedAt > 1800000);
    batch (400 "Invalid visit batch": sequence a safe integer >= 1, points an array of 1-20);
    points (400 "Invalid visit point": type move|click|scroll|page, path one of the pages, t a
    safe integer 0..1800000, x and y integers 0..100). Stored points keep only type, path, t, x, y.
  - Update (up to 5 attempts on Conflict): read the row, drop sessions with startedAt <= now -
    86400000, apply the change, write {version: old + 1 (1 when new), ttl: ceil((now + 86400000) /
    1000), data: {sessions}} expecting the old version (null when missing). ingest: a known session
    with sequence <= its sequence is unchanged (recorded false; the row is still rewritten);
    otherwise the session (created as {id, startedAt, updatedAt, sequence: 0, points: []}) gets
    sequence, updatedAt = now and points appended up to 120. Sessions are sorted by startedAt
    descending, then id ascending (ids are lowercase UUIDs: localeCompare equals code point order),
    and only the first 10 kept; recorded tells whether the session is among them.
  - list() → {items: [{id, startedAt, updatedAt, sequence, events, pages}], limit: 10, maxPoints:
    120}; events = number of points, pages = distinct point paths in first-seen order. Sessions are
    returned in stored order. Reading rewrites the row only when a session has expired.
  - detail(id) → the stored session, or 404 "Visit not found". remove(id) → {ok: true}, always
    rewriting the row.

  Facade (subject visits): init {secret, pages?, now, ids? (returned by newId in order, then random
  UUIDs), rows? (seed the store)}. Methods: start, ingest, list, detail, remove; helpers
  startEach(ips) (start once per ip) → null, row(pk, sk), setNow(iso), sign(payload) → payload +
  "." + signature (a token for any payload).
subject: visits
init:
  secret: visits-contract-secret-0123456789
  now: "2030-01-01T00:00:00.000Z"
  ids: ["00000000-0000-4000-8000-000000000001", "00000000-0000-4000-8000-000000000002", "00000000-0000-4000-8000-000000000003"]
cases:
  # --- start ------------------------------------------------------------------
  - name: start returns a signed token, the point limit and the public pages
    call: start
    args: [127.0.0.1]
    expect:
      value:
        token: eyJpZCI6IjAwMDAwMDAwLTAwMDAtNDAwMC04MDAwLTAwMDAwMDAwMDAwMSIsInN0YXJ0ZWRBdCI6MTg5MzQ1NjAwMDAwMH0.PfLXHltgXNxsnYwLyX4alqkZ7PY2HR4GaG8zdsHjc-U
        maxPoints: 120
        pages: [/, /about, /services]

  - name: tokens signed by any language are valid
    tags: [interop]
    steps:
      - { call: sign, args: [eyJpZCI6ImN1c3RvbS0xIiwic3RhcnRlZEF0IjoxODkzNDU2MDAwMDAwfQ], expect: { value: "eyJpZCI6ImN1c3RvbS0xIiwic3RhcnRlZEF0IjoxODkzNDU2MDAwMDAwfQ.Qt0DdLfsMmSPfICfsuvA1yOa-97eW7Cem7jJlvl9U7M" } }
      - { call: ingest, args: [{ token: { $ref: "0.value" }, sequence: 1, points: [{ type: page, path: /about, t: 0, x: 0, y: 0 }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: list, expect: { value: { items: [{ id: custom-1, startedAt: 1893456000000, updatedAt: 1893456000000, sequence: 1, events: 1, pages: [/about] }], limit: 10, maxPoints: 120 } } }

  - name: custom pages are returned and enforced
    init: { secret: visits-contract-secret-0123456789, now: "2030-01-01T00:00:00.000Z", pages: [/docs, /docs/getting_started-2] }
    steps:
      - { call: start, args: [a], expect: { value: { token: { $type: string }, maxPoints: 120, pages: [/docs, /docs/getting_started-2] } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: page, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: page, path: /docs/getting_started-2, t: 0, x: 0, y: 0 }] }, a], expect: { value: { ok: true, recorded: true } } }

  # --- configuration ------------------------------------------------------------
  - name: the secret needs 32 characters
    tags: [validation, security]
    init: { secret: visits-contract-secret-01234567, now: "2030-01-01T00:00:00.000Z" }
    create: { error: { status: null, message: Visits requires a server secret of at least 32 characters } }

  - name: secret length counts UTF-16 code units
    tags: [validation, edge]
    init: { secret: "🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑", now: "2030-01-01T00:00:00.000Z", ids: ["00000000-0000-4000-8000-000000000001"] }
    steps:
      - { call: start, args: [a], expect: { value: { $partial: { token: eyJpZCI6IjAwMDAwMDAwLTAwMDAtNDAwMC04MDAwLTAwMDAwMDAwMDAwMSIsInN0YXJ0ZWRBdCI6MTg5MzQ1NjAwMDAwMH0.IRSN7zNHnNACN65QaK_azClbPSHzyfNEAozcuib2OKQ } } }, note: "16 emoji are 32 code units; the HMAC key is their UTF-8 bytes" }

  - name: fifteen emoji and a letter are too short
    tags: [validation, edge]
    init: { secret: "🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑a", now: "2030-01-01T00:00:00.000Z" }
    create: { error: { status: null, message: Visits requires a server secret of at least 32 characters } }

  - name: pages must be simple absolute paths
    tags: [validation]
    init: { secret: visits-contract-secret-0123456789, pages: [/, about] }
    create: { error: { status: null, message: Invalid public visit pages } }

  - name: pages cannot carry queries
    tags: [validation, security]
    init: { secret: visits-contract-secret-0123456789, pages: ["/account?token=1"] }
    create: { error: { status: null, message: Invalid public visit pages } }

  - name: a trailing newline does not end a page path
    tags: [validation, edge]
    init: { secret: visits-contract-secret-0123456789, pages: ["/about\n"] }
    create: { error: { status: null, message: Invalid public visit pages } }

  - name: page paths are ASCII
    tags: [validation, edge]
    init: { secret: visits-contract-secret-0123456789, pages: ["/café"] }
    create: { error: { status: null, message: Invalid public visit pages } }

  - name: page paths have at most 80 characters
    tags: [validation, edge]
    init: { secret: visits-contract-secret-0123456789, pages: [{ $text: { repeat: "/", count: 81 } }] }
    create: { error: { status: null, message: Invalid public visit pages } }

  - name: at most 30 pages
    tags: [validation]
    init: { secret: visits-contract-secret-0123456789, pages: [{ $repeat: { count: 31, item: "/p{i}" } }] }
    create: { error: { status: null, message: Invalid public visit pages } }

  - name: the largest valid page list
    tags: [edge]
    init: { secret: visits-contract-secret-0123456789, now: "2030-01-01T00:00:00.000Z", pages: [{ $repeat: { count: 29, item: "/p{i}" } }, { $text: { repeat: "/", count: 80 } }] }
    call: start
    args: [a]
    expect: { value: { $partial: { pages: { $length: 30 } } } }

  - name: no pages means no valid points
    tags: [edge]
    init: { secret: visits-contract-secret-0123456789, now: "2030-01-01T00:00:00.000Z", pages: [] }
    steps:
      - { call: start, args: [a], expect: { value: { $partial: { pages: [] } } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: page, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }

  # --- ingest -------------------------------------------------------------------
  - name: ingest stores points and list, detail and the row show them
    steps:
      - { call: start, args: [a], expect: { value: { $partial: { maxPoints: 120 } } } }
      - { call: setNow, args: ["2030-01-01T00:00:01.234Z"], expect: { value: null } }
      - call: ingest
        args:
          - token: { $ref: "0.value.token" }
            sequence: 1
            points:
              - { type: page, path: /, t: 0, x: 0, y: 0 }
              - { type: move, path: /about, t: 1800000, x: 100, y: 100, text: secret form value }
              - { type: scroll, path: /, t: 7, x: 50, y: 99 }
          - a
        expect: { value: { ok: true, recorded: true } }
      - call: list
        expect: { value: { items: [{ id: "00000000-0000-4000-8000-000000000001", startedAt: 1893456000000, updatedAt: 1893456001234, sequence: 1, events: 3, pages: [/, /about] }], limit: 10, maxPoints: 120 } }
      - call: detail
        args: ["00000000-0000-4000-8000-000000000001"]
        expect:
          value:
            id: "00000000-0000-4000-8000-000000000001"
            startedAt: 1893456000000
            updatedAt: 1893456001234
            sequence: 1
            points:
              - { type: page, path: /, t: 0, x: 0, y: 0 }
              - { type: move, path: /about, t: 1800000, x: 100, y: 100 }
              - { type: scroll, path: /, t: 7, x: 50, y: 99 }
        note: extra point fields (text) are never stored
      - call: row
        args: [VISITS, recent]
        expect:
          value:
            pk: VISITS
            sk: recent
            version: 1
            ttl: 1893542402
            data:
              sessions:
                - id: "00000000-0000-4000-8000-000000000001"
                  startedAt: 1893456000000
                  updatedAt: 1893456001234
                  sequence: 1
                  points:
                    - { type: page, path: /, t: 0, x: 0, y: 0 }
                    - { type: move, path: /about, t: 1800000, x: 100, y: 100 }
                    - { type: scroll, path: /, t: 7, x: 50, y: 99 }
        note: ttl = ceil((now + 86400000) / 1000)

  - name: sequences only move forward
    tags: [edge]
    steps:
      - { call: start, args: [a], expect: { value: { $partial: { maxPoints: 120 } } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 1, x: 1, y: 1 }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: setNow, args: ["2030-01-01T00:00:05.000Z"], expect: { value: null } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 2, x: 2, y: 2 }] }, a], expect: { value: { ok: true, recorded: false } } }
      - { call: detail, args: ["00000000-0000-4000-8000-000000000001"], expect: { value: { $partial: { sequence: 1, updatedAt: 1893456000000, points: { $length: 1 } } } } }
      - { call: row, args: [VISITS, recent], expect: { value: { $partial: { version: 2, ttl: 1893542405 } } }, note: "a replayed batch still rewrites the row" }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 3, points: [{ type: click, path: /, t: 3, x: 3, y: 3 }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 2, points: [{ type: click, path: /, t: 4, x: 4, y: 4 }] }, a], expect: { value: { ok: true, recorded: false } } }
      - { call: detail, args: ["00000000-0000-4000-8000-000000000001"], expect: { value: { $partial: { sequence: 3, updatedAt: 1893456005000, points: [{ type: click, path: /, t: 1, x: 1, y: 1 }, { type: click, path: /, t: 3, x: 3, y: 3 }] } } } }

  - name: a session keeps at most 120 points
    tags: [edge]
    steps:
      - { call: start, args: [a], expect: { value: { $partial: { maxPoints: 120 } } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ $repeat: { count: 20, item: { type: move, path: /, t: "{i}", x: 1, y: 1 } } }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 2, points: [{ $repeat: { count: 20, start: 20, item: { type: move, path: /, t: "{i}", x: 1, y: 1 } } }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 3, points: [{ $repeat: { count: 20, start: 40, item: { type: move, path: /, t: "{i}", x: 1, y: 1 } } }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 4, points: [{ $repeat: { count: 20, start: 60, item: { type: move, path: /, t: "{i}", x: 1, y: 1 } } }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 5, points: [{ $repeat: { count: 20, start: 80, item: { type: move, path: /, t: "{i}", x: 1, y: 1 } } }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 6, points: [{ $repeat: { count: 15, start: 100, item: { type: move, path: /, t: "{i}", x: 1, y: 1 } } }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 7, points: [{ $repeat: { count: 20, start: 115, item: { type: click, path: /about, t: "{i}", x: 2, y: 2 } } }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 8, points: [{ type: page, path: /services, t: 999, x: 3, y: 3 }] }, a], expect: { value: { ok: true, recorded: true } } }
      - { call: list, expect: { value: { $partial: { items: [{ $partial: { sequence: 8, events: 120, pages: [/, /about] } }] } } } }
      - { call: detail, args: ["00000000-0000-4000-8000-000000000001"], expect: { value: { $partial: { points: { $length: 120 } } } } }

  - name: batches need a positive safe-integer sequence and 1-20 points
    tags: [validation]
    steps:
      - { call: start, args: [a], expect: { value: { $partial: { maxPoints: 120 } } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 0, points: [{ type: click, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: -1, points: [{ type: click, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1.5, points: [{ type: click, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: "1", points: [{ type: click, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: true, points: [{ type: click, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, points: [{ type: click, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 9007199254740992, points: [{ type: click, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [] }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1 }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: { type: click } }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ $repeat: { count: 21, item: { type: click, path: /, t: 0, x: 0, y: 0 } } }] }, a], expect: { error: { status: 400, message: Invalid visit batch } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [bad] }, a], expect: { error: { status: 400, message: Invalid visit point } }, note: "the batch is checked before its points" }
      - { call: row, args: [VISITS, recent], expect: { value: null } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 9007199254740991, points: [{ $repeat: { count: 20, item: { type: click, path: /, t: 0, x: 0, y: 0 } } }] }, a], expect: { value: { ok: true, recorded: true } } }

  - name: points are validated one by one and reject the whole batch
    tags: [validation]
    steps:
      - { call: start, args: [a], expect: { value: { $partial: { maxPoints: 120 } } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 0, x: 0, y: 0 }, null] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [5] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [[click, /, 0, 0, 0]] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: hover, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: Click, path: /, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: "/account?token=secret", t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /about/, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, t: 0, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: -1, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 1800001, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 0.5, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: "0", x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, x: 0, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 0, x: 101, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 0, x: -1, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 0, x: 1.5, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 0, x: true, y: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 0, x: 0, y: 100.5 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 0, x: 0, y: -1 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [{ type: click, path: /, t: 0, x: 0 }] }, a], expect: { error: { status: 400, message: Invalid visit point } } }
      - { call: row, args: [VISITS, recent], expect: { value: null } }

  # --- tokens -------------------------------------------------------------------
  - name: malformed or tampered tokens are rejected
    tags: [validation, security]
    steps:
      - { call: start, args: [a], expect: { value: { $partial: { maxPoints: 120 } } } }
      - { call: ingest, args: [{ token: { $ref: "0.value.token" }, sequence: 1, points: [bad] }, a], expect: { error: { status: 400, message: Invalid visit point } }, note: "the token of step 1 is valid" }
      - { call: ingest, args: [{ token: x, sequence: 1, points: [bad] }, a], expect: { error: { status: 400, message: Invalid visit token } }, note: "the token is checked before the batch" }
      - { call: ingest, args: [{ token: "", sequence: 1, points: [] }, a], expect: { error: { status: 400, message: Invalid visit token } } }
