  # --- rate limits ----------------------------------------------------------------
  - name: 60 calls per ip per minute
    tags: [security]
    steps:
      - { call: startEach, args: [[{ $repeat: { count: 60, item: a } }]], expect: { value: null } }
      - { call: start, args: [a], expect: { error: { status: 429, message: Visit rate limit } } }
      - { call: start, args: [b], expect: { value: { $partial: { maxPoints: 120 } } } }
      - { call: setNow, args: ["2030-01-01T00:00:59.999Z"], expect: { value: null } }
      - { call: start, args: [a], expect: { error: { status: 429, message: Visit rate limit } } }
      - { call: setNow, args: ["2030-01-01T00:01:00.000Z"], expect: { value: null } }
      - { call: start, args: [a], expect: { value: { $partial: { maxPoints: 120 } } } }

  - name: ingestion shares the limit and is limited before the token is read
    tags: [security]
    steps:
      - { call: startEach, args: [[{ $repeat: { count: 59, item: c } }]], expect: { value: null } }
      - { call: ingest, args: [{ token: x, sequence: 1, points: [] }, c], expect: { error: { status: 400, message: Invalid visit token } } }
      - { call: ingest, args: [{ token: x, sequence: 1, points: [] }, c], expect: { error: { status: 429, message: Visit rate limit } } }

  - name: at most 2000 clients are tracked at once
    tags: [security, edge]
    steps:
      - { call: startEach, args: [[{ $repeat: { count: 2000, item: "10.0.{i}" } }]], expect: { value: null } }
      - { call: start, args: [new], expect: { error: { status: 429, message: Visits busy } } }
      - { call: start, args: ["10.0.0"], expect: { value: { $partial: { maxPoints: 120 } } } }
      - { call: setNow, args: ["2030-01-01T00:01:00.000Z"], expect: { value: null } }
      - { call: start, args: [new], expect: { value: { $partial: { maxPoints: 120 } } } }
