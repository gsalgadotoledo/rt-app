      - { call: row, args: [VISITS, recent], expect: { value: { pk: VISITS, sk: recent, version: 4, ttl: 1893542400, data: { sessions: [{ id: kept, startedAt: 1893369600001, updatedAt: 1893369600001, sequence: 1, points: [] }] } } } }

  - name: a stored row without sessions is empty
    tags: [interop, edge]
    init: { secret: visits-contract-secret-0123456789, now: "2030-01-01T00:00:00.000Z", rows: [{ pk: VISITS, sk: recent, version: 1, data: {} }] }
    steps:
