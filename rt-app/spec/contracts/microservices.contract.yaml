  single: &single { "keys": [ { "kty": "RSA", "n": "2c69hn3A5anv3tR4oN6zVeXi5Y6gzvh_VT2tEus9Esane7ZPBoCA1jiAWwEnhN-YEtsVwp_CnSGMA-_ebl6fAFrMdbyT9pjXjCycQX5Jcsl-1kYw08zqzpvlaG8SYpJ_qlkgUXznRkjginGqoJEh9KiEZCMAkpBqRhoPCwZghM1mwPSYVvqgDLusOQ_WBIANr7c69VKTr6cFEQmNViBIoof1OCOoE13BHT95iBWvNrHbhfIdvhKDkcL6JakTS-QsIgz7MukqUWf-RubtDKcvlZDWnlorvcHEyNdysbMtH3_wv8miGKXaQl5Hsi6APb5xSY7DwTU2pHWbyHeD7E074Q", "e": "AQAB", "kid": "rsa-1", "alg": "RS256", "use": "sig" }, { "kty": "EC", "x": "TggizCAqGeduFzf-HVYXUZOAxazeF0lQchig43EgKXQ", "y": "5_KWNH7NmqNb2qc3iCCl3Wp4Go6mwlTyssuiAZnLsqk", "crv": "P-256", "kid": "ec-1" }, { "kty": "EC", "x": "hogImzrhfr0u77rhZlznLrsKhrJ9Z3G87mo4XQhhXZvcGOPjS0AFDHGFwArT9OOB", "y": "KQqMq8FqU2hkWlqNtsY-TwncEwp21W0zyUmSbOAq0FNRFxR5jAUaDrIGPFS64l2K", "crv": "P-384", "kid": "ec-384" } ] }
  serviceActors: &serviceActors { svc: { id: svc, role: user, grants: [ inventory.read ], active: true }, "5": { id: "5", role: user, grants: [], active: true }, sleepy: { id: sleepy, role: user, grants: [], active: false } }
init:
  features: *x
  tokens: { good: *actor, boss: *owner }
cases:
  # --- hosting ----------------------------------------------------------------------------------
  - name: hosts a feature endpoint with the authenticated actor and a generated request id
    steps:
      - call: handle
        args: [ { method: GET, path: /x/42, headers: { authorization: Bearer good, x-user-id: evil, x-request-id: forged } } ]
        expect:
          value:
            status: 200
            body:
              params: { id: "42" }
              actor: *actor
              headers: { authorization: Bearer good, x-user-id: evil, x-request-id: { $regex: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" } }
            headers: { x-request-id: { $regex: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" } }
      - { call: authentications, expect: { value: [ good ] } }
      - { call: observations, expect: { value: [ { requestId: { $ref: "0.value.headers.x-request-id" }, route: "/x/:id", status: 200, durationMs: { $type: number } } ] } }
      - { call: handle, args: [ { path: /x/42, headers: { authorization: Bearer good } } ], expect: { value: { $partial: { status: 200 } } } }

  - name: the handler sees the same request id as the response
    steps:
      - { call: handle, args: [ { path: /x/1, headers: { authorization: Bearer good } } ], expect: { value: { $partial: { status: 200 } } } }
      - { call: observations, expect: { value: [ { requestId: { $ref: "0.value.body.headers.x-request-id" }, route: "/x/:id", status: 200, durationMs: { $type: number } } ] } }
      - { call: observations, expect: { value: [ { requestId: { $ref: "0.value.headers.x-request-id" }, route: "/x/:id", status: 200, durationMs: { $type: number } } ] } }

  - name: unknown routes answer 404 before authentication
    steps:
      - { call: handle, args: [ { path: /no, headers: { authorization: Bearer good } } ], expect: { value: { status: 404, body: { error: Not found }, headers: { x-request-id: { $regex: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" } } } } }
      - { call: handle, args: [ { method: POST, path: /x/1 } ], expect: { value: { $partial: { status: 404, body: { error: Not found } } } }, note: methods compare exactly }
      - { call: handle, args: [ { method: get, path: /x/1 } ], expect: { value: { $partial: { status: 404 } } } }
      - { call: handle, args: [ { path: /x/1/2 } ], expect: { value: { $partial: { status: 404 } } } }
      - { call: handle, args: [ { path: /x/ } ], expect: { value: { $partial: { status: 404 } } } }
      - { call: handle, args: [ { path: /x/1// } ], expect: { value: { $partial: { status: 404 } } } }
      - { call: authentications, expect: { value: [] } }
      - { call: observations, expect: { value: [ { $partial: { route: /unmatched, status: 404 } }, { $partial: { route: /unmatched, status: 404 } }, { $partial: { route: /unmatched, status: 404 } }, { $partial: { route: /unmatched, status: 404 } }, { $partial: { route: /unmatched, status: 404 } }, { $partial: { route: /unmatched, status: 404 } } ] } }

  - name: routes allow one trailing slash and escape literal segments
    init:
      tokens: { good: *actor }
      features:
        - id: f
          endpoints:
            - { method: GET, path: /files/a.b, resource: f.read, access: guest, reply: { value: literal } }
            - { method: GET, path: "/files/:name/raw", resource: f.read, access: guest }
            - { method: GET, path: "/pairs/:id/sub/:id", resource: f.read, access: guest }
            - { method: GET, path: "/u/:id", resource: f.read, access: guest }
            - { method: GET, path: /u/me, resource: f.read, access: guest, reply: { value: me } }
    steps:
      - { call: handle, args: [ { path: /files/a.b/ } ], expect: { value: { $partial: { status: 200, body: literal } } } }
      - { call: handle, args: [ { path: /files/aXb } ], expect: { value: { $partial: { status: 404 } } } }
      - { call: handle, args: [ { path: /files/x%20y/raw/ } ], expect: { value: { $partial: { status: 200, body: { params: { name: x y }, actor: null, headers: { x-request-id: { $type: string } } } } } } }
      - { call: handle, args: [ { path: /pairs/1/sub/2 } ], expect: { value: { $partial: { status: 200, body: { $partial: { params: { id: "2" } } } } } }, note: the last duplicate name wins }
      - { call: handle, args: [ { path: /u/me } ], expect: { value: { $partial: { status: 200, body: { $partial: { params: { id: me } } } } } }, note: the first declared route wins }

  - name: parameters are URL-decoded after authorization
    init:
      tokens: { good: *actor }
      features:
        - id: x
          endpoints:
            - { method: GET, path: "/x/:id", resource: x.read, access: permission }
            - { method: GET, path: "/g/:id", resource: g.read, access: guest }
    steps:
      - { call: handle, args: [ { path: /x/%E0, headers: { authorization: Bearer good } } ], expect: { value: { status: 400, body: { error: Invalid route encoding }, headers: { x-request-id: { $type: string } } } } }
      - { call: handle, args: [ { path: /x/%E0 } ], expect: { value: { $partial: { status: 401, body: { error: Sign in } } } }, note: access is checked first }
      - { call: handle, args: [ { path: /g/a%2Fb%20%C3%A9+%F0%9F%98%80 } ], expect: { value: { $partial: { status: 200, body: { $partial: { params: { id: "a/b é+😀" } } } } } } }
      - { call: handle, args: [ { path: /g/%zz } ], expect: { value: { $partial: { status: 400, body: { error: Invalid route encoding } } } } }
      - { call: handle, args: [ { path: /g/% } ], expect: { value: { $partial: { status: 400 } } } }
      - { call: handle, args: [ { path: /g/%C0%AF } ], expect: { value: { $partial: { status: 400 } } }, note: overlong UTF-8 }
      - { call: handle, args: [ { path: /g/%ED%A0%80 } ], expect: { value: { $partial: { status: 400 } } }, note: an encoded surrogate }
      - { call: handle, args: [ { path: /g/%F4%90%80%80 } ], expect: { value: { $partial: { status: 400 } } }, note: above U+10FFFF }
      - { call: handle, args: [ { path: /g/%41%62 } ], expect: { value: { $partial: { status: 200, body: { $partial: { params: { id: Ab } } } } } } }
      - { call: handle, args: [ { path: /g/é } ], expect: { value: { $partial: { status: 200, body: { $partial: { params: { id: é } } } } } } }
      - { call: observations, expect: { value: [ { $partial: { route: "/x/:id", status: 400 } }, { $partial: { route: "/x/:id", status: 401 } }, { $partial: { route: "/g/:id", status: 200 } }, { $partial: { route: "/g/:id", status: 400 } }, { $partial: { route: "/g/:id", status: 400 } }, { $partial: { route: "/g/:id", status: 400 } }, { $partial: { route: "/g/:id", status: 400 } }, { $partial: { route: "/g/:id", status: 400 } }, { $partial: { route: "/g/:id", status: 200 } }, { $partial: { route: "/g/:id", status: 200 } } ] } }

  - name: duplicate routes are refused when the service is created
    init:
      features:
        - { id: a, endpoints: [ { method: GET, path: "/x/:id", resource: a, access: guest } ] }
        - { id: b, endpoints: [ { method: GET, path: "/x/:id", resource: b, access: guest } ] }
    create: { error: { message: Duplicate service route } }

  - name: routes differing in method, parameter name or trailing slash are distinct
    init:
      features:
        - id: a
          endpoints:
            - { method: GET, path: "/x/:id", resource: a, access: guest, reply: { value: 1 } }
            - { method: POST, path: "/x/:id", resource: a, access: guest, reply: { value: 2 } }
            - { method: GET, path: "/x/:other", resource: a, access: guest, reply: { value: 3 } }
            - { method: GET, path: "/x/:id/", resource: a, access: guest, reply: { value: 4 } }
    steps:
      - { call: handle, args: [ { path: /x/1 } ], expect: { value: { $partial: { status: 200, body: 1 } } } }
      - { call: handle, args: [ { method: POST, path: /x/1 } ], expect: { value: { $partial: { status: 200, body: 2 } } } }

  # --- authentication ---------------------------------------------------------------------------
  - name: the authorization header must be one Bearer token
    steps:
      - { call: handle, args: [ { path: /x/1, headers: { authorization: Basic good } } ], expect: { value: { $partial: { status: 401, body: { error: Invalid authorization } } } } }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: "Bearer good extra" } } ], expect: { value: { $partial: { status: 401, body: { error: Invalid authorization } } } } }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: "Bearer  good" } } ], expect: { value: { $partial: { status: 401, body: { error: Invalid authorization } } } } }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: "Bearer\tgood" } } ], expect: { value: { $partial: { status: 401, body: { error: Invalid authorization } } } } }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: "Bearer good " } } ], expect: { value: { $partial: { status: 401, body: { error: Invalid authorization } } } }, note: JavaScript \s includes NBSP }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: "Bearer good\n" } } ], expect: { value: { $partial: { status: 401, body: { error: Invalid authorization } } } }, note: $ accepts no trailing newline }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: "Bearer " } } ], expect: { value: { $partial: { status: 401, body: { error: Invalid authorization } } } } }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: Bearer } } ], expect: { value: { $partial: { status: 401, body: { error: Invalid authorization } } } } }
      - { call: authentications, expect: { value: [] } }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: bEARER good } } ], expect: { value: { $partial: { status: 200 } } }, note: the scheme is case-insensitive }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: "Bearer go​od" } } ], expect: { value: { $partial: { status: 401, body: { error: Unknown token } } } }, note: U+200B is not whitespace }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: "Bearer a.b-c_~+/=" } } ], expect: { value: { $partial: { status: 401, body: { error: Unknown token } } } } }
      - { call: authentications, expect: { value: [ good, "go​od", "a.b-c_~+/=" ] } }

  - name: requests without authorization are anonymous
    init:
      tokens: {}
      features:
        - id: x
          endpoints:
            - { method: GET, path: /public, resource: x.public, access: guest }
            - { method: GET, path: /private, resource: x.private, access: authenticated }
    steps:
      - { call: handle, args: [ { path: /public } ], expect: { value: { $partial: { status: 200, body: { params: {}, actor: null, headers: { x-request-id: { $type: string } } } } } } }
      - { call: handle, args: [ { path: /public, headers: { authorization: "" } } ], expect: { value: { $partial: { status: 200 } } }, note: an empty header is absent }
      - { call: handle, args: [ { path: /private } ], expect: { value: { $partial: { status: 401, body: { error: Sign in } } } } }
      - { call: handle, args: [ { path: /public, headers: { authorization: Bearer nobody } } ], expect: { value: { $partial: { status: 401, body: { error: Unknown token } } } }, note: a present token is verified even on guest endpoints }
      - { call: handle, args: [ { path: /public, headers: { authorization: Basic x } } ], expect: { value: { $partial: { status: 401, body: { error: Invalid authorization } } } } }

  - name: authenticator failures keep HTTP errors and hide the others
    init:
      features: *x
      tokens: { revoked: { error: { status: 401, message: Invalid or revoked session } }, teapot: { error: { status: 418, message: short and stout } }, broken: { error: { message: database password leaked } } }
    steps:
      - { call: handle, args: [ { path: /x/1, headers: { authorization: Bearer revoked } } ], expect: { value: { $partial: { status: 401, body: { error: Invalid or revoked session } } } } }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: Bearer teapot } } ], expect: { value: { $partial: { status: 418, body: { error: short and stout } } } } }
      - { call: handle, args: [ { path: /x/1, headers: { authorization: Bearer broken } } ], expect: { value: { status: 500, body: { error: Internal error }, headers: { x-request-id: { $type: string } } } } }
      - { call: observations, expect: { value: [ { $partial: { route: "/x/:id", status: 401 } }, { $partial: { route: "/x/:id", status: 418 } }, { $partial: { route: "/x/:id", status: 500 } } ] } }

  # --- access -----------------------------------------------------------------------------------
  - name: access policies match the framework
    init:
      tokens:
        user: *actor
        owner: *owner
        ownerWithGrant: { id: o2, role: owner, grants: [ x.read ], active: true }
        admin: { id: a, role: admin, grants: [], active: true }
        inactive: { id: i, role: owner, grants: [ x.read ], active: false }
        noActive: { id: n, role: owner, grants: [ x.read ] }
      features:
        - id: x
          endpoints:
            - { method: GET, path: /permission, resource: x.read, access: permission, reply: { value: ok } }
            - { method: GET, path: /other, resource: x.write, access: permission, reply: { value: ok } }
            - { method: GET, path: /explicit, resource: x.read, access: permission, explicitGrant: true, reply: { value: ok } }
            - { method: GET, path: /explicit-other, resource: x.write, access: permission, explicitGrant: true, reply: { value: ok } }
            - { method: GET, path: /owner, resource: x.admin, access: owner, reply: { value: ok } }
            - { method: GET, path: /authenticated, resource: x.me, access: authenticated, reply: { value: ok } }
            - { method: GET, path: /custom, resource: x.custom, access: admin, reply: { value: ok } }
            - { method: GET, path: /guest, resource: x.guest, access: guest, reply: { value: ok } }
    steps:
      - { call: handle, args: [ { path: /permission, headers: { authorization: Bearer user } } ], expect: { value: { $partial: { status: 200, body: ok } } } }
      - { call: handle, args: [ { path: /other, headers: { authorization: Bearer user } } ], expect: { value: { $partial: { status: 403, body: { error: Permission required } } } } }
      - { call: handle, args: [ { path: /other, headers: { authorization: Bearer owner } } ], expect: { value: { $partial: { status: 200 } } }, note: owners pass permission endpoints }
      - { call: handle, args: [ { path: /other, headers: { authorization: Bearer admin } } ], expect: { value: { $partial: { status: 403, body: { error: Permission required } } } } }
      - { call: handle, args: [ { path: /explicit, headers: { authorization: Bearer owner } } ], expect: { value: { $partial: { status: 403, body: { error: Permission required } } } }, note: explicitGrant needs the grant even for owners }
      - { call: handle, args: [ { path: /explicit, headers: { authorization: Bearer ownerWithGrant } } ], expect: { value: { $partial: { status: 200 } } } }
      - { call: handle, args: [ { path: /explicit, headers: { authorization: Bearer user } } ], expect: { value: { $partial: { status: 200 } } } }
      - { call: handle, args: [ { path: /explicit-other, headers: { authorization: Bearer user } } ], expect: { value: { $partial: { status: 403 } } } }
      - { call: handle, args: [ { path: /owner, headers: { authorization: Bearer user } } ], expect: { value: { $partial: { status: 403, body: { error: Owner permission required } } } } }
      - { call: handle, args: [ { path: /owner, headers: { authorization: Bearer admin } } ], expect: { value: { $partial: { status: 403, body: { error: Owner permission required } } } } }
      - { call: handle, args: [ { path: /owner, headers: { authorization: Bearer owner } } ], expect: { value: { $partial: { status: 200 } } } }
      - { call: handle, args: [ { path: /authenticated, headers: { authorization: Bearer admin } } ], expect: { value: { $partial: { status: 200 } } } }
      - { call: handle, args: [ { path: /custom, headers: { authorization: Bearer user } } ], expect: { value: { $partial: { status: 200 } } }, note: unknown access values only need an active actor }
      - { call: handle, args: [ { path: /custom } ], expect: { value: { $partial: { status: 401, body: { error: Sign in } } } } }
      - { call: handle, args: [ { path: /owner, headers: { authorization: Bearer inactive } } ], expect: { value: { $partial: { status: 401, body: { error: Sign in } } } } }
      - { call: handle, args: [ { path: /authenticated, headers: { authorization: Bearer noActive } } ], expect: { value: { $partial: { status: 401, body: { error: Sign in } } } } }
      - { call: handle, args: [ { path: /guest, headers: { authorization: Bearer inactive } } ], expect: { value: { $partial: { status: 200 } } }, note: guest endpoints accept any verified actor }
      - { call: handle, args: [ { path: /permission } ], expect: { value: { $partial: { status: 401, body: { error: Sign in } } } } }

  # --- handlers, metering, telemetry -----------------------------------------------------------
  - name: handler errors keep HTTP errors and hide the others
    init:
      tokens: {}
      features:
        - id: h
          endpoints:
            - { method: GET, path: /secret, resource: h, access: guest, reply: { error: { message: secret connection string } } }
            - { method: GET, path: /conflict, resource: h, access: guest, reply: { error: { status: 409, message: "Conflict: refresh and try again" } } }
            - { method: GET, path: /null, resource: h, access: guest, reply: { value: null } }
            - { method: GET, path: /list, resource: h, access: guest, reply: { value: [ 1, "two", { three: 3 } ] } }
    steps:
      - { call: handle, args: [ { path: /secret } ], expect: { value: { status: 500, body: { error: Internal error }, headers: { x-request-id: { $type: string } } } } }
      - { call: handle, args: [ { path: /conflict } ], expect: { value: { $partial: { status: 409, body: { error: "Conflict: refresh and try again" } } } } }
      - { call: handle, args: [ { path: /null } ], expect: { value: { status: 200, body: null, headers: { x-request-id: { $type: string } } } } }
      - { call: handle, args: [ { path: /list } ], expect: { value: { $partial: { status: 200, body: [ 1, "two", { three: 3 } ] } } } }
      - { call: observations, expect: { value: [ { $partial: { route: /secret, status: 500 } }, { $partial: { route: /conflict, status: 409 } }, { $partial: { route: /null, status: 200 } }, { $partial: { route: /list, status: 200 } } ] } }

  - name: metered endpoints fail closed without a metering adapter
    init:
      tokens: { good: *actor }
      features: &metered
        - id: m
          endpoints:
            - { method: GET, path: /m, resource: x.read, access: permission, subscription: { product: x, credits: 1 }, reply: { value: done } }
            - { method: GET, path: /empty, resource: x.read, access: guest, subscription: {}, reply: { value: done } }
            - { method: GET, path: /free, resource: x.read, access: guest, reply: { value: free } }
    steps:
      - { call: handle, args: [ { path: /m, headers: { authorization: Bearer good } } ], expect: { value: { $partial: { status: 503, body: { error: Metering adapter required } } } } }
      - { call: handle, args: [ { path: /empty } ], expect: { value: { $partial: { status: 503, body: { error: Metering adapter required } } } }, note: an empty subscription object is still metered }
      - { call: handle, args: [ { path: /m } ], expect: { value: { $partial: { status: 401 } } }, note: access is checked before metering }
      - { call: handle, args: [ { path: /free } ], expect: { value: { $partial: { status: 200, body: free } } } }

  - name: metered endpoints run through invokeMetered
    init:
      tokens: { good: *actor }
      metering: {}
      features: *metered
    steps:
      - { call: handle, args: [ { path: /m, headers: { authorization: Bearer good } } ], expect: { value: { $partial: { status: 200, body: done } } } }
      - { call: handle, args: [ { path: /empty } ], expect: { value: { $partial: { status: 200, body: done } } } }
      - { call: handle, args: [ { path: /free } ], expect: { value: { $partial: { status: 200, body: free } } } }
      - { call: metered, expect: { value: [ { resource: x.read, subscription: { product: x, credits: 1 }, actor: u }, { resource: x.read, subscription: {}, actor: null } ] } }

  - name: metering failures are answered like handler failures
    init:
      tokens: { good: *actor }
      metering: { error: { status: 402, message: Insufficient credits } }
      features: *metered
    steps:
      - { call: handle, args: [ { path: /m, headers: { authorization: Bearer good } } ], expect: { value: { $partial: { status: 402, body: { error: Insufficient credits } } } } }
      - { call: metered, expect: { value: [ { resource: x.read, subscription: { product: x, credits: 1 }, actor: u } ] } }

  - name: telemetry failures and a missing observer never change the answer
    init:
      tokens: {}
      observe: fail
      features: [ { id: g, endpoints: [ { method: GET, path: /g, resource: g, access: guest, reply: { value: { public: true } } } ] } ]
    steps:
      - { call: handle, args: [ { path: /g } ], expect: { value: { $partial: { status: 200, body: { public: true } } } } }
      - { call: handle, args: [ { path: /nope } ], expect: { value: { $partial: { status: 404 } } } }
      - { call: observations, expect: { value: [ { $partial: { route: /g, status: 200 } }, { $partial: { route: /unmatched, status: 404 } } ] } }

  - name: without an observer requests are still answered
    init:
      tokens: {}
      observe: none
      features: [ { id: g, endpoints: [ { method: GET, path: /g, resource: g, access: guest, reply: { value: 1 } } ] } ]
    steps:
      - { call: handle, args: [ { path: /g } ], expect: { value: { $partial: { status: 200, body: 1 } } } }
      - { call: observations, expect: { value: [] } }

  - name: every request gets a new request id
    init:
      tokens: {}
      features: [ { id: g, endpoints: [ { method: GET, path: /g, resource: g, access: guest, reply: { value: 1 } } ] } ]
    steps:
      - { call: handle, args: [ { path: /g } ], expect: { value: { $partial: { status: 200 } } } }
      - { call: handle, args: [ { path: /g } ], expect: { value: { $partial: { status: 200 } } } }
      - { call: observations, expect: { value: [ { $partial: { requestId: { $ref: "0.value.headers.x-request-id" } } }, { $partial: { requestId: { $ref: "1.value.headers.x-request-id" } } } ] } }

