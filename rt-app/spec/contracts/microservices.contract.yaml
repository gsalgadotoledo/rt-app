contract: 1
module: microservices
title: Feature hosting and forwarding (createMicroservice, authenticators, remoteFeature)
description: |
  @gsalgadotoledo/rt-app-microservices. Reference: packages/microservices/src/index.ts. The module
  has no endpoints of its own (it hosts other features), so there is no HTTP contract.

  createMicroservice({features, authenticate, invokeMetered?, observe?}). Routes are every endpoint
  of every feature in declaration order; ":name" segments match [^/]+, other segments literally, and
  one trailing "/" is allowed. The first declared match wins (no literal-over-parameter priority);
  methods compare exactly. Two endpoints with the same method and path string → TypeError
  "Duplicate service route" when the service is created. handle(request) → {status, body, headers:
  {"x-request-id": <random UUID v4>}}, in this order:
  1. no route → 404 "Not found" (route "/unmatched");
  2. a present (truthy) authorization header must match /^Bearer [^\s]+$/i (JavaScript \s) →
     401 "Invalid authorization"; the token is the header from its 8th character and is passed to
     authenticate.authenticate(token), whose errors propagate (non-HTTP errors become 500);
  3. access: guest passes; otherwise a missing or inactive actor → 401 "Sign in"; owner needs role
     owner (403 "Owner permission required"); permission needs the resource in grants or, unless
     explicitGrant, role owner (403 "Permission required"); any other access only needs the actor;
  4. params: decodeURIComponent of each match (last duplicate name wins) → 400 "Invalid route
     encoding" on malformed escapes or UTF-8;
  5. the handler gets {request: {...request, headers: {...headers, "x-request-id": id}}, actor,
     params}; an endpoint with a subscription (any non-null value) runs through
     invokeMetered(endpoint, actor, work) and fails with 503 "Metering adapter required" without one;
  6. success → 200 with the handler value; an HttpError → its status and {error: message};
     anything else → 500 {error: "Internal error"}.
  observe({requestId, route, status, durationMs}) runs after every request; its failure is ignored.

  SessionAuthenticator(tokens, resolve): tokens.verify(token) (JwtTokens: 401 "Invalid or expired
  session"), then resolve(claims.id); a missing actor, another id, an inactive actor or tokenVersion
  !== claims.version → 401 "Invalid or revoked session".
  SignedJwtAuthenticator(key, issuer, audience, resolve): issuer and audience must be non-empty
  (TypeError "JWT issuer and audience required"). authenticate verifies a compact JWS as jose
  jwtVerify does with algorithms [RS256, ES256] and requiredClaims [exp, iat, sub], plus iss and
  aud (string, or array containing the audience); exp <= now (seconds) is expired, nbf > now is
  refused, iat/nbf/exp must be numbers when present, a future iat is accepted; crit may only list
  b64 (b64 false is refused); RSA keys need >= 2048 bits. JWK Set key selection: kty from alg (RSA /
  EC with crv P-256), kid equal when the token has one, jwk.alg equal when present, use "sig" when
  present, key_ops containing "verify" when present, public keys only; exactly one candidate.
  Every failure → 401 "Invalid service JWT". Then resolve(payload); a missing actor, actor.id !==
  payload.sub or an inactive actor → 401 "Inactive service identity".
  remoteJwtAuthenticator(jwksUrl, …): the URL must parse (TypeError "Invalid URL") and be https:
  without credentials (TypeError "JWKS requires HTTPS"); keys are fetched from that URL only.

  remoteFeature(feature, baseUrl, transport = fetch, timeoutMs = 10000): baseUrl must parse
  ("Invalid URL") and be https: without username, password, query or fragment, and timeoutMs an
  integer from 1 to 2147483647 (TypeError "Invalid remote service configuration"). The result keeps
  the feature and every endpoint field, with migrations: [] and forwarding handlers: path = endpoint
  path with each :name (/[A-Za-z0-9_]+/) replaced by encodeURIComponent(params[name])
  ("undefined" when missing; "." or ".." → 400 "Invalid route parameter"); URL = base with pathname
  base.pathname minus one trailing "/" + path, and search = URLSearchParams(request.query) (form
  encoding: space "+", everything but *-._ and alphanumerics escaped, nothing when empty). Headers
  {content-type: application/json, authorization (only when present)}; no other header is
  forwarded. Body: JSON.stringify(request.body) except for GET and HEAD. Redirects are errors; the
  request times out after timeoutMs. A non-2xx answer → HttpError(status, "Remote service request
  failed") (the body is discarded); 204 → null; otherwise the JSON body. Transport errors propagate.

  Facades. microservice: init {features: [{id, endpoints: [{method, path, access, resource,
  explicitGrant?, subscription?, reply?}]}], tokens: {token: actor | {error: {status?, message}}}
  (unknown tokens → 401 "Unknown token"), metering: null | {} (runs the work) | {error}, observe:
  "record" | "fail" | "none"}. reply {value} returns it, {error: {status?, message}} throws
  (HttpError with status), none echoes {params, actor, headers}. Methods: handle(request) (defaults
  method GET, path /, headers {}, query {}, body {}), authentications(), observations(), metered()
  ({resource, subscription, actor id}). session-authenticator: init {secret, now, issuer?, audience?,
  actors: {id: actor}}; authenticate(token), issue(user), resolved() (ids), setNow(iso).
  signed-jwt-authenticator: init {jwks, issuer, audience, actors: {String(sub): actor}};
  authenticate(token), resolved() (payloads), remote(url, issuer, audience) → null.
  remote-feature: init {feature, baseUrl, timeoutMs?, responses: [{status, json} | {status, text} |
  {status} | {network: message}]}; call(index, {params, request}), requests() ({url, method, headers,
  body, redirect, timeout: true when a timeout applies}), feature() (without handlers).
subject: microservice
