      - { call: authenticate, args: [ { $ref: "0.value" } ], expect: { value: *actor } }
      - { call: authenticate, args: [ "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2IjoxLCJzdWIiOiJ1IiwiaXNzIjoicnQtYXBwIiwiYXVkIjoicnQtYXBwLWFwaSIsImlhdCI6MTc5MDI0NDAwMCwiZXhwIjoxNzkwMjQ0OTAwfQ.HcHF_N2LVH7do7OrLE_Nt5rB34U40XLS8kAe8Bi0NDQ" ], expect: { error: { status: 401, message: Invalid or expired session } }, note: a valid token of the default issuer and audience }

