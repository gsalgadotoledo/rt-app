  - name: issuer and audience are required
    subject: signed-jwt-authenticator
    init: { jwks: *single, issuer: "", audience: service }
    create: { error: { message: JWT issuer and audience required } }

  - name: an audience is required too
    subject: signed-jwt-authenticator
    init: { jwks: *single, issuer: issuer }
    create: { error: { message: JWT issuer and audience required } }

  - name: remote JWKS must be fetched over HTTPS without credentials
    subject: signed-jwt-authenticator
    init: { jwks: *single, issuer: issuer, audience: service }
    steps:
      - { call: remote, args: [ "https://example.test/.well-known/jwks.json", issuer, service ], expect: { value: null } }
      - { call: remote, args: [ "HTTPS://Example.TEST:8443/jwks", issuer, service ], expect: { value: null } }
      - { call: remote, args: [ "http://example.test/jwks", issuer, service ], expect: { error: { message: JWKS requires HTTPS } } }
      - { call: remote, args: [ "https://user@example.test/jwks", issuer, service ], expect: { error: { message: JWKS requires HTTPS } } }
      - { call: remote, args: [ "https://user:secret@example.test/jwks", issuer, service ], expect: { error: { message: JWKS requires HTTPS } } }
      - { call: remote, args: [ "https://:secret@example.test/jwks", issuer, service ], expect: { error: { message: JWKS requires HTTPS } } }
      - { call: remote, args: [ "file:///etc/jwks.json", issuer, service ], expect: { error: { message: JWKS requires HTTPS } } }
      - { call: remote, args: [ "not a url", issuer, service ], expect: { error: { message: Invalid URL } } }
      - { call: remote, args: [ "https://example.test/jwks", "", service ], expect: { error: { message: JWT issuer and audience required } } }
      - { call: remote, args: [ "http://example.test/jwks", "", service ], expect: { error: { message: JWKS requires HTTPS } }, note: the URL is checked first }

  # --- remote feature ---------------------------------------------------------------------------
  - name: remote endpoints forward encoded parameters and only the authorization header
    subject: remote-feature
    init:
      baseUrl: https://example.test/api
      responses: [ { status: 200, json: { ok: true } } ]
      feature: *xfeature
    steps:
      - call: call
        args: [ 0, { params: { id: a/b }, request: { method: GET, path: /x/a%2Fb, headers: { authorization: Bearer token, x-user-id: evil, cookie: s=1 }, query: {}, body: { ignored: true } } } ]
        expect: { value: { ok: true } }
      - call: requests
        expect:
          value:
            - { url: "https://example.test/api/x/a%2Fb", method: GET, headers: { content-type: application/json, authorization: Bearer token }, body: null, redirect: error, timeout: true }

  - name: parameters and query strings are encoded like JavaScript
    subject: remote-feature
    init:
      baseUrl: https://example.test/api/
      responses: [ { status: 200, json: 1 }, { status: 200, json: 2 }, { status: 200, json: 3 } ]
      feature:
        id: y
        endpoints:
          - { method: GET, path: "/y/:id/:name_2.json", resource: y.read, access: guest }
    steps:
      - { call: call, args: [ 0, { params: { id: "a b?c#d&é~!*()'", name_2: "%2e%2E" }, request: { query: { "a b": "x y~*!()'é ", z: "", "&": "=" } } } ], expect: { value: 1 } }
      - { call: call, args: [ 0, { params: { id: "1" }, request: { query: {} } } ], expect: { value: 2 } }
      - { call: call, args: [ 0, { params: { id: "...", name_2: "x." } } ], expect: { value: 3 }, note: only whole "." or ".." values are refused }
      - call: requests
        expect:
          value:
            - { url: "https://example.test/api/y/a%20b%3Fc%23d%26%C3%A9~!*()'/%252e%252E.json?a+b=x+y%7E*%21%28%29%27%C3%A9%E2%80%A8&z=&%26=%3D", method: GET, headers: { content-type: application/json }, body: null, redirect: error, timeout: true }
            - { url: "https://example.test/api/y/1/undefined.json", method: GET, headers: { content-type: application/json }, body: null, redirect: error, timeout: true }
            - { url: "https://example.test/api/y/.../x..json", method: GET, headers: { content-type: application/json }, body: null, redirect: error, timeout: true }

  - name: dot segments are refused before anything is sent
    subject: remote-feature
    init:
      baseUrl: https://example.test/api
      responses: [ { status: 200, json: 1 } ]
      feature: *xfeature
    steps:
      - { call: call, args: [ 0, { params: { id: ".." } } ], expect: { error: { status: 400, message: Invalid route parameter } } }
      - { call: call, args: [ 0, { params: { id: "." } } ], expect: { error: { status: 400, message: Invalid route parameter } } }
      - { call: requests, expect: { value: [] } }

  - name: bodies are sent as JSON except for GET and HEAD
    subject: remote-feature
    init:
      baseUrl: https://example.test
      responses: [ { status: 204 }, { status: 201, json: { id: "7" } }, { status: 200, json: [] }, { status: 200, json: null }, { status: 200, json: "text" } ]
      feature:
        id: w
        seeds: [ { id: "w:demo" } ]
        endpoints:
          - { method: POST, path: /w, resource: w.create, access: authenticated }
          - { method: PUT, path: "/w/:id", resource: w.edit, access: permission, explicitGrant: true, tool: { name: w_edit, description: Edit a w } }
          - { method: DELETE, path: "/w/:id", resource: w.delete, access: owner }
          - { method: HEAD, path: /w, resource: w.head, access: guest }
          - { method: PATCH, path: /w, resource: w.patch, access: guest }
    steps:
      - { call: call, args: [ 0, { request: { body: { b: "x</y>& ", a: [ 1, 1.5, 1e+21, true, null ] } } } ], expect: { value: null }, note: 204 answers null }
      - { call: call, args: [ 1, { params: { id: "7" }, request: { headers: { authorization: Bearer t }, body: {} } } ], expect: { value: { id: "7" } } }
      - { call: call, args: [ 2, { params: { id: "7" } } ], expect: { value: [] } }
      - { call: call, args: [ 3, {} ], expect: { value: null } }
      - { call: call, args: [ 4, { request: { body: { z: 1 } } } ], expect: { value: text } }
      - call: requests
        expect:
          value:
            - { url: "https://example.test/w", method: POST, headers: { content-type: application/json }, body: "{\"b\":\"x</y>& \",\"a\":[1,1.5,1e+21,true,null]}", redirect: error, timeout: true }
