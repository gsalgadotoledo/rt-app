  - name: remote failures become HTTP errors without their body
    subject: remote-feature
    init:
      baseUrl: https://example.test
      timeoutMs: 1
      responses: [ { status: 503, text: secret stack trace }, { status: 404, json: { error: Task not found } }, { status: 302, text: "" }, { status: 300, text: "" }, { status: 200, text: "not json" }, { network: connection reset } ]
      feature: *xfeature
    steps:
      - { call: call, args: [ 0, { params: { id: "1" } } ], expect: { error: { status: 503, message: Remote service request failed } } }
      - { call: call, args: [ 0, { params: { id: "1" } } ], expect: { error: { status: 404, message: Remote service request failed } } }
      - { call: call, args: [ 0, { params: { id: "1" } } ], expect: { error: { status: 302, message: Remote service request failed } } }
      - { call: call, args: [ 0, { params: { id: "1" } } ], expect: { error: { status: 300, message: Remote service request failed } } }
      - { call: call, args: [ 0, { params: { id: "1" } } ], expect: { error: { message: { $type: string } } }, note: an invalid JSON body fails }
      - { call: call, args: [ 0, { params: { id: "1" } } ], expect: { error: { message: connection reset } }, note: transport errors propagate }

  - name: remote configuration is validated when the feature is built
    subject: remote-feature
    init: { baseUrl: "http://example.test", feature: *xfeature }
    create: { error: { message: Invalid remote service configuration } }

  - name: remote base URLs cannot carry credentials
    subject: remote-feature
    init: { baseUrl: "https://user:pw@example.test", feature: *xfeature }
    create: { error: { message: Invalid remote service configuration } }

  - name: remote base URLs cannot carry a username
    subject: remote-feature
    init: { baseUrl: "https://user@example.test", feature: *xfeature }
    create: { error: { message: Invalid remote service configuration } }

  - name: remote base URLs cannot carry a query
    subject: remote-feature
    init: { baseUrl: "https://example.test/api?key=1", feature: *xfeature }
    create: { error: { message: Invalid remote service configuration } }

  - name: remote base URLs cannot carry a fragment
    subject: remote-feature
    init: { baseUrl: "https://example.test/api#part", feature: *xfeature }
    create: { error: { message: Invalid remote service configuration } }

  - name: remote base URLs must parse
    subject: remote-feature
    init: { baseUrl: "example.test", feature: *xfeature }
    create: { error: { message: Invalid URL } }

  - name: remote timeouts must be at least one millisecond
    subject: remote-feature
    init: { baseUrl: "https://example.test", timeoutMs: 0, feature: *xfeature }
    create: { error: { message: Invalid remote service configuration } }

  - name: remote timeouts must be whole milliseconds
    subject: remote-feature
    init: { baseUrl: "https://example.test", timeoutMs: 1.5, feature: *xfeature }
    create: { error: { message: Invalid remote service configuration } }

  - name: remote timeouts must fit a 32-bit signed timer
    subject: remote-feature
