  - name: concurrent reservations for the last credits - exactly one fits
    tags: [ concurrency ]
    steps:
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } } }
      - { call: consume, args: [ alice, api, 40, u0 ], expect: { value: { $partial: { fromAllowance: 40 } } } }
      - call: race
        args: [ [ { call: reserve, args: [ alice, api, { key: "turn-a:0", credits: 60 } ] }, { call: reserve, args: [ alice, api, { key: "turn-b:0", credits: 60 } ] } ] ]
        expect: { value: { fulfilled: 1, rejected: [ { status: 429, message: "Not enough credits: 60 missing. Add credits or wait for the reset." } ] } }
      - { call: usageSummary, args: [ alice ], expect: { value: { $partial: { products: [ { $partial: { reserved: 60, available: 0 } } ], reservations: { $length: 1 } } } } }
      - { call: recordCredits, args: [ alice, { requestId: pi_1, productId: api, credits: 90, reason: Top-up } ], expect: { value: { $partial: { available: 90 } } } }
      - call: race
        args: [ [ { $repeat: { count: 4, start: 1, item: { call: reserve, args: [ alice, api, { key: "turn-c:{i}", credits: 30 } ] } } } ] ]
        expect: { value: { fulfilled: 3, rejected: [ { status: 429, message: "Not enough credits: 30 missing. Add credits or wait for the reset." } ] } }
      - call: race
        args: [ [ { call: consume, args: [ alice, api, 1, u1 ] }, { call: reserve, args: [ alice, api, { key: "turn-d:0", credits: 1 } ] } ] ]
        expect: { value: { fulfilled: 0, rejected: [ { status: 429, message: "Not enough credits: 1 missing. Add credits or wait for the reset." }, { status: 429, message: Subscription period limit reached. Add credits or wait for the reset. } ] } }
      - { call: usageSummary, args: [ alice ], expect: { value: { $partial: { products: [ { $partial: { reserved: 150, available: 0 } } ], reservations: { $length: 4 } } } } }
      - { call: recordCredits, args: [ alice, { requestId: pi_2, productId: api, credits: 30, reason: Top-up } ], expect: { value: { $partial: { available: 30 } } } }
      - { call: reserve, args: [ alice, api, { key: "turn-e:0", credits: 20 } ], expect: { value: { $partial: { available: 10 } } } }
      - call: race
        args: [ [ { call: settle, args: [ alice, "turn-e:0", { credits: 10 } ] }, { call: settle, args: [ alice, "turn-e:0", { credits: 10 } ] }, { call: settle, args: [ alice, "turn-e:0", { credits: 10 } ] } ] ]
        expect: { value: { fulfilled: 3, rejected: [] } }
        note: "one settlement, two replays"
      - { call: reserve, args: [ alice, api, { key: "turn-f:0", credits: 20 } ], expect: { value: { $partial: { available: 0 } } } }
      - call: race
        args: [ [ { call: settle, args: [ alice, "turn-f:0", { credits: 5 } ] }, { call: release, args: [ alice, "turn-f:0" ] } ] ]
        expect: { value: { fulfilled: 1, rejected: [ { $oneOf: [ { status: 409, message: Reservation was released }, { status: 409, message: Reservation already settled } ] } ] } }
      - { call: list, args: [ "SUB_LEDGER#alice" ], expect: { value: { items: { $length: 13 } } }, note: "allowance, plan, usage, 1 + 3 reservations, purchase, purchase, reservation, settlement, reservation, settlement or release" }
      - { call: ledgerCheck, args: [ alice ], expect: { value: { $partial: { balanced: true, negative: false, reserved: 150, held: 150 } } } }

