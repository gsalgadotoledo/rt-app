contract: 1
module: subscriptions-reservations
subject: subscriptions
title: Subscriptions service - credit reservations, settlement, pre-flight checks and thresholds
description: |
  Reserve-and-settle through the `subscriptions` facade (init and helpers: subscriptions-settings;
  allowance, windows and the statement: subscriptions-usage). Design notes:
  docs/polyglot/subscriptions-reservations.md.

  Holds. A reservation holds credits of one product until it is settled, released or expires. The
  account row keeps the holds in `reservations`, an array in creation order of {key, productId,
  credits, at, expiresAt}; a hold counts while now < expiresAt. held(product) = sum of the credits
  of the counting holds. spendable = max(0, allowanceLeft + creditBalance - held); free(product) =
  {allowance: min(allowanceLeft, spendable), balance: spendable - that}: a charge takes the plan
  allowance first while every other hold stays covered, so holds never push it onto additional
  credits. available(product) = free.allowance + free.balance everywhere (me().usage
  remaining, ledger balances, entry `available`, recordCredits, estimate previews, listUsers);
  allowanceLeft and additional credits stay raw. consume charges fromAllowance = min(credits,
  free.allowance) and fails with its 429 when credits - fromAllowance > free.balance.

  sweep(data, skip?): every hold with now >= expiresAt leaves `reservations`, in array order; its
  receipt (unless its key is `skip`, and only while "active") becomes {...receipt, status:
  "expired", releasedAt: expiresAt}; a ledger entry {at: expiresAt, kind: "release", source:
  "system", credits: 0, productId, reason: "Reservation expired · " + (receipt.reason ?? key),
  requestId: key, held: -credits} with seed "expire:<key>". reserve, settle and release run
  settle-windows, then sweep, then their own entry; maintenance sweeps each account after its
  window rollover (accounts without an own plan are visited only when they have expired holds).

  reserve(userId, productId, input, meta?), in order: key =~ ^[A-Za-z0-9_.:-]{1,128}$ (400 "Invalid
  reservation key"); id(productId); exactly one of input.credits / input.estimate (null counts as
  missing; an estimate that is not an object counts as neither: 400 "Give credits or an
  estimate"); credits: integer(credits, 1) (400 "Invalid numeric setting"); estimate: the
  estimate() pricing of {rateId, inputTokens, outputTokens: maxOutputTokens ?? 0} (404 "Credit
  rate not found", 400 "Invalid numeric setting"); ttlMs ?? 900000, a safe integer in
  [1000, 86400000] (400 "Invalid reservation TTL"); reason, when given, String() trimmed 1..300
  (400 "A short reason is required"). Then inside a retry on Conflict: a receipt
  SUB_RESERVATION#<user>/<key> with the same productId and credits replays (view below with
  replayed: true), else 409 "Reservation key already used with different amounts"; the charge
  checks of consume (402 "Subscription is inactive or expired", 402 "A paid subscription is
  required", 403 "Product is not included in your plan"); settle-windows; sweep; 25 holds left
  -> 429 "Too many active reservations"; credits > available -> 429 "Not enough credits: <credits
  - available> missing. Add credits or wait for the reset."; hold {key, productId, credits, at:
  now, expiresAt: now + ttlMs} appended; text = reason ?? "<rate name> request" (estimate) ??
  "<product name> usage"; entry {at, kind: "reservation", source: meta.source ?? "api", credits: 0,
  productId, reason: "Reserved · " + text, requestId: key, held: credits, expiresAt, actorId?}
  seed "reserve:<key>"; receipt {...hold, status: "active", available (after the hold), reason:
  text, source, actorId?, estimate?: {rateId, inputTokens, maxOutputTokens}}. View: {key,
  productId, credits, status ("expired" for an active receipt with now >= expiresAt), at,
  expiresAt, available, replayed}.

  settle(userId, key, usage, meta?): key as above; usage {credits} (integer 0..1e9) when
  credits is given, else {inputTokens, outputTokens ?? 0} (integers 0..1e10) when inputTokens is
  given, else 400 "Give credits or token usage"; bad integers 400 "Invalid numeric setting".
  Retry on Conflict: no receipt, or meta.source "user" and a receipt of another source -> 404
  "Reservation not found"; settled: same usage (credits, inputTokens, outputTokens) replays the
  stored settlement with replayed: true, else 409 "Reservation already settled with different
  usage"; released -> 409 "Reservation was released"; token usage without a stored estimate ->
  400 "Settle this reservation with credits"; used = usage.credits or the estimate() credits of
  the stored rateId and the reported tokens. Account: settle-windows; sweep (skip = key); the own
  hold (if still counting) leaves `reservations`; free = free(product) without it; fromAllowance
  = min(used, free.allowance), fromBalance = min(used - fromAllowance, free.balance), charged =
  their sum, uncovered = used - charged (never charged: balances never go negative); the
  effective entitlement's counters grow by fromAllowance (only when > 0); creditBalance[product]
  = raw balance - fromBalance (always written); totalConsumed += charged; entry {at, kind:
  "settlement", source: meta.source ?? "api", credits: -charged (0, not -0), productId, reason:
  receipt.reason, requestId: key, fromAllowance, fromBalance, held: -hold credits (0 when the hold
  had expired), details: {rateId?, inputTokens?, outputTokens? (token usage), reserved, used,
  uncovered}, actorId?} seed "settle:<key>"; settlement {key, productId, reserved, used, credits:
  charged, fromAllowance, fromBalance, uncovered, expired: no counting hold, status: "settled",
  at, available, valueMinor: Math.round(charged * pack.amountMinor / pack.credits), currency:
  pack.currency, usage}, stored on the receipt {...receipt, status: "settled", settlement};
  returns {...settlement, replayed: false}.

  release(userId, key, meta?): key as above; retry on Conflict: 404 as in settle; settled -> 409
  "Reservation already settled"; released or expired -> view with replayed: true; else
  settle-windows, sweep (skip = key); a counting hold leaves `reservations` with an entry {at,
  kind: "release", source: meta.source ?? "api", credits: 0, productId, reason: "Released · " +
  receipt.reason, requestId: key, held: -credits, actorId?} seed "release:<key>" and the receipt
  becomes status "released", releasedAt now; without one (it expired) the receipt becomes
  "expired", releasedAt expiresAt. View {key, productId, credits, status, releasedAt, replayed}.

  Windows of a product (the effective, active entitlement having it and its counters; else []):
  reserved = min(held, allowanceLeft); for day (counters.day, dailyLimit, dayStart + daySeconds
  s), week (week, weeklyLimit, weekStart + weekSeconds s) and period (period, credits,
  periodEnd): {kind, used, reserved, limit, remaining: max(0, limit - used - reserved), percent:
  floor((used + reserved) * 100 / limit) (100 when limit is 0), threshold: 100, 95, 80 or 0 (the
  highest reached), resetAt}.

  preflight(userId, productId, input): id(productId); the amount as in reserve; blocked = the
  first failing charge check as "inactive", "payment" or "product" (null when chargeable);
  available = 0 when blocked, else available(product); missing = max(0, credits - available);
  fits = not blocked and missing 0 -> {productId, credits, fits, reason: null when it fits, else
  blocked ?? "credits", available, missing, allowanceLeft (raw), additionalCredits (raw),
  reserved: held, windows, topUp: when not blocked and missing > 0 {credits: missing, packs:
  ceil(missing / pack.credits), amountMinor: packs * pack.amountMinor, valueMinor:
  Math.round(missing * pack.amountMinor / pack.credits), currency}, else null}. Never writes.

  usageSummary(userId) -> {userId, active (not blocked, no product), products: for the effective
  plan's products then other creditBalance keys {productId, name (plan product name or null),
  allowanceLeft, additionalCredits, reserved, available, threshold (max over windows, 0 without
  windows), windows}, reservations: counting holds {key, productId, credits, at, expiresAt},
  alerts: every window with threshold >= 80 {productId, window, percent, threshold}, pack:
  settings credit pack}. Never writes.

  Facade helpers: failWrites(count, mode) makes the next `count` store transactions fail with 503
  "Injected store failure", "before" (nothing written) or "after" (written, reply lost);
  race([{call, args}]) runs the calls at once and batch([{call, args}]) one after the other ->
  {fulfilled, rejected: [{status, message}] sorted by message}; ledgerCheck(userId) -> {entries, credits (sum), held (sum), reserved (sum of the
  account holds), allowance (sum over ledgerWindows products of allowance - used(start)),
  additional (sum of creditBalance), balanced (credits == allowance + additional and held ==
  reserved), negative (an entry's available or a balance below 0)}.
fixtures:
  alice: &alice { id: alice, email: alice@example.test, role: user }
  root: &root { id: rt-app-root, role: owner }
  check: &check { $partial: { balanced: true, negative: false } }
cases:
  - name: reservations are validated in order
    tags: [ validation ]
    steps:
      - { call: reserve, args: [ alice, api, { key: "bad key", credits: 1 } ], expect: { error: { status: 400, message: Invalid reservation key } } }
      - { call: reserve, args: [ alice, api, { key: { $text: { repeat: k, count: 129 } }, credits: 1 } ], expect: { error: { status: 400, message: Invalid reservation key } } }
      - { call: reserve, args: [ alice, api, { credits: 1 } ], expect: { error: { status: 400, message: Invalid reservation key } } }
      - { call: reserve, args: [ alice, "bad id", { key: "t1:0", credits: 1 } ], expect: { error: { status: 400, message: Invalid identifier } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0" } ], expect: { error: { status: 400, message: Give credits or an estimate } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: 5, estimate: { rateId: standard, inputTokens: 1 } } ], expect: { error: { status: 400, message: Give credits or an estimate } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", estimate: 5 } ], expect: { error: { status: 400, message: Give credits or an estimate } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: 0 } ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: 1.5 } ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: "5" } ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", estimate: { rateId: nope, inputTokens: 1 } } ], expect: { error: { status: 404, message: Credit rate not found } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", estimate: { rateId: standard, inputTokens: -1 } } ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", estimate: { rateId: standard, inputTokens: 1, maxOutputTokens: 1.5 } } ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: 5, ttlMs: 999 } ], expect: { error: { status: 400, message: Invalid reservation TTL } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: 5, ttlMs: 86400001 } ], expect: { error: { status: 400, message: Invalid reservation TTL } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: 5, ttlMs: 1000.5 } ], expect: { error: { status: 400, message: Invalid reservation TTL } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: 5, reason: "   " } ], expect: { error: { status: 400, message: A short reason is required } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: 5, reason: { $text: { repeat: r, count: 301 } } } ], expect: { error: { status: 400, message: A short reason is required } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: 5 } ], expect: { error: { status: 402, message: Subscription is inactive or expired } } }
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } } }
      - { call: reserve, args: [ alice, gpu, { key: "t1:0", credits: 5 } ], expect: { error: { status: 403, message: Product is not included in your plan } } }
      - { call: reserve, args: [ alice, api, { key: "t1:0", credits: 101 } ], expect: { error: { status: 429, message: "Not enough credits: 1 missing. Add credits or wait for the reset." } } }
      - { call: settle, args: [ alice, "bad key", { credits: 1 } ], expect: { error: { status: 400, message: Invalid reservation key } } }
      - { call: settle, args: [ alice, "t1:0", {} ], expect: { error: { status: 400, message: Give credits or token usage } } }
      - { call: settle, args: [ alice, "t1:0", { outputTokens: 5 } ], expect: { error: { status: 400, message: Give credits or token usage } } }
      - { call: settle, args: [ alice, "t1:0", { credits: -1 } ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: settle, args: [ alice, "t1:0", { inputTokens: 1, outputTokens: -1 } ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: settle, args: [ alice, "t1:0", { credits: 1 } ], expect: { error: { status: 404, message: Reservation not found } } }
      - { call: release, args: [ alice, "bad key" ], expect: { error: { status: 400, message: Invalid reservation key } } }
      - { call: release, args: [ alice, "t1:0" ], expect: { error: { status: 404, message: Reservation not found } } }
      - { call: preflight, args: [ alice, "bad id", { credits: 1 } ], expect: { error: { status: 400, message: Invalid identifier } } }
      - { call: preflight, args: [ alice, api, {} ], expect: { error: { status: 400, message: Give credits or an estimate } } }
      - { call: preflight, args: [ alice, api, { estimate: { rateId: nope, inputTokens: 1 } } ], expect: { error: { status: 404, message: Credit rate not found } } }
      - { call: list, args: [ "SUB_LEDGER#alice" ], note: "nothing written by the failures", expect: { value: { items: [ { pk: SUB_LEDGER#alice, sk: 001767225600000-0000000001-807d3bf3798545ed, version: 1, data: { at: 1767225600000, kind: allowance, credits: 500, productId: api, reason: "API credits: weekly allowance", source: system, available: 100, id: 001767225600000-0000000001-807d3bf3798545ed } }, { pk: SUB_LEDGER#alice, sk: 001767225600000-0000000002-9e031019253ed56a, version: 1, data: { at: 1767225600000, kind: plan, source: user, credits: 0, planId: starter, reason: "Plan started: Starter", requestId: plan-1, id: 001767225600000-0000000002-9e031019253ed56a } } ] } } }
      - { call: ledgerCheck, args: [ alice ], expect: { value: *check } }

  - name: reserve the maximum, settle the real usage and release the difference
    steps:
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } } }
      - { call: reserve, args: [ alice, api, { key: "turn-1:0", estimate: { rateId: standard, inputTokens: 12000, maxOutputTokens: 8000 } } ], note: "12 + 24 = 36 credits held", expect: { value: { key: turn-1:0, productId: api, credits: 36, status: active, at: 1767225600000, expiresAt: 1767226500000, available: 64, replayed: false } } }
      - { call: usageSummary, args: [ alice ], expect: { value: { userId: alice, active: true, products: [ { productId: api, name: API credits, allowanceLeft: 100, additionalCredits: 0, reserved: 36, available: 64, threshold: 0, windows: [ { kind: day, used: 0, reserved: 36, limit: 100, remaining: 64, percent: 36, threshold: 0, resetAt: 1767312000000 }, { kind: week, used: 0, reserved: 36, limit: 500, remaining: 464, percent: 7, threshold: 0, resetAt: 1767830400000 }, { kind: period, used: 0, reserved: 36, limit: 1000, remaining: 964, percent: 3, threshold: 0, resetAt: 1769817600000 } ] } ], reservations: [ { key: turn-1:0, productId: api, credits: 36, at: 1767225600000, expiresAt: 1767226500000 } ], alerts: [], pack: { credits: 1000, amountMinor: 1000, currency: usd } } } }
      - { call: consume, args: [ alice, api, 65, u1 ], expect: { error: { status: 429, message: Subscription period limit reached. Add credits or wait for the reset. } }, note: "64 are free: the hold is not spendable" }
      - { call: consume, args: [ alice, api, 64, u1 ], expect: { value: { requestId: u1, productId: api, credits: 64, fromAllowance: 64, fromBalance: 0, at: 1767225600000, replayed: false } } }
      - { call: settle, args: [ alice, "turn-1:0", { inputTokens: 12000, outputTokens: 2000 } ], note: "12 + 6 = 18 charged; the other 18 return", expect: { value: { key: turn-1:0, productId: api, reserved: 36, used: 18, credits: 18, fromAllowance: 18, fromBalance: 0, uncovered: 0, expired: false, status: settled, at: 1767225600000, available: 18, valueMinor: 18, currency: usd, usage: { inputTokens: 12000, outputTokens: 2000 }, replayed: false } } }
      - { call: settle, args: [ alice, "turn-1:0", { inputTokens: 12000, outputTokens: 2000 } ], note: replayed, expect: { value: { key: turn-1:0, productId: api, reserved: 36, used: 18, credits: 18, fromAllowance: 18, fromBalance: 0, uncovered: 0, expired: false, status: settled, at: 1767225600000, available: 18, valueMinor: 18, currency: usd, usage: { inputTokens: 12000, outputTokens: 2000 }, replayed: true } } }
      - { call: settle, args: [ alice, "turn-1:0", { inputTokens: 12000, outputTokens: 2001 } ], expect: { error: { status: 409, message: Reservation already settled with different usage } } }
      - { call: settle, args: [ alice, "turn-1:0", { credits: 18 } ], expect: { error: { status: 409, message: Reservation already settled with different usage } } }
      - { call: release, args: [ alice, "turn-1:0" ], expect: { error: { status: 409, message: Reservation already settled } } }
      - { call: reserve, args: [ alice, api, { key: "turn-1:0", estimate: { rateId: standard, inputTokens: 12000, maxOutputTokens: 8000 } } ], note: "a retried reserve replays the settled reservation", expect: { value: { key: turn-1:0, productId: api, credits: 36, status: settled, at: 1767225600000, expiresAt: 1767226500000, available: 64, replayed: true } } }
      - { call: reserve, args: [ alice, api, { key: "turn-1:0", credits: 35 } ], expect: { error: { status: 409, message: Reservation key already used with different amounts } } }
      - { call: row, args: [ "SUB_RESERVATION#alice", "turn-1:0" ], expect: { value: { pk: SUB_RESERVATION#alice, sk: turn-1:0, version: 2, data: { key: turn-1:0, productId: api, credits: 36, at: 1767225600000, expiresAt: 1767226500000, status: settled, available: 64, reason: Standard model request, source: api, estimate: { rateId: standard, inputTokens: 12000, maxOutputTokens: 8000 }, settlement: { key: turn-1:0, productId: api, reserved: 36, used: 18, credits: 18, fromAllowance: 18, fromBalance: 0, uncovered: 0, expired: false, status: settled, at: 1767225600000, available: 18, valueMinor: 18, currency: usd, usage: { inputTokens: 12000, outputTokens: 2000 } } } } } }
      - { call: ledger, args: [ alice ], expect: { value: { entries: [ { at: 1767225600000, kind: allowance, credits: 500, productId: api, reason: "API credits: weekly allowance", source: system, available: 100, id: 001767225600000-0000000001-807d3bf3798545ed }, { at: 1767225600000, kind: plan, source: user, credits: 0, planId: starter, reason: "Plan started: Starter", requestId: plan-1, id: 001767225600000-0000000002-9e031019253ed56a }, { at: 1767225600000, kind: reservation, source: api, credits: 0, productId: api, reason: Reserved · Standard model request, requestId: turn-1:0, held: 36, expiresAt: 1767226500000, available: 64, id: 001767225600000-0000000003-61074debfc647437 }, { at: 1767225600000, kind: usage, source: api, credits: -64, productId: api, reason: API credits usage, requestId: u1, fromAllowance: 64, fromBalance: 0, available: 0, id: 001767225600000-0000000004-e7f12c038a04de0f }, { at: 1767225600000, kind: settlement, source: api, credits: -18, productId: api, reason: Standard model request, requestId: turn-1:0, fromAllowance: 18, fromBalance: 0, held: -36, details: { rateId: standard, inputTokens: 12000, outputTokens: 2000, reserved: 36, used: 18, uncovered: 0 }, available: 18, id: 001767225600000-0000000005-0a7ab033e8280647 } ], pending: [], totals: { creditsIn: 500, creditsOut: 82, expired: 0, paidMinor: {}, grantedValueMinor: {}, consumed: 82 }, balances: [ { productId: api, allowanceLeft: 18, additionalCredits: 0, available: 18 } ] } } }
      - { call: me, args: [ alice ], expect: { value: { userId: alice, email: alice@example.test, plan: { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, status: active, mode: none, cancelAtPeriodEnd: false, periodStart: 1767225600000, periodEnd: 1769817600000, counters: { api: { period: 82, day: 82, week: 82, dayStart: 1767225600000, weekStart: 1767225600000 } }, createdAt: 1767225600000, updatedAt: 1767225600000, ledgerWindows: { key: own:starter, products: { api: { start: 1767225600000, allowance: 500, name: API credits, weekSeconds: 604800 } } }, ledgerSequence: 5, ledgerTotals: { creditsIn: 500, creditsOut: 82, expired: 0, paidMinor: {}, grantedValueMinor: {} }, reservations: [], creditBalance: { api: 0 }, totalConsumed: 82, assignedByAdmin: false, active: true, version: 4, paymentRequired: false, provider: none, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }, { id: max, family: max, version: 0.0.1, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ], usage: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800, used: 82, remaining: 18, allowanceLeft: 18, extraCredits: 0, dayUsed: 82, weekUsed: 82, dayResetAt: 1767312000000, weekResetAt: 1767830400000 } ] } } }
      - { call: ledgerCheck, args: [ alice ], expect: { value: *check } }

  - name: release returns the hold and is idempotent
    steps:
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } } }
      - { call: reserve, args: [ alice, api, { key: r1, credits: 30, reason: " Report batch ", ttlMs: 60000 } ], expect: { value: { key: r1, productId: api, credits: 30, status: active, at: 1767225600000, expiresAt: 1767225660000, available: 70, replayed: false } } }
      - { call: reserve, args: [ alice, api, { key: r1, credits: 30 } ], note: replayed, expect: { value: { key: r1, productId: api, credits: 30, status: active, at: 1767225600000, expiresAt: 1767225660000, available: 70, replayed: true } } }
      - { call: release, args: [ alice, r1 ], expect: { value: { key: r1, productId: api, credits: 30, status: released, releasedAt: 1767225600000, replayed: false } } }
      - { call: release, args: [ alice, r1 ], note: replayed, expect: { value: { key: r1, productId: api, credits: 30, status: released, releasedAt: 1767225600000, replayed: true } } }
      - { call: settle, args: [ alice, r1, { credits: 1 } ], expect: { error: { status: 409, message: Reservation was released } } }
      - { call: settle, args: [ alice, r1, { inputTokens: 1 } ], expect: { error: { status: 409, message: Reservation was released } } }
      - { call: reserve, args: [ alice, api, { key: r1, credits: 30 } ], note: "replayed, status released", expect: { value: { key: r1, productId: api, credits: 30, status: released, at: 1767225600000, expiresAt: 1767225660000, available: 70, replayed: true } } }
      - { call: reserve, args: [ alice, api, { key: r2, credits: 5 } ], expect: { value: { key: r2, productId: api, credits: 5, status: active, at: 1767225600000, expiresAt: 1767226500000, available: 95, replayed: false } } }
      - { call: settle, args: [ alice, r2, { inputTokens: 100 } ], expect: { error: { status: 400, message: Settle this reservation with credits } } }
