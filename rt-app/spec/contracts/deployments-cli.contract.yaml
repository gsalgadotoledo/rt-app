  - name: repeated flags keep the last value and extra positionals are ignored
    tags: [cli]
    init: { providers: [*render, *neon], settings: *settings, env: *env }
    steps:
      - { call: deployCommand, args: [[plan, --env, qa, --env, prod, extra]], expect: { value: ["Nothing to plan for prod (no provider roles, or AWS only)."] } }
      - { call: deployCommand, args: [[providers, --json, --json, --env, stage]], expect: { value: { $length: 1 } } }

  - name: github connect reuses or creates the repository
    tags: [cli, github]
    steps:
      - { call: githubCommand, args: [[connect]], expect: { value: ["Already connected to acme/shop"] } }
      - { call: setOrigin, args: [""], expect: { value: null } }
      - { call: githubCommand, args: [[connect, --public, --name, acme/new-shop]], expect: { value: ["Created and pushed acme/new-shop"] } }
      - { call: runs, expect: { value: { $length: 5 } } }
      - call: runs
        expect: { value: [{ $any: true }, { $any: true }, { $any: true }, { command: gh, args: [repo, create, acme/new-shop, --public, --source, ., --push], input: null, cwd: "." }, { $any: true }] }

  - name: github sync pushes local keys and runtime secrets from the environment
    tags: [cli, github, secrets]
    init: { credentials: { stage: { RENDER_API_KEY: rnd_local } }, env: { JWT_SECRET: jwt-from-env, SMTP_URL: "", RENDER_API_KEY: not-a-runtime-secret } }
    steps:
      - { call: githubCommand, args: [[sync, --env, stage]], expect: { value: ["GitHub acme/shop:", "  stage: JWT_SECRET, RENDER_API_KEY"] } }
      - { call: githubCommand, args: [[sync]], expect: { value: ["GitHub acme/shop:", "  develop: JWT_SECRET", "  stage: JWT_SECRET, RENDER_API_KEY", "  prod: JWT_SECRET"] } }
      - { call: githubCommand, args: [[sync, --json, --env, stage]], expect: { value: ["{\n  \"repository\": \"acme/shop\",\n  \"secrets\": {\n    \"stage\": [\n      \"JWT_SECRET\",\n      \"RENDER_API_KEY\"\n    ]\n  }\n}"] } }

  - name: github sync with nothing to push and its errors
    tags: [cli, github, errors]
    init: { origin: "" }
    steps:
      - { call: githubCommand, args: [[sync]], expect: { error: { message: "No GitHub origin. Run: rta github connect" } } }
      - { call: setOrigin, args: ["git@github.com:acme/shop.git"], expect: { value: null } }
      - { call: githubCommand, args: [[sync, --env, prod]], expect: { value: ["GitHub acme/shop:", "  prod: environment ready, no secrets yet"] } }

  - name: github usage errors
    tags: [cli, github, errors]
    steps:
      - { call: githubCommand, args: [[]], expect: { error: { message: "Usage:\n  rta github connect [--public] [--name owner/repo]   create the repo and push\n  rta github sync [--env stage]                       environments + secrets (local keys and runtime secrets)" } } }
      - { call: githubCommand, args: [[publish]], expect: { error: { message: "Usage:\n  rta github connect [--public] [--name owner/repo]   create the repo and push\n  rta github sync [--env stage]                       environments + secrets (local keys and runtime secrets)" } } }
      - { call: githubCommand, args: [[sync, --env, qa]], expect: { error: { message: "Usage:\n  rta github connect [--public] [--name owner/repo]   create the repo and push\n  rta github sync [--env stage]                       environments + secrets (local keys and runtime secrets)" } } }
      - { call: githubCommand, args: [[connect, --private]], expect: { error: { message: "Usage:\n  rta github connect [--public] [--name owner/repo]   create the repo and push\n  rta github sync [--env stage]                       environments + secrets (local keys and runtime secrets)" } } }
      - { call: githubCommand, args: [[connect, --name]], expect: { error: { message: "Usage:\n  rta github connect [--public] [--name owner/repo]   create the repo and push\n  rta github sync [--env stage]                       environments + secrets (local keys and runtime secrets)" } } }
      - { call: githubCommand, args: [[sync, --role, api]], expect: { error: { message: "Usage:\n  rta github connect [--public] [--name owner/repo]   create the repo and push\n  rta github sync [--env stage]                       environments + secrets (local keys and runtime secrets)" } } }
      - { call: runs, expect: { value: [] } }

  - name: CI secrets become environment variables and explicit variables win
    tags: [ci]
    steps:
      - { call: withCiSecrets, args: [{ A: "1" }], expect: { value: { A: "1" } } }
      - { call: withCiSecrets, args: [{ A: "1", RT_APP_SECRETS_JSON: "" }], expect: { value: { A: "1", RT_APP_SECRETS_JSON: "" } } }
      - call: withCiSecrets
        args: [{ RT_APP_SECRETS_JSON: "{\"RENDER_KEY\":\"r\",\"A\":\"from-json\",\"github_token\":\"gh\",\"NUM\":5,\"NUL\":null,\"OBJ\":{},\"EMPTY\":\"\"}", A: explicit }]
        expect: { value: { RENDER_KEY: r, A: explicit, EMPTY: "", RT_APP_SECRETS_JSON: null } }
      - { call: withCiSecrets, args: [{ RT_APP_SECRETS_JSON: "[\"x\",1]" }], expect: { value: { "0": x } } }
      - { call: withCiSecrets, args: [{ RT_APP_SECRETS_JSON: "\"ab\"" }], expect: { value: { "0": a, "1": b } } }
      - { call: withCiSecrets, args: [{ RT_APP_SECRETS_JSON: "5" }], expect: { value: {} } }
      - { call: withCiSecrets, args: [{ RT_APP_SECRETS_JSON: "{" }], expect: { error: { message: RT_APP_SECRETS_JSON is not valid JSON } } }
      - { call: withCiSecrets, args: [{ RT_APP_SECRETS_JSON: "null" }], expect: { error: { message: { $type: string } } } }
