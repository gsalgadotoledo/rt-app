contract: 1
kind: http
module: subscriptions-api
title: Subscriptions HTTP API (local mode)
description: |
  The subscriptions module as every backend serves it in local mode (in-memory store, local
  billing simulator, no session authenticator). Cases run in order against one server and share
  its state; ids are unique to this contract (api-sub-*, http-plan).

  - Personal endpoints (/subscriptions/me, billing, change, payment/setup, payment/save, cancel,
    sync, preferences) need a signed-in actor: 401 "Sign in". They are not mounted under
    /admin/app (404). The reference API seeds no demo account and the Python/Go example APIs
    have no login, so signed-in flows are pinned by the module contracts (call() in
    subscriptions-accounts), not here.
  - /subscriptions/webhook is a guest endpoint; the local billing simulator rejects every
    webhook: 400 "Invalid webhook signature".
  - Owner endpoints under /subscriptions/admin/* are admin-only: served only under /admin/app,
    where the local owner "rt-app-root" runs them (404 at the plain path).
  - Times come from the server clock, so `at` values and ledger ids are matched by type.

  Not pinned: catalogAvailable (the TypeScript framework always wires the Stripe catalog; the
  ports have no Stripe catalog yet), plan publication (it calls Stripe), and the 256 KiB body
  limit of the webhook (the Go web layer has one body limit for every endpoint).
fixtures:
  starter: &starter { id: starter, family: starter, description: "", metadata: {}, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }
  pro: &pro { id: pro, family: pro, description: "", metadata: {}, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }
  max: &max { id: max, family: max, description: For growing teams with higher usage, metadata: {}, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }
  httpProducts: &httpProducts [ { id: api, name: API credits, credits: 100, dailyLimit: 10, weeklyLimit: 50, daySeconds: 86400, weekSeconds: 604800 } ]
  owner: &owner { id: rt-app-root, role: owner }
cases:
  - name: personal endpoints need a signed-in actor
    tags: [ security ]
    requests:
      - { request: { method: GET, path: /subscriptions/me }, expect: { status: 401, body: { error: Sign in } } }
      - { request: { method: GET, path: /subscriptions/billing }, expect: { status: 401, body: { error: Sign in } } }
      - { request: { method: POST, path: /subscriptions/change, body: { planId: starter, requestId: c1 } }, expect: { status: 401, body: { error: Sign in } } }
      - { request: { method: POST, path: /subscriptions/payment/setup, body: { requestId: s1 } }, expect: { status: 401, body: { error: Sign in } } }
      - { request: { method: POST, path: /subscriptions/payment/save, body: { setupId: seti_1 } }, expect: { status: 401, body: { error: Sign in } } }
      - { request: { method: POST, path: /subscriptions/cancel, body: { requestId: x1 } }, expect: { status: 401, body: { error: Sign in } } }
      - { request: { method: POST, path: /subscriptions/sync }, expect: { status: 401, body: { error: Sign in } } }
      - { request: { method: PUT, path: /subscriptions/preferences, body: { notifications: false } }, expect: { status: 401, body: { error: Sign in } } }

  - name: admin endpoints are served only under /admin/app
    tags: [ security ]
    requests:
      - { request: { method: GET, path: /subscriptions/admin/settings }, expect: { status: 404, body: { error: Endpoint not found } } }
      - { request: { method: PUT, path: /subscriptions/admin/settings, body: {} }, expect: { status: 404, body: { error: Endpoint not found } } }
      - { request: { method: POST, path: /subscriptions/admin/maintenance }, expect: { status: 404, body: { error: Endpoint not found } } }
      - { request: { method: GET, path: /subscriptions/admin/accounts/api-sub-alice/ledger }, expect: { status: 404, body: { error: Endpoint not found } } }
      - { request: { method: GET, path: /admin/app/subscriptions/me }, expect: { status: 404, body: { error: Endpoint not found } } }
      - { request: { method: POST, path: /admin/app/subscriptions/webhook, raw: "{}" }, expect: { status: 404, body: { error: Endpoint not found } } }
      - { request: { method: POST, path: /admin/app/subscriptions/admin/plans/actions/delete, body: {} }, expect: { status: 404, body: { error: Endpoint not found } } }

  - name: the local billing simulator rejects webhooks
    requests:
      - { request: { method: POST, path: /subscriptions/webhook, raw: "{}" }, expect: { status: 400, body: { error: Invalid webhook signature }, headers: { cache-control: no-store } } }
      - { request: { method: POST, path: /subscriptions/webhook, headers: { stripe-signature: "t=1,v1=abc" }, body: { id: evt_1, type: invoice.paid } }, expect: { status: 400, body: { error: Invalid webhook signature } } }
      - { request: { method: POST, path: /subscriptions/webhook, headers: { content-type: application/json }, raw: "not json" }, expect: { status: 400, body: { error: Invalid JSON } } }

  - name: settings and the plan catalog
    requests:
      - request: { method: GET, path: /admin/app/subscriptions/admin/settings }
        expect:
          status: 200
          headers: { cache-control: no-store }
          body:
            version: 0
            provider: local
            catalogAvailable: { $type: boolean }
            values:
              paymentRequired: false
              notifications: true
              reminderDays: 3
              credits: { pack: { credits: 1000, amountMinor: 1000, currency: usd }, rates: [ { id: standard, name: Standard model, inputPer1k: 1, outputPer1k: 3, minimum: 1 }, { id: advanced, name: Advanced model, inputPer1k: 5, outputPer1k: 15, minimum: 1 } ] }
              plans:
                - { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }
                - { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], version: 0.0.1 }
                - { id: max, family: max, version: 0.0.1, name: Max, description: For growing teams with higher usage, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] }
      - request: { method: PUT, path: /admin/app/subscriptions/admin/settings, body: { version: { $ref: "0.body.version" }, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ { id: starter } ] } } }
        expect: { status: 400, body: { error: Invalid numeric setting } }
      - request: { method: PUT, path: /admin/app/subscriptions/admin/settings, body: { version: 7, values: { $ref: "0.body.values" } } }
        expect: { status: 409, body: { error: "Conflict: refresh and try again" } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/plans/actions/create, body: { version: { $ref: "0.body.version" }, plan: { name: HTTP Plan, amount: 700, currency: usd, periodDays: 30, enabled: true, products: *httpProducts } } }
        expect:
          status: 200
          body:
            version: 1
            provider: local
            catalogAvailable: { $type: boolean }
            values:
              paymentRequired: false
              notifications: true
              reminderDays: 3
              credits: { $type: object }
              plans: [ *starter, *pro, *max, { id: http-plan, family: http-plan, description: "", metadata: {}, name: HTTP Plan, amount: 700, currency: usd, periodDays: 30, enabled: false, archived: false, products: *httpProducts, stripeManaged: false, version: 0.0.1 } ]
      - request: { method: POST, path: /admin/app/subscriptions/admin/plans/actions/create, body: { version: 0, plan: { name: HTTP Plan } } }
        expect: { status: 409, body: { error: "Conflict: refresh and try again" } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/plans/actions/update, body: { version: { $ref: "3.body.version" }, id: http-plan, plan: { amount: 800, enabled: true, metadata: { tier: silver } } } }
        expect: { status: 200, body: { $partial: { version: 2, values: { $partial: { plans: [ *starter, *pro, *max, { id: http-plan, family: http-plan, description: "", metadata: { tier: silver }, name: HTTP Plan, amount: 800, currency: usd, periodDays: 30, enabled: true, archived: false, products: *httpProducts, stripeManaged: false, version: 0.0.2 } ] } } } } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/plans/actions/update, body: { version: { $ref: "5.body.version" }, id: nope, plan: {} } }
        expect: { status: 404, body: { error: Plan not found } }
      - request: { method: GET, path: /admin/app/subscriptions/admin/plans/http-plan/history }
        expect: { status: 200, body: { items: [ { pk: "SUB_PLAN_HISTORY#http-plan", sk: 0.0.1, version: 1, data: { id: http-plan, family: http-plan, description: "", metadata: {}, name: HTTP Plan, amount: 700, currency: usd, periodDays: 30, enabled: false, archived: false, products: *httpProducts, stripeManaged: false, version: 0.0.1 } } ] } }
      - request: { method: GET, path: /admin/app/subscriptions/admin/plans/http-plan/history, query: { cursor: nope } }
        expect: { status: 400, body: { error: Invalid cursor } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/plans/http-plan/restore, body: { version: { $ref: "5.body.version" }, fromVersion: "1" } }
        expect: { status: 400, body: { error: Invalid plan version } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/plans/http-plan/restore, body: { version: { $ref: "5.body.version" }, fromVersion: 0.0.1 } }
        expect: { status: 200, body: { $partial: { version: 3, values: { $partial: { plans: [ *starter, *pro, *max, { id: http-plan, family: http-plan, description: "", metadata: {}, name: HTTP Plan, amount: 700, currency: usd, periodDays: 30, enabled: true, archived: false, products: *httpProducts, stripeManaged: false, version: 0.0.3 } ] } } } } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/plans/actions/archive, body: { version: 3, id: http-plan } }
        expect: { status: 200, body: { $partial: { version: 4, values: { $partial: { plans: [ *starter, *pro, *max, { id: http-plan, family: http-plan, description: "", metadata: {}, name: HTTP Plan, amount: 700, currency: usd, periodDays: 30, enabled: false, archived: true, products: *httpProducts, stripeManaged: false, version: 0.0.3 } ] } } } } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/plans/actions/version, body: { version: 4, id: http-plan } }
        expect: { status: 200, body: { $partial: { version: 5, values: { $partial: { plans: [ *starter, *pro, *max, { id: http-plan, family: http-plan, description: "", metadata: {}, name: HTTP Plan, amount: 700, currency: usd, periodDays: 30, enabled: false, archived: true, products: *httpProducts, stripeManaged: false, version: 0.0.4 } ] } } } } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/plans/actions/unarchive, body: { version: 5, id: http-plan } }
        expect: { status: 200, body: { $partial: { version: 6 } } }
      - request: { method: PUT, path: /admin/app/subscriptions/admin/settings, body: { version: 6, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ *starter, *pro ] } } }
        expect: { status: 400, body: { error: Disable a plan instead of removing or renaming its ID } }

  - name: the credit statement of an account
    requests:
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/ledger, body: { requestId: rec-1, productId: api, credits: 500, kind: purchase, reason: " Top-up ", amountMinor: 1000, currency: USD, details: { invoice: in_1, lines: 2, paid: true, meta: { a: 1 }, none: null } } }
        expect: { status: 200, body: { requestId: rec-1, productId: api, credits: 500, available: 500, at: { $type: integer }, replayed: false } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/ledger, body: { requestId: rec-1, productId: api, credits: 500, kind: purchase, reason: " Top-up ", amountMinor: 1000, currency: USD, details: { invoice: in_1, lines: 2, paid: true, meta: { a: 1 }, none: null } } }
        expect: { status: 200, body: { requestId: rec-1, productId: api, credits: 500, available: 500, at: { $ref: "0.body.at" }, replayed: true } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/ledger, body: { requestId: rec-1, productId: api, credits: 400, kind: purchase, reason: Top-up } }
        expect: { status: 409, body: { error: "Conflict: refresh and try again" } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/ledger, body: { requestId: rec-2, productId: api, credits: -10, reason: Usage } }
        expect: { status: 402, body: { error: Subscription is inactive or expired } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/ledger, body: { requestId: rec-2, productId: api, credits: 10, kind: gift, reason: Gift } }
        expect: { status: 400, body: { error: Invalid entry type } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/ledger, body: { requestId: rec-2, productId: gpu, credits: 10, reason: Gift } }
        expect: { status: 404, body: { error: Product not found } }
      - request: { method: GET, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/ledger }
        expect:
          status: 200
          body:
            entries:
              - { at: { $ref: "0.body.at" }, kind: purchase, source: admin, credits: 500, productId: api, reason: Top-up, requestId: rec-1, amountMinor: 1000, currency: usd, actorId: rt-app-root, details: { invoice: in_1, lines: 2, paid: true, meta: "[object Object]", none: "null" }, available: 500, id: { $regex: "^\\d{15}-0000000001-[0-9a-f]{16}$" } }
            pending: []
            totals: { creditsIn: 500, creditsOut: 0, expired: 0, paidMinor: {}, grantedValueMinor: { usd: 1000 }, consumed: 0 }
            balances: [ { productId: api, allowanceLeft: 0, additionalCredits: 500, available: 500 } ]
      - request: { method: GET, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/ledger, query: { cursor: nope } }
        expect: { status: 400, body: { error: Invalid cursor } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/credits/estimate, body: { rateId: advanced, inputTokens: 20000, outputTokens: 1000, userId: api-sub-alice } }
        expect: { status: 200, body: { rate: { id: advanced, name: Advanced model, inputPer1k: 5, outputPer1k: 15, minimum: 1 }, inputTokens: 20000, outputTokens: 1000, exactCredits: 115, credits: 115, valueMinor: 115, currency: usd, account: { userId: api-sub-alice, productId: api, allowanceLeft: 0, additionalCredits: 500, available: 500, fromAllowance: 0, fromBalance: 115, allowed: true, availableAfter: 385 } } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/credits/estimate, body: { rateId: nope, inputTokens: 1 } }
        expect: { status: 404, body: { error: Credit rate not found } }

  - name: accounts, grants, resets and simulations
    requests:
      - request: { method: GET, path: /admin/app/subscriptions/admin/accounts, query: { q: " API-SUB- " } }
        expect: { status: 200, body: { items: [] } }
      - request: { method: GET, path: /admin/app/subscriptions/admin/accounts, query: { q: { $text: { repeat: a, count: 201 } } } }
        expect: { status: 400, body: { error: Search is too long } }
      - request: { method: GET, path: /admin/app/subscriptions/admin/accounts/api-sub-alice }
        expect:
          status: 200
          body:
            account: { $partial: { userId: api-sub-alice, creditBalance: { api: 500 }, assignedByAdmin: false, active: false, version: 1, paymentRequired: false, provider: local, usage: [] } }
            billing: { invoices: [], paymentMethods: [], amountDue: 0, totalPaid: 0, currency: null }
            grants: { items: [] }
            usage: { items: [] }
      - request: { method: GET, path: /admin/app/subscriptions/admin/accounts/api-sub-nobody }
        expect: { status: 200, body: { account: { $partial: { userId: api-sub-nobody, status: none, counters: {}, notifications: true, version: 0, active: false } }, billing: { $partial: { invoices: [] } }, grants: { items: [] }, usage: { items: [] } } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/grant, body: { requestId: g1, kind: credits, productId: api, credits: 5, reason: Thanks, currency: usd, valueMinor: 0 } }
        expect: { status: 404, body: { error: User not found } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/grant, body: { requestId: g1, kind: coupon } }
        expect: { status: 400, body: { error: Invalid assignment type } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/reset, body: { requestId: r1, scope: day, reason: Outage } }
        expect: { status: 404, body: { error: No subscription } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/reset, body: { requestId: r1, scope: year, reason: Outage } }
        expect: { status: 400, body: { error: Invalid reset scope } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/accounts/api-sub-alice/simulate, body: { status: past_due } }
        expect: { status: 404, body: { error: No simulated customer } }
      - request: { method: POST, path: /admin/app/subscriptions/admin/maintenance }
        expect: { status: 200, body: { processed: { $type: integer }, partial: false } }
      - request: { method: GET, path: /admin/app/subscriptions/admin/overview }
        expect: { status: 200, body: { asOf: { $type: integer }, customers: 0, paying: 0, canceling: 0, mrrMinor: {}, plans: [], today: { date: { $regex: "^\\d{4}-\\d{2}-\\d{2}$" }, new: 0, canceled: 0 }, month: { month: { $regex: "^\\d{4}-\\d{2}$" }, new: 0, canceled: 0 }, series: { $length: 12 } } }
      - request: { method: GET, path: /admin/app/subscriptions/admin/overview, query: { months: "2" } }
        expect: { status: 200, body: { $partial: { series: [ { month: { $regex: "^\\d{4}-\\d{2}$" }, customers: null, paying: null, new: 0, canceled: 0 }, { month: { $regex: "^\\d{4}-\\d{2}$" }, customers: 0, paying: 0, new: 0, canceled: 0 } ] } } }
      - request: { method: GET, path: /admin/app/subscriptions/admin/overview, query: { months: "37" } }
        expect: { status: 400, body: { error: Invalid numeric setting } }
      - request: { method: GET, path: /admin/app/subscriptions/admin/overview, query: { months: abc } }
        expect: { status: 400, body: { error: Invalid numeric setting } }
