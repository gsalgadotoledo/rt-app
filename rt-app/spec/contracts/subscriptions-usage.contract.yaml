rsion: 0.0.1 }, { id: max, family: max, description: "", metadata: {}, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.2 }, { id: mini, family: mini, description: "", metadata: {}, name: Mini, amount: 0, currency: usd, periodDays: 14, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 50, dailyLimit: 20, weeklyLimit: 30, daySeconds: 86400, weekSeconds: 604800 }, { id: img, name: Images, credits: 5, dailyLimit: 5, weeklyLimit: 5, daySeconds: 3600, weekSeconds: 172800 } ], stripeManaged: false, version: 0.0.1 } ], usage: [ { id: api, name: API credits, credits: 50, dailyLimit: 20, weeklyLimit: 30, daySeconds: 86400, weekSeconds: 604800, used: 30, remaining: 0, allowanceLeft: 0, extraCredits: 0, dayUsed: 10, weekUsed: 30, dayResetAt: 1767398400000, weekResetAt: 1767830400000 }, { id: img, name: Images, credits: 5, dailyLimit: 5, weeklyLimit: 5, daySeconds: 3600, weekSeconds: 172800, used: 5, remaining: 0, allowanceLeft: 0, extraCredits: 0, dayUsed: 0, weekUsed: 5, dayResetAt: 1767315600000, weekResetAt: 1767398400000 } ] } } }
      - { call: ledger, args: [ alice ], expect: { value: { entries: [ { at: 1767225600000, kind: allowance, credits: 30, productId: api, reason: "API credits: weekly allowance", source: system, available: 20, id: 001767225600000-0000000001-d096f13bbabcc828 }, { at: 1767225600000, kind: allowance, credits: 5, productId: img, reason: "Images: weekly allowance", source: system, available: 5, id: 001767225600000-0000000002-4f245b554e2f5283 }, { at: 1767225600000, kind: plan, source: user, credits: 0, planId: mini, reason: "Plan started: Mini", requestId: plan-1, id: 001767225600000-0000000003-9e031019253ed56a }, { at: 1767225600000, kind: usage, source: api, credits: -20, productId: api, reason: API credits usage, requestId: u1, fromAllowance: 20, fromBalance: 0, available: 0, id: 001767225600000-0000000004-e7f12c038a04de0f }, { at: 1767225600000, kind: usage, source: api, credits: -5, productId: img, reason: Images usage, requestId: i1, fromAllowance: 5, fromBalance: 0, available: 0, id: 001767225600000-0000000005-fd983728638d37e9 }, { at: 1767312000000, kind: usage, source: api, credits: -10, productId: api, reason: API credits usage, requestId: u2, fromAllowance: 10, fromBalance: 0, available: 0, id: 001767312000000-0000000006-3779c6407ea572bf } ], pending: [], totals: { creditsIn: 35, creditsOut: 35, expired: 0, paidMinor: {}, grantedValueMinor: {}, consumed: 35 }, balances: [ { productId: api, allowanceLeft: 0, additionalCredits: 0, available: 0 }, { productId: img, allowanceLeft: 0, additionalCredits: 0, available: 0 } ] } } }
      - { call: setNow, args: [ "2026-01-08T00:00:00.000Z" ], expect: { value: null } }
      - { call: consume, args: [ alice, api, 20, u3 ], expect: { value: { requestId: u3, productId: api, credits: 20, fromAllowance: 20, fromBalance: 0, at: 1767830400000, replayed: false } } }
      - { call: consume, args: [ alice, api, 1, u4 ], expect: { error: { status: 429, message: Subscription day limit reached. Add credits or wait for the reset. } } }
