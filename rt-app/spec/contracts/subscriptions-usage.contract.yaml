contract: 1
module: subscriptions-usage
subject: subscriptions
title: Subscriptions service - credit consumption, records, estimates and the statement
description: |
  Credits through the `subscriptions` facade (see subscriptions-settings for init and helpers).

  allowanceLeft(data, product) = 0 without an active, unexpired effective entitlement that has
  the product and its counters; else max(0, min(dailyLimit - day, weeklyLimit - week, credits -
  period)). available = allowanceLeft + creditBalance[product] (additional credits, 0 when
  missing). Window state for the ledger (subscriptions-ledger rollover): key "own:<planId>" or
  "admin:<planId>" (admin grant), periodStart, periodMs = periodDays days, products {id, name,
  weeklyLimit, weekSeconds, start: counters[id].weekStart ?? periodStart}; `used` is the stored
  week counter when its weekStart equals the settled start, else 0 (the admin grant counters for
  an "admin:" key). settle(userId, raw, data) writes the pending rollover entries (source
  "system") before any other entry of the same write and stores ledgerWindows = state (null when
  no entitlement). Every ledger entry increments data.ledgerSequence (its key sequence), gets
  `available` when it has a productId, and is folded into data.ledgerTotals (applyTotals).

  consume(userId, productId, credits, requestId, meta?): id(requestId) (400 "Invalid
  identifier"); integer(credits, 1) (400 "Invalid numeric setting"); inside a retry on
  Conflict: SUB_USAGE#<user>/<requestId> replays ({...receipt, replayed: true}; another product
  or amount -> Conflict); the effective entitlement must be active and unexpired (402
  "Subscription is inactive or expired"); with payments required its mode must be "admin" or the
  provider's (402 "A paid subscription is required"); the plan must include the product (403
  "Product is not included in your plan"); settle; fromAllowance = min(credits, allowanceLeft),
  fromBalance = credits - fromAllowance; fromBalance > balance -> 429 "Subscription <window>
  limit reached. Add credits or wait for the reset." (window: "day" when day >= dailyLimit,
  else "week" when week >= weeklyLimit, else "period"); the counters (period, day, week) grow by
  fromAllowance, the balance shrinks by fromBalance (creditBalance[product] is written even when
  0), totalConsumed += credits. Receipt {requestId, productId, credits, fromAllowance,
  fromBalance, at, replayed: false}; ledger entry {kind: meta.kind ?? "usage", source:
  meta.source ?? "api", credits: -credits, productId, reason: meta.reason ?? "<product name>
  usage", requestId, fromAllowance, fromBalance, actorId?, details?} with seed "usage:<requestId>".
  recordCredits(userId, input), in order: id(requestId); id(productId); reason trimmed 1..300
  (400 "A short reason is required"); kind = input.kind ?? (credits > 0 ? "adjustment" :
  "usage") in purchase|adjustment|grant|usage (400 "Invalid entry type"); credits a safe
  non-zero integer with |credits| <= 1e9 (400 "Credits must be a non-zero integer"); source ??
  "api" in system|admin|billing|user|api (400 "Invalid source"); when amountMinor or currency is
  given: currency lowercased, integer(amountMinor), valid currency and amount (400 "Invalid
  amount for currency"). Debits are consume(..., -credits, requestId, {reason, kind, source,
  actorId, details}). Credits: replay by SUB_LEDGER_OP#<user>/<requestId> {fingerprint:
  sha256hex(JSON.stringify({...input, kind, source})), result} ({...result, replayed: true};
  different -> Conflict); the product must belong to a plan (404 "Product not found"); balance
  += credits (integer 0..1e9); entry seed "record:<requestId>"; result {requestId, productId,
  credits, available, at, replayed: false}.
  estimate({rateId, inputTokens, outputTokens?, userId?, productId?}): pricing as in
  subscriptions-credits with the stored credit settings; with userId (id()) the account preview
  {userId, productId (id(productId ?? "api")), allowanceLeft, additionalCredits, available,
  fromAllowance, fromBalance, allowed: fromBalance <= balance && credits > 0, availableAfter:
  max(0, available - credits)}. consumeUsage(userId, productId, usage, requestId) = estimate,
  then consume with reason "<rate name> request" and details {rateId, inputTokens,
  outputTokens}; returns the receipt plus valueMinor and currency.
  ledger(userId, cursor?) -> {entries (one store page of SUB_LEDGER#<user>), cursor, pending
  (rollover entries owed now, source "system", pending: true; [] when a cursor is given),
  totals ({...emptyTotals, ...ledgerTotals, consumed: totalConsumed ?? 0}), balances per product
  of the effective plan then other creditBalance keys: {productId, allowanceLeft,
  additionalCredits, available}}.
fixtures:
  mini: &mini { version: 0, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: max, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: mini, name: Mini, amount: 0, currency: usd, periodDays: 14, enabled: true, products: [ { id: api, name: API credits, credits: 50, dailyLimit: 20, weeklyLimit: 30, daySeconds: 86400, weekSeconds: 604800 }, { id: img, name: Images, credits: 5, dailyLimit: 5, weeklyLimit: 5, daySeconds: 3600, weekSeconds: 172800 } ] } ] } }
  alice: &alice { id: alice, email: alice@example.test, role: user }
cases:
  - name: consumption needs an active entitlement
    tags: [ validation ]
    steps:
      - { call: consume, args: [ alice, api, 1, "bad id" ], expect: { error: { status: 400, message: Invalid identifier } } }
      - { call: consume, args: [ alice, api, 0, u1 ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: consume, args: [ alice, api, 1.5, u1 ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: consume, args: [ alice, api, 1000000001, u1 ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: consume, args: [ alice, api, 1, u1 ], expect: { error: { status: 402, message: Subscription is inactive or expired } } }
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } } }
      - { call: consume, args: [ alice, gpu, 1, u1 ], expect: { error: { status: 403, message: Product is not included in your plan } } }
      - { call: setNow, args: [ "2026-01-31T00:00:00.000Z" ], expect: { value: null } }
      - { call: consume, args: [ alice, api, 1, u1 ], expect: { value: { requestId: u1, productId: api, credits: 1, fromAllowance: 1, fromBalance: 0, at: 1769817600000, replayed: false } }, note: "the unpaid plan renewed" }

  - name: unpaid entitlements stop when payments are required
    init: { billing: local }
    steps:
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } } }
      - { call: saveSettings, args: [ { version: 0, values: { paymentRequired: true, notifications: true, reminderDays: 3, plans: [ { id: starter, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: pro, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ] }, { id: max, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: true, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ] } ] } }, root ], expect: { value: { version: 1, values: { paymentRequired: true, notifications: true, reminderDays: 3, plans: [ { id: starter, family: starter, description: "", metadata: {}, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }, { id: pro, family: pro, description: "", metadata: {}, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }, { id: max, family: max, description: "", metadata: {}, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.2 } ], credits: { pack: { credits: 1000, amountMinor: 1000, currency: usd }, rates: [ { id: standard, name: Standard model, inputPer1k: 1, outputPer1k: 3, minimum: 1 }, { id: advanced, name: Advanced model, inputPer1k: 5, outputPer1k: 15, minimum: 1 } ] } }, provider: local, catalogAvailable: false } } }
      - { call: consume, args: [ alice, api, 1, u1 ], expect: { error: { status: 402, message: A paid subscription is required } } }
      - { call: me, args: [ alice ], expect: { value: { $partial: { active: false, status: active, mode: none, paymentRequired: true } } } }

  - name: plan allowance first, then additional credits, with idempotent request ids
    steps:
      - { call: change, args: [ *alice, starter, plan-1 ], expect: { value: { ok: true } } }
      - { call: consume, args: [ alice, api, 60, u1 ], expect: { value: { requestId: u1, productId: api, credits: 60, fromAllowance: 60, fromBalance: 0, at: 1767225600000, replayed: false } } }
      - { call: consume, args: [ alice, api, 60, u1 ], note: replayed, expect: { value: { requestId: u1, productId: api, credits: 60, fromAllowance: 60, fromBalance: 0, at: 1767225600000, replayed: true } } }
      - { call: consume, args: [ alice, api, 61, u1 ], expect: { error: { status: 409, message: "Conflict: refresh and try again" } } }
      - { call: consume, args: [ alice, img, 60, u1 ], expect: { error: { status: 409, message: "Conflict: refresh and try again" } } }
      - { call: consume, args: [ alice, api, 50, u2 ], expect: { error: { status: 429, message: Subscription period limit reached. Add credits or wait for the reset. } }, note: "the window named is the first one fully used (day, week, then period), not the binding one" }
