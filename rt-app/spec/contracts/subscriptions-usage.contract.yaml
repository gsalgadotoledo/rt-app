  - name: records are validated in order
    tags: [ validation ]
    steps:
      - { call: recordCredits, args: [ alice, { requestId: "bad id", productId: "bad id" } ], expect: { error: { status: 400, message: Invalid identifier } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: "bad id" } ], expect: { error: { status: 400, message: Invalid identifier } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: 5 } ], expect: { error: { status: 400, message: A short reason is required } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: 5, reason: { $text: { repeat: x, count: 301 } } } ], expect: { error: { status: 400, message: A short reason is required } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: 5, reason: Gift, kind: gift } ], expect: { error: { status: 400, message: Invalid entry type } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: 0, reason: Gift } ], expect: { error: { status: 400, message: Credits must be a non-zero integer } }, note: "kind defaults to usage for 0, which is valid; credits come next" }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: 1.5, reason: Gift } ], expect: { error: { status: 400, message: Credits must be a non-zero integer } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: "5", reason: Gift, kind: grant } ], expect: { error: { status: 400, message: Credits must be a non-zero integer } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: -1000000001, reason: Gift } ], expect: { error: { status: 400, message: Credits must be a non-zero integer } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: 5, reason: Gift, source: robot } ], expect: { error: { status: 400, message: Invalid source } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: 5, reason: Gift, currency: usd } ], expect: { error: { status: 400, message: Invalid numeric setting } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: 5, reason: Gift, amountMinor: 5, currency: xx } ], expect: { error: { status: 400, message: Invalid amount for currency } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: 5, reason: Gift, amountMinor: 150, currency: ugx } ], expect: { error: { status: 400, message: Invalid amount for currency } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: gpu, credits: 5, reason: Gift } ], expect: { error: { status: 404, message: Product not found } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: -5, reason: Refund } ], expect: { error: { status: 402, message: Subscription is inactive or expired } } }
      - { call: recordCredits, args: [ alice, { requestId: r1, productId: api, credits: 1000000000, reason: Gift } ], expect: { value: { requestId: r1, productId: api, credits: 1000000000, available: 1000000000, at: 1767225600000, replayed: false } } }
      - { call: recordCredits, args: [ alice, { requestId: r2, productId: api, credits: 1, reason: Gift } ], expect: { error: { status: 400, message: Invalid numeric setting } }, note: "the balance stays within 0..1e9" }

