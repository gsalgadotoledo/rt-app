, dayUsed: 100, weekUsed: 100, dayResetAt: 1767312000000, weekResetAt: 1767830400000 } ] } } }
      - { call: row, args: [ "SUB_USAGE#alice", u2 ], expect: { value: { pk: SUB_USAGE#alice, sk: u2, version: 1, data: { requestId: u2, productId: api, credits: 50, fromAllowance: 40, fromBalance: 10, at: 1767225600000, replayed: false } } } }
      - { call: row, args: [ "SUB_LEDGER_OP#alice", pi_1 ], expect: { value: { pk: SUB_LEDGER_OP#alice, sk: pi_1, version: 1, data: { fingerprint: efc03c402d6cf0264ec11a7fbcd996fedda8f1d8c56321441c2830480ebb94da, result: { requestId: pi_1, productId: api, credits: 100, available: 140, at: 1767225600000 } } } } }
      - { call: ledger, args: [ alice ], expect: { value: { entries: [ { at: 1767225600000, kind: allowance, credits: 500, productId: api, reason: "API credits: weekly allowance", source: system, available: 100, id: 001767225600000-0000000001-807d3bf3798545ed }, { at: 1767225600000, kind: plan, source: user, credits: 0, planId: starter, reason: "Plan started: Starter", requestId: plan-1, id: 001767225600000-0000000002-9e031019253ed56a }, { at: 1767225600000, kind: usage, source: api, credits: -60, productId: api, reason: API credits usage, requestId: u1, fromAllowance: 60, fromBalance: 0, available: 40, id: 001767225600000-0000000003-e7f12c038a04de0f }, { at: 1767225600000, kind: purchase, source: api, credits: 100, productId: api, reason: Top-up, requestId: pi_1, amountMinor: 1000, currency: usd, available: 140, id: 001767225600000-0000000004-c10a311aeccc9a26 }, { at: 1767225600000, kind: usage, source: user, credits: -50, productId: api, reason: Report export, requestId: u2, fromAllowance: 40, fromBalance: 10, actorId: alice, details: { report: r-9, pages: 3, cached: false }, available: 90, id: 001767225600000-0000000005-3779c6407ea572bf }, { at: 1767225600000, kind: usage, source: api, credits: -90, productId: api, reason: API credits usage, requestId: u3, fromAllowance: 0, fromBalance: 90, available: 0, id: 001767225600000-0000000006-1554b7acb72f94a2 } ], pending: [], totals: { creditsIn: 600, creditsOut: 200, expired: 0, paidMinor: { usd: 1000 }, grantedValueMinor: {}, consumed: 200 }, balances: [ { productId: api, allowanceLeft: 0, additionalCredits: 0, available: 0 } ] } } }

  - name: day, week and period windows limit the allowance
    steps:
      - { call: saveSettings, args: [ *mini, root ], expect: { value: { version: 1, values: { paymentRequired: false, notifications: true, reminderDays: 3, plans: [ { id: starter, family: starter, description: "", metadata: {}, name: Starter, amount: 0, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 1000, dailyLimit: 100, weeklyLimit: 500, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }, { id: pro, family: pro, description: "", metadata: {}, name: Pro, amount: 2000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 10000, dailyLimit: 1000, weeklyLimit: 5000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.1 }, { id: max, family: max, description: "", metadata: {}, name: Max, amount: 5000, currency: usd, periodDays: 30, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 50000, dailyLimit: 5000, weeklyLimit: 25000, daySeconds: 86400, weekSeconds: 604800 } ], stripeManaged: false, version: 0.0.2 }, { id: mini, family: mini, description: "", metadata: {}, name: Mini, amount: 0, currency: usd, periodDays: 14, enabled: true, archived: false, products: [ { id: api, name: API credits, credits: 50, dailyLimit: 20, weeklyLimit: 30, daySeconds: 86400, weekSeconds: 604800 }, { id: img, name: Images, credits: 5, dailyLimit: 5, weeklyLimit: 5, daySeconds: 3600, weekSeconds: 172800 } ], stripeManaged: false, version: 0.0.1 } ], credits: { pack: { credits: 1000, amountMinor: 1000, currency: usd }, rates: [ { id: standard, name: Standard model, inputPer1k: 1, outputPer1k: 3, minimum: 1 }, { id: advanced, name: Advanced model, inputPer1k: 5, outputPer1k: 15, minimum: 1 } ] } }, provider: none, catalogAvailable: false } } }
      - { call: change, args: [ *alice, mini, plan-1 ], expect: { value: { ok: true } } }
      - { call: consume, args: [ alice, api, 20, u1 ], expect: { value: { requestId: u1, productId: api, credits: 20, fromAllowance: 20, fromBalance: 0, at: 1767225600000, replayed: false } } }
      - { call: consume, args: [ alice, api, 1, u2 ], expect: { error: { status: 429, message: Subscription day limit reached. Add credits or wait for the reset. } } }
      - { call: consume, args: [ alice, img, 5, i1 ], expect: { value: { requestId: i1, productId: img, credits: 5, fromAllowance: 5, fromBalance: 0, at: 1767225600000, replayed: false } } }
      - { call: consume, args: [ alice, img, 1, i2 ], expect: { error: { status: 429, message: Subscription day limit reached. Add credits or wait for the reset. } } }
      - { call: setNow, args: [ "2026-01-01T01:00:00.000Z" ], expect: { value: null } }
      - { call: consume, args: [ alice, img, 1, i2 ], expect: { error: { status: 429, message: Subscription week limit reached. Add credits or wait for the reset. } } }
      - { call: setNow, args: [ "2026-01-02T00:00:00.000Z" ], expect: { value: null } }
      - { call: consume, args: [ alice, api, 10, u2 ], expect: { value: { requestId: u2, productId: api, credits: 10, fromAllowance: 10, fromBalance: 0, at: 1767312000000, replayed: false } } }
      - { call: consume, args: [ alice, api, 1, u3 ], expect: { error: { status: 429, message: Subscription week limit reached. Add credits or wait for the reset. } } }
