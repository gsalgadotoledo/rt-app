      - { call: consume, args: [ alice, api, 50, u2, { reason: Report export, kind: usage, source: user, actorId: alice, details: { report: r-9, pages: 3, cached: false } } ], expect: { value: { requestId: u2, productId: api, credits: 50, fromAllowance: 40, fromBalance: 10, at: 1767225600000, replayed: false } } }
      - { call: consume, args: [ alice, api, 91, u3 ], expect: { error: { status: 429, message: Subscription day limit reached. Add credits or wait for the reset. } } }
      - { call: consume, args: [ alice, api, 90, u3 ], expect: { value: { requestId: u3, productId: api, credits: 90, fromAllowance: 0, fromBalance: 90, at: 1767225600000, replayed: false } } }
