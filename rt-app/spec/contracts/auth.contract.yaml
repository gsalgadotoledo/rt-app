      - { call: mailbox, args: [], expect: { value: [ { email: alice@example.test, code: { $regex: "^[1-9][0-9]{5}$" }, purpose: reset } ] } }

  - name: password reset with an emailed code
    steps:
      - { call: issue, args: [ alice@example.test, reset, 1.1.1.1 ], expect: { value: { message: "If the account supports this method, you will receive a code." } } }
      - { call: mailbox, args: [], expect: { value: [ { email: alice@example.test, code: { $regex: "^[1-9][0-9]{5}$" }, purpose: reset } ] } }
      - { call: consume, args: [ alice@example.test, { $ref: "1.value[0].code" }, reset, 1.1.1.1, short ], expect: { error: { status: 400, message: The password must contain 12 to 128 characters } } }
      - { call: consume, args: [ alice@example.test, { $ref: "1.value[0].code" }, reset, 1.1.1.1, a brand new password ], expect: { value: { message: Password updated. Sign in to continue. } }, note: an invalid new password does not consume the code }
      - { call: row, args: [ USERS, u-alice ], expect: { value: { $partial: { version: 2, data: { $partial: { tokenVersion: 2, passwordHash: { $regex: "^scrypt\\$[0-9a-f]{32}\\$[0-9a-f]{128}$" } } } } } } }
      - { call: login, args: [ alice@example.test, correct horse battery, 1.1.1.1 ], expect: { error: { status: 401, message: Incorrect email or password } } }
      - { call: login, args: [ alice@example.test, a brand new password, 1.1.1.1 ], expect: { value: { $partial: { expiresIn: 900 } } } }
      - { call: consume, args: [ alice@example.test, { $ref: "1.value[0].code" }, reset, 1.1.1.1, another new password ], expect: { error: { status: 400, message: Invalid or expired code } } }

  # --- settings ----------------------------------------------------------------------------------
  - name: default settings
    call: settings
    args: []
    expect: { value: { version: 0, values: { passwordLogin: true, emailCodeLogin: true }, fields: [ { name: passwordLogin, label: Allow password sign-in, type: boolean }, { name: emailCodeLogin, label: Allow email code sign-in, type: boolean } ] } }

  - name: settings updates are versioned
    tags: [ concurrency ]
    steps:
      - call: updateSettings
        args: [ { version: 0, values: { passwordLogin: true, emailCodeLogin: false, extra: 1 } } ]
        expect: { value: { version: 1, values: { passwordLogin: true, emailCodeLogin: false }, fields: [ { name: passwordLogin, label: Allow password sign-in, type: boolean }, { name: emailCodeLogin, label: Allow email code sign-in, type: boolean } ] } }
      - { call: row, args: [ SETTINGS, auth ], expect: { value: { pk: SETTINGS, sk: auth, version: 1, data: { passwordLogin: true, emailCodeLogin: false } } }, note: only the two booleans are stored }
      - { call: updateSettings, args: [ { version: 0, values: { passwordLogin: true, emailCodeLogin: true } } ], expect: { error: { status: 409, message: "Conflict: refresh and try again" } } }
      - { call: updateSettings, args: [ { version: 1, values: { passwordLogin: true, emailCodeLogin: true } } ], expect: { value: { $partial: { version: 2, values: { passwordLogin: true, emailCodeLogin: true } } } } }
      - { call: settings, args: [], expect: { value: { $partial: { version: 2 } } } }

  - name: invalid settings share one message
    tags: [ validation ]
    steps:
      - { call: updateSettings, args: [ { version: 0, values: { passwordLogin: false, emailCodeLogin: false } } ], expect: { error: { status: 400, message: At least one sign-in method must remain enabled } } }
      - { call: updateSettings, args: [ { version: "0", values: { passwordLogin: true, emailCodeLogin: true } } ], expect: { error: { status: 400, message: At least one sign-in method must remain enabled } } }
      - { call: updateSettings, args: [ { version: 0.5, values: { passwordLogin: true, emailCodeLogin: true } } ], expect: { error: { status: 400, message: At least one sign-in method must remain enabled } } }
      - { call: updateSettings, args: [ { values: { passwordLogin: true, emailCodeLogin: true } } ], expect: { error: { status: 400, message: At least one sign-in method must remain enabled } } }
      - { call: updateSettings, args: [ { version: 0 } ], expect: { error: { status: 400, message: At least one sign-in method must remain enabled } } }
      - { call: updateSettings, args: [ { version: 0, values: { passwordLogin: "true", emailCodeLogin: true } } ], expect: { error: { status: 400, message: At least one sign-in method must remain enabled } } }
      - { call: updateSettings, args: [ { version: 0, values: { passwordLogin: true, emailCodeLogin: 1 } } ], expect: { error: { status: 400, message: At least one sign-in method must remain enabled } } }
      - { call: row, args: [ SETTINGS, auth ], expect: { value: null } }

  - name: password sign-in stays on while any account has MFA
    tags: [ validation ]
    steps:
      - { call: updateSettings, args: [ { version: 0, values: { passwordLogin: false, emailCodeLogin: true } } ], expect: { error: { status: 409, message: Password sign-in is required for accounts with MFA } } }
      - { call: updateSettings, args: [ { version: 7, values: { passwordLogin: false, emailCodeLogin: true } } ], expect: { error: { status: 409, message: Password sign-in is required for accounts with MFA } }, note: checked before the version }
      - { call: updateSettings, args: [ { version: 0, values: { passwordLogin: true, emailCodeLogin: false } } ], expect: { value: { $partial: { version: 1 } } } }

  # --- TOTP ---------------------------------------------------------------------------------------
