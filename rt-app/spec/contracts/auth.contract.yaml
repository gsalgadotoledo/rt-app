      - { call: unseal, args: [ CwoJCAcGBQQDAgEABVssCWTvS22ukbO0Zn4B3ort ], expect: { value: {} }, note: "IV 0b0a09080706050403020100" }

  - name: sign-in with password and authenticator
    tags: [ totp, determinism ]
    steps:
      - { call: login, args: [ bob@example.test, correct horse battery, 1.1.1.1 ], expect: { value: { challenge: totp, challengeId: { $type: string } } } }
      - call: verifyMfa
        args: [ { $ref: "0.value.challengeId" }, "652348", 1.1.1.1 ]
        expect: { value: { token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2IjoxLCJzdWIiOiJ1LWJvYiIsImlzcyI6InJ0LWFwcCIsImF1ZCI6InJ0LWFwcC1hcGkiLCJpYXQiOjE3NjczMjMwNDUsImV4cCI6MTc2NzMyMzk0NX0.X7w12JG1kbuSSLwbKfSRngvuVBY3MGL8W7Z9NefiVH4, expiresIn: 900, user: { id: u-bob, email: bob@example.test, name: Bob, role: user, grants: [], active: true, createdAt: null, createdBy: null, updatedAt: null, updatedBy: null, deletedAt: null, deletedBy: null, restoredAt: null, restoredBy: null } } }
      - { call: row, args: [ MFA, u-bob ], expect: { value: { $partial: { version: 2, data: { $partial: { lastStep: 58910768, enabled: true } } } } } }
      - { call: verifyMfa, args: [ { $ref: "0.value.challengeId" }, "751330", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired challenge } }, note: challenges are single-use }

  - name: TOTP accepts one step of drift and never an older step
    tags: [ totp, security ]
    steps:
      - { call: login, args: [ bob@example.test, correct horse battery, 1.1.1.1 ], expect: { value: { $partial: { challenge: totp } } } }
      - { call: verifyMfa, args: [ { $ref: "0.value.challengeId" }, "594060", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or previously used code } }, note: two steps back }
      - { call: verifyMfa, args: [ { $ref: "0.value.challengeId" }, "366299", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or previously used code } }, note: two steps ahead }
      - { call: verifyMfa, args: [ { $ref: "0.value.challengeId" }, "751330", 1.1.1.1 ], expect: { value: { $partial: { expiresIn: 900 } } }, note: one step ahead }
      - { call: row, args: [ MFA, u-bob ], expect: { value: { $partial: { data: { $partial: { lastStep: 58910769 } } } } } }
      - { call: login, args: [ bob@example.test, correct horse battery, 1.1.1.1 ], expect: { value: { $partial: { challenge: totp } } } }
      - { call: verifyMfa, args: [ { $ref: "5.value.challengeId" }, "652348", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or previously used code } }, note: the current step is older than the last used one }
      - { call: verifyMfa, args: [ { $ref: "5.value.challengeId" }, "751330", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or previously used code } }, note: replay }

  - name: the previous step is accepted
    tags: [ totp ]
    steps:
      - { call: login, args: [ bob@example.test, correct horse battery, 1.1.1.1 ], expect: { value: { $partial: { challenge: totp } } } }
      - { call: verifyMfa, args: [ { $ref: "0.value.challengeId" }, "391022", 1.1.1.1 ], expect: { value: { $partial: { expiresIn: 900 } } } }
      - { call: row, args: [ MFA, u-bob ], expect: { value: { $partial: { data: { $partial: { lastStep: 58910767 } } } } } }

  - name: pending challenges written by another implementation
    tags: [ interop, totp, clock ]
    init: &bob-flow
      secret: rt-app-contract-secret-0123456789abcdef
      now: "2026-01-02T03:04:05.000Z"
      rows:
        - *bob
        - *bob-email
        - *bob-mfa
        - { pk: AUTH_FLOW, sk: flow-bob, version: 1, ttl: 1767323345, data: { userId: u-bob, tokenVersion: 1, kind: totp, expires: 1767323345000, used: false, sealed: CwoJCAcGBQQDAgEABVssCWTvS22ukbO0Zn4B3ort } }
    steps:
      - { call: setNow, args: [ "2026-01-02T03:09:05.000Z" ], expect: { value: null }, note: exactly at expiry }
      - { call: totpCode, args: [ GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ, 58910778 ], expect: { value: "136155" } }
      - call: verifyMfa
        args: [ flow-bob, { $ref: "1.value" }, 1.1.1.1 ]
        note: the challenge's sealed value and the MFA seed were sealed with fixed IVs
        expect: { value: { token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2IjoxLCJzdWIiOiJ1LWJvYiIsImlzcyI6InJ0LWFwcCIsImF1ZCI6InJ0LWFwcC1hcGkiLCJpYXQiOjE3NjczMjMzNDUsImV4cCI6MTc2NzMyNDI0NX0.cfHw78q8WQ-EBU3vkfhjWUFhnAxhTjSickznsgd70XE, expiresIn: 900, user: { id: u-bob, email: bob@example.test, name: Bob, role: user, grants: [], active: true, createdAt: null, createdBy: null, updatedAt: null, updatedBy: null, deletedAt: null, deletedBy: null, restoredAt: null, restoredBy: null } } }
      - { call: row, args: [ AUTH_FLOW, flow-bob ], expect: { value: { $partial: { version: 2, data: { $partial: { used: true } } } } } }

  - name: pending challenges expire after five minutes
    tags: [ totp, clock ]
    init: *bob-flow
    steps:
      - { call: setNow, args: [ "2026-01-02T03:09:05.001Z" ], expect: { value: null } }
      - { call: verifyMfa, args: [ flow-bob, "652348", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired challenge } } }

  - name: challenge validation
    tags: [ totp, validation ]
    init: *bob-flow
    steps:
      - { call: verifyMfa, args: [ 42, "652348", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid challenge } } }
      - { call: verifyMfa, args: [ { $text: { repeat: x, count: 101 } }, "652348", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid challenge } } }
      - { call: verifyMfa, args: [ { $text: { repeat: x, count: 100 } }, "652348", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired challenge } } }
      - { call: verifyMfa, args: [ flow-bob, "65234", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid code } } }
      - { call: enableMfa, args: [ u-bob, flow-bob, "652348", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired challenge } }, note: a totp challenge is not an enroll challenge }
      - { call: verifyMfa, args: [ flow-bob, "652348", 1.1.1.1 ], expect: { value: { $partial: { expiresIn: 900 } } } }

  - name: revoked sessions invalidate pending challenges
    tags: [ totp, security ]
    init:
      secret: rt-app-contract-secret-0123456789abcdef
      now: "2026-01-02T03:04:05.000Z"
      rows:
        - { pk: USERS, sk: u-bob, version: 2, data: { id: u-bob, email: bob@example.test, name: Bob, role: user, grants: [], active: true, tokenVersion: 2 } }
        - *bob-mfa
        - { pk: AUTH_FLOW, sk: flow-bob, version: 1, ttl: 1767323345, data: { userId: u-bob, tokenVersion: 1, kind: totp, expires: 1767323345000, used: false, sealed: CwoJCAcGBQQDAgEABVssCWTvS22ukbO0Zn4B3ort } }
    call: verifyMfa
    args: [ flow-bob, "652348", 1.1.1.1 ]
    expect: { error: { status: 401, message: Invalid session } }

  - name: five wrong TOTP codes per user per minute
    tags: [ totp, rate-limit ]
    init: *bob-flow
    steps:
      - { call: verifyMfa, args: [ flow-bob, "000000", a ], expect: { error: { status: 400, message: Invalid or previously used code } } }
      - { call: verifyMfa, args: [ flow-bob, "000000", b ], expect: { error: { status: 400, message: Invalid or previously used code } } }
      - { call: verifyMfa, args: [ flow-bob, "000000", c ], expect: { error: { status: 400, message: Invalid or previously used code } } }
      - { call: verifyMfa, args: [ flow-bob, "000000", d ], expect: { error: { status: 400, message: Invalid or previously used code } } }
      - { call: verifyMfa, args: [ flow-bob, "000000", e ], expect: { error: { status: 400, message: Invalid or previously used code } } }
      - { call: verifyMfa, args: [ flow-bob, "652348", f ], expect: { error: { status: 429, message: "Too many attempts; wait one minute" } } }

  - name: MFA enrollment from setup to sign-in
    tags: [ totp ]
    steps:
      - call: setupMfa
        args: [ u-alice, correct horse battery, 1.1.1.1 ]
        expect:
          value:
            challenge: enroll
            challengeId: { $regex: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" }
            secret: { $regex: "^[A-Z2-7]{32}$" }
            uri: { $regex: "^otpauth://totp/RT-APP:alice%40example\\.test\\?secret=[A-Z2-7]{32}&issuer=RT-APP&algorithm=SHA1&digits=6&period=30$" }
      - { call: totpCode, args: [ { $ref: "0.value.secret" }, 58910768 ], expect: { value: { $regex: "^[0-9]{6}$" } } }
      - { call: enableMfa, args: [ u-alice, { $ref: "0.value.challengeId" }, { $ref: "1.value" }, 1.1.1.1 ], expect: { value: { message: MFA enabled. Sign in again., reauthenticate: true } } }
      - { call: hasMfa, args: [ u-alice ], expect: { value: true } }
      - { call: row, args: [ MFA, u-alice ], expect: { value: { pk: MFA, sk: u-alice, version: 1, data: { enabled: true, sealed: { $type: string }, lastStep: 58910768 } } } }
      - { call: unseal, args: [ { $ref: "4.value.data.sealed" } ], expect: { value: { secret: { $ref: "0.value.secret" } } } }
      - { call: row, args: [ USERS, u-alice ], expect: { value: { $partial: { version: 2, data: { $partial: { tokenVersion: 2 } } } } }, note: sessions are revoked }
      - { call: row, args: [ AUTH_FLOW, { $ref: "0.value.challengeId" } ], expect: { value: { $partial: { version: 2, data: { $partial: { kind: enroll, used: true } } } } } }
      - { call: login, args: [ alice@example.test, correct horse battery, 1.1.1.1 ], expect: { value: { challenge: totp, challengeId: { $type: string } } } }
      - { call: verifyMfa, args: [ { $ref: "8.value.challengeId" }, { $ref: "1.value" }, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or previously used code } }, note: the enrollment code's step is used }

  - name: enrollment secrets are sealed in the challenge
    tags: [ totp, vault ]
    steps:
      - { call: setupMfa, args: [ u-alice, correct horse battery, 1.1.1.1 ], expect: { value: { $partial: { challenge: enroll } } } }
      - { call: row, args: [ AUTH_FLOW, { $ref: "0.value.challengeId" } ], expect: { value: { $partial: { ttl: 1767323345, data: { userId: u-alice, tokenVersion: 1, kind: enroll, expires: 1767323345000, used: false, sealed: { $type: string } } } } } }
      - { call: unseal, args: [ { $ref: "1.value.data.sealed" } ], expect: { value: { secret: { $ref: "0.value.secret" } } }, note: "JSON {\"secret\":...}; no accessToken key locally" }

  - name: enrollment errors
    tags: [ totp, validation ]
    steps:
      - { call: setupMfa, args: [ u-alice, wrong password 123, 1.1.1.1 ], expect: { error: { status: 401, message: Incorrect password } } }
      - { call: setupMfa, args: [ u-alice, short, 1.1.1.1 ], expect: { error: { status: 400, message: The password must contain 12 to 128 characters } } }
      - { call: setupMfa, args: [ u-bob, correct horse battery, 1.1.1.1 ], expect: { error: { status: 409, message: MFA is already enabled } } }
      - { call: setupMfa, args: [ u-alice, correct horse battery, 2.2.2.2 ], expect: { value: { $partial: { challenge: enroll } } } }
      - { call: enableMfa, args: [ u-carol, { $ref: "3.value.challengeId" }, "123456", 1.1.1.1 ], expect: { error: { status: 403, message: Challenge belongs to another account } } }
      - { call: enableMfa, args: [ u-alice, { $ref: "3.value.challengeId" }, "12345", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid code } } }
      - { call: enableMfa, args: [ u-alice, { $ref: "3.value.challengeId" }, null, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid code } } }
      - { call: enableMfa, args: [ u-alice, missing-challenge, "123456", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired challenge } } }
      - { call: hasMfa, args: [ u-alice ], expect: { value: false } }

  - name: MFA enrollment needs password sign-in
    init:
      secret: rt-app-contract-secret-0123456789abcdef
      now: "2026-01-02T03:04:05.000Z"
      rows: [ *alice, *alice-email, { pk: SETTINGS, sk: auth, version: 1, data: { passwordLogin: false, emailCodeLogin: true } } ]
    call: setupMfa
    args: [ u-alice, correct horse battery, 1.1.1.1 ]
    expect: { error: { status: 409, message: Enable password sign-in before enabling MFA } }

  - name: resetting MFA removes it and revokes sessions
    steps:
      - { call: resetMfa, args: [ u-bob ], expect: { value: { message: MFA reset; application sessions have been invalidated. } } }
      - { call: row, args: [ MFA, u-bob ], expect: { value: null } }
      - { call: row, args: [ USERS, u-bob ], expect: { value: { $partial: { version: 2, data: { $partial: { tokenVersion: 2 } } } } } }
      - { call: hasMfa, args: [ u-bob ], expect: { value: false } }
      - { call: login, args: [ bob@example.test, correct horse battery, 1.1.1.1 ], expect: { value: { $partial: { expiresIn: 900, user: { $partial: { id: u-bob } } } } } }
      - { call: resetMfa, args: [ u-alice ], expect: { value: { $partial: { message: { $type: string } } } }, note: without MFA it still revokes sessions }
      - { call: row, args: [ USERS, u-alice ], expect: { value: { $partial: { data: { $partial: { tokenVersion: 2 } } } } } }
      - { call: resetMfa, args: [ missing ], expect: { error: { status: 404, message: User not found } } }
      - { call: resetMfa, args: [ 5 ], expect: { error: { status: 400, message: Invalid user } } }
      - { call: resetMfa, args: [ { $text: { repeat: x, count: 101 } } ], expect: { error: { status: 400, message: Invalid user } } }

  # --- email change -------------------------------------------------------------------------------
  - name: changing the email with a code sent to the new address
    steps:
      - { call: requestEmailChange, args: [ u-alice, new@example.test, 1.1.1.1 ], expect: { value: { message: We sent a code to the new email address. } } }
      - { call: mailbox, args: [], expect: { value: [ { email: new@example.test, code: { $regex: "^[1-9][0-9]{5}$" }, purpose: email-change } ] } }
      - call: row
        args: [ CHALLENGE, f9c5f9cf437d46fdad294ee018ca06c33057615bd73ad7c8f23e8ac071590d8f ]
        expect: { value: { pk: CHALLENGE, sk: f9c5f9cf437d46fdad294ee018ca06c33057615bd73ad7c8f23e8ac071590d8f, version: 1, ttl: 1767323645, data: { email: new@example.test, userId: u-alice, hash: { $regex: "^[0-9a-f]{64}$" }, used: false, attempts: 0, expires: 1767323645000, tokenVersion: 1 } } }
        note: "sk = HMAC(secret, 'email-change:u-alice')"
      - { call: confirmEmailChange, args: [ u-alice, "00000", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid code } } }
      - call: confirmEmailChange
        args: [ u-alice, { $ref: "1.value[0].code" }, 1.1.1.1 ]
        expect: { value: { token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2IjoyLCJzdWIiOiJ1LWFsaWNlIiwiaXNzIjoicnQtYXBwIiwiYXVkIjoicnQtYXBwLWFwaSIsImlhdCI6MTc2NzMyMzA0NSwiZXhwIjoxNzY3MzIzOTQ1fQ.25yx92DtscQ0gMevmtUSdXkRBB8qnmJjyQNVhYD9KdI, expiresIn: 900, user: { id: u-alice, email: new@example.test, name: Alice, role: user, grants: [], active: true, createdAt: 2026-01-01T00:00:00.000Z, createdBy: u-alice, updatedAt: 2026-01-01T00:00:00.000Z, updatedBy: u-alice, deletedAt: null, deletedBy: null, restoredAt: null, restoredBy: null } } }
      - { call: row, args: [ EMAIL, alice@example.test ], expect: { value: null } }
      - { call: row, args: [ EMAIL, new@example.test ], expect: { value: { pk: EMAIL, sk: new@example.test, version: 1, data: { id: u-alice } } } }
      - { call: row, args: [ USERS, u-alice ], expect: { value: { $partial: { version: 2, data: { $partial: { email: new@example.test, tokenVersion: 2 } } } } } }
      - { call: confirmEmailChange, args: [ u-alice, { $ref: "1.value[0].code" }, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired code } } }

  - name: email change errors
    tags: [ validation ]
    steps:
      - { call: requestEmailChange, args: [ u-alice, bob@example.test, 1.1.1.1 ], expect: { error: { status: 400, message: This email address cannot be used } } }
      - { call: requestEmailChange, args: [ u-carol, free@example.test, 1.1.1.1 ], expect: { error: { status: 401, message: Invalid session } } }
      - { call: mailbox, args: [], expect: { value: [] } }
      - { call: confirmEmailChange, args: [ u-alice, "123456", 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired code } }, note: no pending change }
