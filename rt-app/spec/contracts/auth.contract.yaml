  - name: codes are six ASCII digits
    tags: [ validation, unicode ]
    init: *known-code
    steps:
      - { call: consume, args: [ alice@example.test, "12345", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid code } } }
      - { call: consume, args: [ alice@example.test, "1234567", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid code } } }
      - { call: consume, args: [ alice@example.test, 123456, login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid code } }, note: a number is not a code }
      - { call: consume, args: [ alice@example.test, " 123456", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid code } } }
      - { call: consume, args: [ alice@example.test, "１２３４５６", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid code } }, note: "fullwidth digits are not \\d (unlike Python's Unicode \\d)" }
      - { call: consume, args: [ alice@example.test, "١٢٣٤٥٦", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid code } }, note: Arabic-Indic digits }
      - { call: row, args: [ CHALLENGE, b45bc2fe0155c496812b155c5ec1cc508f15c54be8be38130e232f56c331be61 ], expect: { value: { $partial: { version: 1, data: { $partial: { attempts: 0 } } } } }, note: format errors do not count as attempts }

  - name: five wrong codes lock the challenge
    tags: [ security ]
