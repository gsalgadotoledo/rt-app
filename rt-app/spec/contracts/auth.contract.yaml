      - { call: row, args: [ CHALLENGE, b45bc2fe0155c496812b155c5ec1cc508f15c54be8be38130e232f56c331be61 ], expect: { value: { $partial: { version: 1 } } }, note: a matching code is not counted as an attempt }

  - name: no code is sent to unknown, inactive or MFA accounts
    tags: [ security ]
    steps:
      - { call: issue, args: [ nobody@example.test, login, 1.1.1.1 ], expect: { value: { message: "If the account supports this method, you will receive a code." } } }
      - { call: issue, args: [ carol@example.test, login, 1.1.1.1 ], expect: { value: { message: "If the account supports this method, you will receive a code." } } }
      - { call: issue, args: [ bob@example.test, login, 1.1.1.1 ], expect: { value: { message: "If the account supports this method, you will receive a code." } } }
      - { call: mailbox, args: [], expect: { value: [] } }
      - { call: consume, args: [ nobody@example.test, "123456", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired code } } }
      - { call: issue, args: [ bob@example.test, reset, 1.1.1.1 ], expect: { value: { message: "If the account supports this method, you will receive a code." } }, note: password reset still works with MFA }
      - { call: mailbox, args: [], expect: { value: [ { email: bob@example.test, code: { $regex: "^[1-9][0-9]{5}$" }, purpose: reset } ] } }

