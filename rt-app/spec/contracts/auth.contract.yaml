    steps:
      - { call: consume, args: [ alice@example.test, "000000", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired code } } }
      - { call: consume, args: [ alice@example.test, "000001", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired code } } }
      - { call: consume, args: [ alice@example.test, "000002", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired code } } }
      - { call: consume, args: [ alice@example.test, "000003", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired code } } }
      - { call: row, args: [ CHALLENGE, b45bc2fe0155c496812b155c5ec1cc508f15c54be8be38130e232f56c331be61 ], expect: { value: { $partial: { version: 5, data: { $partial: { attempts: 4, used: false } } } } } }
      - { call: consume, args: [ alice@example.test, "000004", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired code } } }
      - { call: consume, args: [ alice@example.test, "123456", login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired code } }, note: the right code after 5 failures }
      - { call: row, args: [ CHALLENGE, b45bc2fe0155c496812b155c5ec1cc508f15c54be8be38130e232f56c331be61 ], expect: { value: { $partial: { version: 6, data: { $partial: { attempts: 5 } } } } }, note: locked challenges are not updated }

