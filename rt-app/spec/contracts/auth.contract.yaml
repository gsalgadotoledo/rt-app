        - { pk: CHALLENGE, sk: b45bc2fe0155c496812b155c5ec1cc508f15c54be8be38130e232f56c331be61, version: 1, ttl: 1767323645, data: { userId: u-alice, hash: 397475ca4d5d6aa2161d4364750e1d865832329fa3b5314ca170ea648685bdc0, attempts: 0, used: false, expires: 1767323645000, tokenVersion: 1 } }
    steps:
