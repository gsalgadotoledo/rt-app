      - { call: mailbox, args: [], expect: { value: [ { email: alice@example.test, code: { $regex: "^[1-9][0-9]{5}$" }, purpose: login } ] } }
      - call: row
        args: [ CHALLENGE, b45bc2fe0155c496812b155c5ec1cc508f15c54be8be38130e232f56c331be61 ]
        expect: { value: { pk: CHALLENGE, sk: b45bc2fe0155c496812b155c5ec1cc508f15c54be8be38130e232f56c331be61, version: 1, ttl: 1767323645, data: { userId: u-alice, hash: { $regex: "^[0-9a-f]{64}$" }, attempts: 0, used: false, expires: 1767323645000, tokenVersion: 1 } } }
        note: "sk = HMAC(secret, 'login:alice@example.test')"
      - { call: consume, args: [ alice@example.test, { $ref: "1.value[0].code" }, login, 1.1.1.1 ], expect: { value: { token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2IjoxLCJzdWIiOiJ1LWFsaWNlIiwiaXNzIjoicnQtYXBwIiwiYXVkIjoicnQtYXBwLWFwaSIsImlhdCI6MTc2NzMyMzA0NSwiZXhwIjoxNzY3MzIzOTQ1fQ.qNKkRWON9X82AHVk6-uFrQWV6Nt-qCNhtR3pff8L8mo", expiresIn: 900, user: { $partial: { id: u-alice } } } } }
      - { call: consume, args: [ alice@example.test, { $ref: "1.value[0].code" }, login, 1.1.1.1 ], expect: { error: { status: 400, message: Invalid or expired code } }, note: codes are single-use }
      - { call: row, args: [ CHALLENGE, b45bc2fe0155c496812b155c5ec1cc508f15c54be8be38130e232f56c331be61 ], expect: { value: { $partial: { version: 2, data: { $partial: { used: true, attempts: 0 } } } } } }

