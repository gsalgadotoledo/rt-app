    tags: [ interop, totp ]
    steps:
      - { call: totpCode, args: [ GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ, 1 ], expect: { value: "287082" } }
      - { call: totpCode, args: [ GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ, 37037036 ], expect: { value: "081804" } }
      - { call: totpCode, args: [ GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ, 37037037 ], expect: { value: "050471" } }
      - { call: totpCode, args: [ GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ, 41152263 ], expect: { value: "005924" } }
      - { call: totpCode, args: [ GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ, 66666666 ], expect: { value: "279037" } }
      - { call: totpCode, args: [ GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ, 666666666 ], expect: { value: "353130" } }
      - { call: totpCode, args: [ GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ, 58910768 ], expect: { value: "652348" }, note: the step of the contract clock }

