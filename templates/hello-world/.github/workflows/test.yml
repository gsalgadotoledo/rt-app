name: RT-App checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.0
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: npm test
      - run: npm run lambda:build
      - run: npm run test:dynamo
        env:
          DYNAMODB_TEST_ENDPOINT: http://127.0.0.1:8000
          AWS_ACCESS_KEY_ID: localtest
          AWS_SECRET_ACCESS_KEY: localtest
          AWS_REGION: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - run: |
          terraform fmt -check -recursive infra rt-app/infra rt-app/admin/infra rt-app/packages/auth-cognito/infra
          terraform -chdir=rt-app/infra/aws/bootstrap init -backend=false -input=false
          terraform -chdir=rt-app/infra/aws/bootstrap validate
          terraform -chdir=rt-app/infra/aws/bootstrap test
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws test
          terraform -chdir=rt-app/infra/aws/ssr init -backend=false -input=false
          terraform -chdir=rt-app/infra/aws/ssr test
          terraform -chdir=rt-app/packages/auth-cognito/infra init -backend=false -input=false
          terraform -chdir=rt-app/packages/auth-cognito/infra test
