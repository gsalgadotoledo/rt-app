name: RT-App checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: npm test
      - run: npm run lambda:build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - run: |
          terraform fmt -check -recursive infra node_modules/@gsalgadotoledo/rt-app-infra/terraform node_modules/@gsalgadotoledo/rt-app-auth-cognito/infra
          terraform -chdir=node_modules/@gsalgadotoledo/rt-app-infra/terraform/aws/bootstrap init -backend=false -input=false
          terraform -chdir=node_modules/@gsalgadotoledo/rt-app-infra/terraform/aws/bootstrap validate
          terraform -chdir=node_modules/@gsalgadotoledo/rt-app-infra/terraform/aws/bootstrap test
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws test
          terraform -chdir=node_modules/@gsalgadotoledo/rt-app-infra/terraform/aws/ssr init -backend=false -input=false
          terraform -chdir=node_modules/@gsalgadotoledo/rt-app-infra/terraform/aws/ssr test
          terraform -chdir=node_modules/@gsalgadotoledo/rt-app-auth-cognito/infra init -backend=false -input=false
          terraform -chdir=node_modules/@gsalgadotoledo/rt-app-auth-cognito/infra test
